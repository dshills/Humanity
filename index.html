/* ======== src/data/02-ancient.js ======== */
/* HT.events — Neolithic and Bronze Age, 10,000 BCE to 500 BCE (CONTRACT.md §6)
 *
 * Dates are the commonly cited values. Day-precision entries (Rome, the eclipse of
 * Thales, the fall of Babylon) use the traditional calendar date as commonly quoted,
 * without Julian-to-Gregorian conversion, so tooltips show the familiar date.
 * Events are filed by start date; a ranged event that begins in this era may end after
 * 500 BCE (Zhou, Olmec, Bantu expansion) and is not repeated in 03-classical.js.
 * Each event carries a `link` to the English Wikipedia article for further reading.
 */
(function (root) {
  'use strict';
  const HT = root.HT || (root.HT = {});
  const { bce, ce, ymd, ya } = HT.time;
  HT.events = HT.events || [];
  HT.events.push(
    // ---- Neolithic ---------------------------------------------------------
    { t: bce(10000), end: bce(4000), title: 'Neolithic Revolution',
      detail: 'Over six millennia, farming and herding arose independently in the Fertile Crescent, China, New Guinea, Mesoamerica, the Andes and Africa, replacing foraging with settled villages, growing populations and eventually cities.',
      tier: 1, category: 'agriculture', link: 'https://en.wikipedia.org/wiki/Neolithic_Revolution' },
    { t: bce(9500), title: 'Hunter-gatherers raise the stone pillars of Göbekli Tepe',
      detail: 'Carved T-shaped megaliths in southeastern Anatolia form the oldest known monumental sanctuary, built by people who had not yet adopted farming.',
      tier: 3, category: 'religion', link: 'https://en.wikipedia.org/wiki/G%C3%B6bekli_Tepe' },
    { t: bce(9500), title: 'Wheat and barley are domesticated in the Fertile Crescent',
      detail: 'Villagers in the Levant and the Zagros foothills begin cultivating einkorn, emmer and barley, launching the Neolithic Revolution that made cities possible.',
      tier: 0, category: 'agriculture', link: 'https://en.wikipedia.org/wiki/Neolithic_founder_crops' },
    { t: bce(9400), title: 'Ounjougou: Africa\'s earliest pottery is made in the Sahel (c. 9400 BCE)',
      detail: 'Sherds from Ounjougou on the Bandiagara plateau of Mali, over 11,000 years old, show that hunter-gatherers of a then-green Sahara invented pottery independently, probably to cook wild grains, long before farming reached West Africa.',
      tier: 4, category: 'technology', link: 'https://en.wikipedia.org/wiki/Ounjougou' },
    { t: bce(9000), title: 'Jericho grows into one of the world\'s first towns',
      detail: 'A permanent settlement by the spring at Tell es-Sultan is later ringed by a stone wall and tower, the earliest known town fortifications.',
      tier: 3, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Tell_es-Sultan' },
    { t: bce(8500), end: bce(6500), title: 'Sheep, goats, cattle and pigs are domesticated in the Near East',
      detail: 'During the Pre-Pottery Neolithic B, villagers from Anatolia to the Zagros turn wild sheep, goats, aurochs and boar into herd animals, adding meat, milk and wool to the new farming economy and plastering skulls of their ancestors.',
      tier: 4, category: 'agriculture', link: 'https://en.wikipedia.org/wiki/Pre-Pottery_Neolithic_B' },
    { t: bce(8000), title: 'Nataruk massacre: foragers slaughtered beside a Kenyan lagoon (c. 8000 BCE)',
      detail: 'The skeletons of at least 27 people, including women and children, with crushed skulls, embedded obsidian blades and bound hands, lie where they fell near Lake Turkana, the earliest known massacre of hunter-gatherers.',
      tier: 5, category: 'war', link: 'https://en.wikipedia.org/wiki/Nataruk' },
    { t: bce(7500), end: bce(6400), title: 'Çatalhöyük flourishes as a Neolithic town in Anatolia',
      detail: 'Thousands of people live in tightly packed mud-brick houses entered from the roofs, decorating walls with murals and burying their dead beneath the floors.',
      tier: 3, category: 'civilization', link: 'https://en.wikipedia.org/wiki/%C3%87atalh%C3%B6y%C3%BCk' },
    { t: bce(7000), title: 'Rice is domesticated in the Yangtze River valley',
      detail: 'Farmers in southern China cultivate wild rice into a staple that would eventually feed more people than any other crop.',
      tier: 2, category: 'agriculture', link: 'https://en.wikipedia.org/wiki/History_of_rice_cultivation' },
    { t: bce(7000), title: 'Maize is domesticated from teosinte in southern Mexico',
      detail: 'In the Balsas River valley, people selectively breed the grass teosinte into corn, the crop that underpinned every major civilization of the Americas.',
      tier: 2, category: 'agriculture', link: 'https://en.wikipedia.org/wiki/Maize' },
    { t: bce(7000), title: 'Kuk Swamp: New Guinea highlanders farm taro and bananas (c. 7000 BCE)',
      detail: 'Drainage ditches and planting pits in the Wahgi valley show that New Guineans independently invented agriculture, cultivating taro, yams and, by about 5000 BCE, the bananas from which most of the world\'s varieties descend.',
      tier: 3, category: 'agriculture', link: 'https://en.wikipedia.org/wiki/Kuk_Swamp' },
    { t: bce(6600), title: 'Jiahu villagers play bone flutes and brew a fermented drink',
      detail: 'A Neolithic village in Henan yields crane-bone flutes that still play a scale, residues of a rice, honey and fruit beverage, and turtle shells scratched with signs that some see as forerunners of Chinese writing.',
      tier: 4, category: 'art', link: 'https://en.wikipedia.org/wiki/Jiahu' },
    { t: bce(6500), title: 'Dentists at Mehrgarh drill teeth with flint bits (c. 6500 BCE)',
      detail: 'At Mehrgarh, the earliest farming village on the Indian subcontinent, eleven molars from nine people show neat holes bored with bow drills to treat decay, the oldest evidence of dentistry, in a community growing wheat, barley and cotton.',
      tier: 4, category: 'medicine', link: 'https://en.wikipedia.org/wiki/Mehrgarh' },
    { t: bce(6000), title: 'Earliest known winemaking in the South Caucasus (c. 6000 BCE)',
      detail: 'Tartaric acid residues in large clay jars from Neolithic villages south of Tbilisi, Georgia, show grapes being fermented into wine about 8,000 years ago, the oldest chemical evidence of viticulture.',
      tier: 4, category: 'agriculture', link: 'https://en.wikipedia.org/wiki/Georgian_wine' },
    { t: bce(5500), title: 'Linear Pottery farmers carry agriculture across central Europe',
      detail: 'Migrants from Anatolia and the Balkans spread wheat, cattle and longhouse villages along the Danube and into the loess lands of Germany and France.',
      tier: 4, category: 'migration', link: 'https://en.wikipedia.org/wiki/Linear_Pottery_culture' },
    { t: bce(5000), title: 'Copper smelting begins in the Balkans and the Near East',
      detail: 'Metalworkers learn to extract copper from ore in furnaces, opening the Chalcolithic age and the path toward bronze.',
      tier: 3, category: 'technology', link: 'https://en.wikipedia.org/wiki/Chalcolithic' },
    { t: bce(5000), end: bce(3000), title: 'Yangshao culture paints pottery and farms millet along the Yellow River',
      detail: 'Villages such as Banpo, ringed by ditches and filled with semi-subterranean houses, grow millet, raise pigs and silkworms and produce red pottery painted with fish and geometric designs, the first great Neolithic culture of northern China.',
      tier: 4, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Yangshao_culture' },
    { t: bce(4800), title: 'Cattle herders raise a stone circle at Nabta Playa in the Sahara',
      detail: 'Nomads who watered their cattle at a seasonal lake in southern Egypt set up standing stones aligned to the summer solstice sunrise, one of the earliest known astronomical monuments, a millennium before pharaonic Egypt.',
      tier: 4, category: 'religion', link: 'https://en.wikipedia.org/wiki/Nabta_Playa' },
    { t: bce(4500), title: 'Varna necropolis holds the oldest known gold treasure',
      detail: 'Graves near Varna on the Bulgarian Black Sea coast contain some 3,000 gold objects, including a sceptre and a penis sheath in a single rich burial, the earliest evidence of wealth and rank displayed in gold.',
      tier: 4, category: 'art', link: 'https://en.wikipedia.org/wiki/Varna_Necropolis' },
    { t: bce(4000), title: 'Ox-drawn ard ploughs turn the soil of Mesopotamia and Europe (c. 4000 BCE)',
      detail: 'Cattle yoked to a simple scratch plough let a family till far more land than digging sticks allowed; plough marks preserved under Neolithic barrows and Sumerian pictographs put the invention in the fourth millennium BCE.',
      tier: 3, category: 'agriculture', link: 'https://en.wikipedia.org/wiki/Ard_(plough)' },

    // ---- Urban revolution and early Bronze Age ----------------------------
    { t: bce(4000), end: bce(3100), title: 'Uruk period: the first cities rise in Sumer',
      detail: 'Uruk in southern Mesopotamia grows to tens of thousands of people, with monumental temples, mass-produced pottery and the first bureaucracy.',
      tier: 0, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Uruk_period' },
    { t: bce(3600), title: 'Chinese farmers raise silkworms and weave silk (c. 3600 BCE)',
      detail: 'Silk protein traces in tombs at Jiahu and woven fragments from Qingtai in Henan show that Neolithic Chinese were unreeling cocoons of the domesticated silk moth; the secret of sericulture was guarded for the next 4,000 years.',
      tier: 4, category: 'technology', link: 'https://en.wikipedia.org/wiki/History_of_silk' },
    { t: bce(3500), title: 'The wheel appears in Mesopotamia, the Caucasus and central Europe',
      detail: 'Potter\'s wheels and the first wheeled carts emerge almost simultaneously in Sumer, the Caucasus and central Europe, transforming transport and craft.',
      tier: 1, category: 'technology', link: 'https://en.wikipedia.org/wiki/Wheel' },
    { t: bce(3500), title: 'Botai people of Kazakhstan corral and milk horses',
      detail: 'Huge bone deposits and possible milk residues point to early horse husbandry, but ancient DNA shows these animals were kin to Przewalski\'s horse, not ancestors of today\'s domestic breeds.',
      tier: 5, category: 'agriculture', link: 'https://en.wikipedia.org/wiki/Botai_culture' },
    { t: bce(3300), title: 'Bronze Age begins as smiths alloy copper with tin',
      detail: 'Harder, castable bronze replaces stone and pure copper for tools and weapons, driving long-distance trade in tin from Anatolia to Britain.',
      tier: 1, category: 'technology', link: 'https://en.wikipedia.org/wiki/Bronze_Age' },
    { t: bce(3300), title: 'Ötzi the Iceman dies in the Ötztal Alps',
      detail: 'A man shot by an arrow is preserved in glacier ice with his copper axe, clothing and tattoos, becoming the best-studied prehistoric human ever found.',
      tier: 5, category: 'technology', link: 'https://en.wikipedia.org/wiki/%C3%96tzi' },
    { t: bce(3200), title: 'Sumerians invent cuneiform writing at Uruk',
      detail: 'Temple accountants press wedge-shaped signs into clay tablets to record goods and rations, creating the first true writing system and the start of recorded history.',
      tier: 0, category: 'technology', link: 'https://en.wikipedia.org/wiki/Cuneiform' },
    { t: bce(3200), title: 'Egyptian hieroglyphs first appear at Abydos',
      detail: 'Ivory tags and pottery in tomb U-j carry the earliest Egyptian script, a system that would serve pharaonic culture for more than three millennia.',
      tier: 3, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Egyptian_hieroglyphs' },
    { t: bce(3200), title: 'Newgrange passage tomb is built to catch the midwinter sunrise',
      detail: 'Neolithic farmers in the Boyne valley of Ireland heap 200,000 tonnes of stone over a passage that the rising sun floods for a few minutes each winter solstice, a monument older than Stonehenge and the Great Pyramid.',
      tier: 4, category: 'religion', link: 'https://en.wikipedia.org/wiki/Newgrange' },
    { t: bce(3100), title: 'Narmer unifies Upper and Lower Egypt',
      detail: 'The king depicted on the Narmer Palette joins the Nile valley and delta into a single state, founding the First Dynasty and 3,000 years of pharaonic rule.',
      tier: 1, category: 'empire', link: 'https://en.wikipedia.org/wiki/Narmer' },
    { t: bce(3000), title: 'Yamnaya herders spread Indo-European languages from the steppe',
      detail: 'Mobile pastoralists with wagons and horses expand from the Pontic-Caspian steppe into Europe and Asia, seeding most of the languages spoken there today.',
      tier: 3, category: 'migration', link: 'https://en.wikipedia.org/wiki/Yamnaya_culture' },
    { t: bce(3000), title: 'Austronesian seafarers set out from Taiwan to settle the islands (c. 3000 BCE)',
      detail: 'Farmers speaking Austronesian languages cross from Taiwan to the Philippines and on through Indonesia, carrying rice, pigs and outrigger canoes on a migration that would eventually reach Madagascar, Hawaii and New Zealand.',
      tier: 3, category: 'migration', link: 'https://en.wikipedia.org/wiki/Austronesian_peoples' },
    { t: bce(3000), end: bce(1800), title: 'Caral and the Norte Chico cities rise on the coast of Peru',
      detail: 'Pyramid mounds, sunken plazas and irrigated cotton fields at Caral in the Supe valley mark the oldest urban civilization in the Americas, contemporary with the pyramids of Egypt and built without pottery or writing.',
      tier: 3, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Caral%E2%80%93Supe_civilization' },
    { t: bce(2650), title: 'Imhotep designs the Step Pyramid of Djoser at Saqqara',
      detail: 'The vizier and architect Imhotep stacks six stone mastabas into a 60-metre step pyramid for King Djoser, the first large stone building in the world; later Egyptians worshipped him as a god of medicine and wisdom.',
      tier: 3, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Pyramid_of_Djoser' },
    { t: bce(2600), end: bce(1900), title: 'Indus Valley cities of Harappa and Mohenjo-daro flourish',
      detail: 'Planned brick cities with drains, standardized weights and an undeciphered script span the Indus basin, the largest civilization of the Bronze Age.',
      tier: 2, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Indus_Valley_Civilisation' },
    { t: bce(2560), title: 'Great Pyramid of Giza is completed for Khufu',
      detail: 'More than two million limestone blocks form a 146-meter tomb that remained the tallest structure on Earth for nearly 4,000 years.',
      tier: 2, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Great_Pyramid_of_Giza' },
    { t: bce(2500), title: 'Stonehenge\'s sarsen circle is raised on Salisbury Plain',
      detail: 'Builders erect 25-ton sarsen trilithons aligned to the solstices around an older ring of Welsh bluestones, creating Europe\'s most famous prehistoric monument.',
      tier: 3, category: 'religion', link: 'https://en.wikipedia.org/wiki/Stonehenge' },
    { t: bce(2500), title: 'Sumerian scribes are thought to use the first abacus',
      detail: 'A counting board for the sexagesimal number system, inferred from Sumerian arithmetic rather than any surviving artifact, would be the earliest mechanical aid to calculation.',
      tier: 5, category: 'computing', link: 'https://en.wikipedia.org/wiki/Abacus' },
    { t: bce(2500), end: bce(1500), title: 'Kingdom of Kerma rules Nubia on the upper Nile',
      detail: 'The first great state of sub-Saharan Africa builds a city with a huge mud-brick temple, the Western Deffufa, trades gold, ivory and ebony with Egypt and buries its kings under mounds with hundreds of sacrificed retainers.',
      tier: 4, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Kerma_culture' },
    { t: bce(2334), title: 'Sargon of Akkad founds the world\'s first empire',
      detail: 'A cupbearer turned king conquers the Sumerian city-states and rules from the Mediterranean to the Persian Gulf, the first multi-ethnic empire in history.',
      tier: 2, category: 'empire', link: 'https://en.wikipedia.org/wiki/Sargon_of_Akkad' },
    { t: bce(2285), title: 'Enheduanna, high priestess of Ur, becomes the first named author',
      detail: 'Sargon\'s daughter composes hymns to the goddess Inanna and to the temples of Sumer, signing her name to them; her poems were copied by scribes for centuries and make her the earliest author in history known by name.',
      tier: 4, category: 'art', link: 'https://en.wikipedia.org/wiki/Enheduanna' },
    { t: bce(2200), title: 'Domestic horses spread across Eurasia from the Pontic-Caspian steppe',
      detail: 'A single lineage from the lower Volga-Don steppe, traced by ancient DNA, replaces every other horse population within a few centuries and carries riding and chariotry across the continent.',
      tier: 3, category: 'agriculture', link: 'https://en.wikipedia.org/wiki/Domestication_of_the_horse' },
    { t: bce(2200), title: '4.2-kiloyear drought shakes the Akkadian Empire and Old Kingdom Egypt',
      detail: 'A severe, centuries-long dry spell recorded from the Indus to the Nile coincides with the collapse of Akkad, the breakdown of central rule in Egypt and the decline of Harappan cities, and now defines the start of the Meghalayan age.',
      tier: 3, category: 'origins', link: 'https://en.wikipedia.org/wiki/4.2-kiloyear_event' },
    { t: bce(2100), title: 'Sumerian poets compose the earliest tales of Gilgamesh',
      detail: 'Stories of the king of Uruk who sought immortality are written down under the Third Dynasty of Ur, the seed of the oldest surviving epic.',
      tier: 3, category: 'art', link: 'https://en.wikipedia.org/wiki/Epic_of_Gilgamesh' },
    { t: bce(2100), title: 'Ur-Nammu issues the oldest surviving law code',
      detail: 'The founder of the Third Dynasty of Ur sets out fines and penalties in Sumerian, three centuries before Hammurabi; most offences are punished with silver payments rather than mutilation, and the prologue promises justice for orphans and widows.',
      tier: 4, category: 'politics', link: 'https://en.wikipedia.org/wiki/Code_of_Ur-Nammu' },
    { t: bce(2000), end: ce(500), title: 'Bantu-speaking peoples expand across sub-Saharan Africa',
      detail: 'Farmers from the Nigeria-Cameroon borderlands spread south and east over some 2,500 years, carrying their languages across half the continent; when the movement began, between 3000 and 1000 BCE, is debated.',
      tier: 3, category: 'migration', link: 'https://en.wikipedia.org/wiki/Bantu_expansion' },
    { t: bce(2000), title: 'Spoked-wheel war chariots appear in the Sintashta culture',
      detail: 'Light horse-drawn chariots built on the Ural steppe spread rapidly to the Near East, China and India, dominating battlefields for a thousand years.',
      tier: 4, category: 'technology', link: 'https://en.wikipedia.org/wiki/Sintashta_culture' },

    // ---- Middle and Late Bronze Age ---------------------------------------
    { t: bce(1900), end: bce(1450), title: 'Minoan palace civilization flourishes on Crete',
      detail: 'Europe\'s first advanced civilization builds sprawling palaces at Knossos and Phaistos, trades across the Aegean and writes in the undeciphered Linear A.',
      tier: 3, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Minoan_civilization' },
    { t: bce(1800), end: bce(300), title: 'Tichitt tradition: stone villages and pearl millet in the Sahara (c. 1800 BCE)',
      detail: 'On the Dhar Tichitt escarpment of Mauritania, cattle herders build hundreds of dry-stone walled villages and domesticate pearl millet, the earliest known farming settlements in West Africa, abandoned as the desert dried and later linked to the rise of Ghana.',
      tier: 4, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Tichitt_Tradition' },
    { t: bce(1754), title: 'Hammurabi issues his law code in Babylon',
      detail: 'Nearly 300 laws carved on a basalt stele set out fixed penalties and the principle of an eye for an eye, the most complete legal code of the ancient world.',
      tier: 2, category: 'politics', link: 'https://en.wikipedia.org/wiki/Code_of_Hammurabi' },
    { t: bce(1700), end: bce(1100), title: 'Poverty Point: hunter-gatherers build vast earthworks in Louisiana',
      detail: 'Without farming, people on the lower Mississippi raise six concentric ridges and a 22-metre mound at Poverty Point and trade for copper and stone from a thousand kilometres away, the largest construction in North America for two millennia.',
      tier: 4, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Poverty_Point' },
    { t: bce(1650), end: bce(1178), title: 'Hittite Empire rules Anatolia from Hattusa',
      detail: 'An Indo-European kingdom sacks Babylon, masters chariot warfare and rivals Egypt for control of Syria until its capital Hattusa is abandoned around 1180 BCE.',
      tier: 3, category: 'empire', link: 'https://en.wikipedia.org/wiki/Hittites' },
    { t: bce(1650), title: 'Babylonian astronomers record the risings of Venus',
      detail: 'The Venus tablet of Ammisaduqa logs 21 years of the planet\'s appearances, the oldest surviving systematic astronomical observations.',
      tier: 4, category: 'space', link: 'https://en.wikipedia.org/wiki/Venus_tablet_of_Ammisaduqa' },
    { t: bce(1600), title: 'Edwin Smith Papyrus describes surgery and trauma cases',
      detail: 'An Egyptian scroll details 48 injuries with examination, diagnosis and treatment, the earliest known rational medical text.',
      tier: 4, category: 'medicine', link: 'https://en.wikipedia.org/wiki/Edwin_Smith_Papyrus' },
    { t: bce(1600), end: bce(1046), title: 'Shang dynasty rules the Yellow River valley',
      detail: 'China\'s first historically attested dynasty casts elaborate bronze vessels, builds walled cities and keeps royal records on oracle bones.',
      tier: 3, category: 'empire', link: 'https://en.wikipedia.org/wiki/Shang_dynasty' },
    { t: bce(1600), title: 'Thera erupts, burying the Minoan town of Akrotiri (c. 1600 BCE)',
      detail: 'One of the largest eruptions of the past 10,000 years blows apart the island of Santorini, preserving the frescoed houses of Akrotiri under ash and sending tsunamis against Crete; it is often linked to the later decline of Minoan power.',
      tier: 3, category: 'origins', link: 'https://en.wikipedia.org/wiki/Minoan_eruption' },
    { t: bce(1550), title: 'Ahmes copies the Rhind Mathematical Papyrus',
      detail: 'A scribe named Ahmes copies 84 problems on fractions, areas, pyramids and the division of loaves from an older text, the fullest surviving record of Egyptian mathematics, which used unit fractions and a value of pi near 3.16.',
      tier: 4, category: 'science', link: 'https://en.wikipedia.org/wiki/Rhind_Mathematical_Papyrus' },
    { t: bce(1500), title: 'Hymns of the Rigveda are composed in Vedic Sanskrit',
      detail: 'Indo-Aryan priests in the Punjab compose over a thousand hymns to the gods, the oldest scripture of Hinduism, transmitted orally for centuries.',
      tier: 3, category: 'religion', link: 'https://en.wikipedia.org/wiki/Rigveda' },
    { t: bce(1470), title: 'Hatshepsut sends a trading expedition to the Land of Punt',
      detail: 'The female pharaoh dispatches five ships down the Red Sea to Punt, probably on the Horn of Africa, returning with living myrrh trees, ebony, gold and baboons; reliefs at her temple of Deir el-Bahari record the voyage in detail.',
      tier: 4, category: 'exploration', link: 'https://en.wikipedia.org/wiki/Hatshepsut' },
    { t: bce(1450), title: 'Mycenaean Greeks take over Crete and write Greek in Linear B',
      detail: 'Warrior kings of Mycenae, Pylos and Thebes rule fortified palaces on the mainland, seize Knossos and adapt the Minoan script to record their stores in the earliest written Greek, deciphered by Michael Ventris in 1952.',
      tier: 3, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Mycenaean_Greece' },
    { t: bce(1353), end: bce(1336), title: 'Akhenaten imposes worship of the sun disc Aten',
      detail: 'The pharaoh suppresses Egypt\'s traditional gods, builds a new capital at Amarna and promotes a single deity, an experiment reversed after his death.',
      tier: 5, category: 'religion', link: 'https://en.wikipedia.org/wiki/Akhenaten' },
    { t: bce(1274), title: 'Ramesses II fights the Hittites at the Battle of Kadesh',
      detail: 'Thousands of chariots clash on the Orontes in the best-documented battle of the Bronze Age, ending in a stalemate and later the first known peace treaty.',
      tier: 4, category: 'war', link: 'https://en.wikipedia.org/wiki/Battle_of_Kadesh' },
    { t: bce(1259), title: 'Egypt and the Hittites sign the first known peace treaty',
      detail: 'Ramesses II and Hattusili III swear eternal friendship, mutual defence and the return of fugitives in a treaty preserved both on Egyptian temple walls and on Hittite clay tablets; a copy hangs at the United Nations.',
      tier: 4, category: 'politics', link: 'https://en.wikipedia.org/wiki/Egyptian%E2%80%93Hittite_peace_treaty' },
    { t: bce(1250), title: 'Shang diviners carve the earliest Chinese writing on oracle bones',
      detail: 'Kings at Anyang have questions about harvests, war and the weather scratched onto turtle shells and ox shoulder blades, then cracked with heat to read the answer; the 4,000-odd characters are the direct ancestors of modern Chinese script.',
      tier: 3, category: 'technology', link: 'https://en.wikipedia.org/wiki/Oracle_bone' },
    { t: bce(1200), title: 'Iron Age begins as ironworking spreads from Anatolia',
      detail: 'Smiths learn to smelt and carburize iron, a metal far more abundant than tin, putting cheap hard tools and weapons in the hands of ordinary farmers and soldiers.',
      tier: 1, category: 'technology', link: 'https://en.wikipedia.org/wiki/Iron_Age' },
    { t: bce(1200), end: bce(1150), title: 'Late Bronze Age collapse topples the eastern Mediterranean',
      detail: 'Within decades the Hittite Empire, Mycenaean Greece and Ugarit fall amid drought, migrations and the Sea Peoples, and literacy vanishes from Greece for centuries.',
      tier: 3, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Late_Bronze_Age_collapse' },
    { t: bce(1200), end: bce(400), title: 'Olmec civilization flourishes on the Gulf coast of Mexico',
      detail: 'Mesoamerica\'s first complex society carves colossal basalt heads at San Lorenzo and La Venta and pioneers the ballgame, calendar and writing later used by the Maya.',
      tier: 3, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Olmecs' },

    // ---- Early Iron Age -----------------------------------------------------
    { t: bce(1050), title: 'Phoenicians spread the first widely used alphabet',
      detail: 'A script of 22 consonant letters, carried by Phoenician traders, becomes the ancestor of the Greek, Latin, Hebrew, Arabic and most other alphabets.',
      tier: 1, category: 'technology', link: 'https://en.wikipedia.org/wiki/Phoenician_alphabet' },
    { t: bce(1046), end: bce(256), title: 'Zhou dynasty overthrows the Shang and rules China',
      detail: 'King Wu defeats the Shang at Muye and his house rules under the Mandate of Heaven, China\'s longest dynasty and the age of Confucius and Laozi.',
      tier: 3, category: 'empire', link: 'https://en.wikipedia.org/wiki/Zhou_dynasty' },
    { t: bce(1000), title: 'Zoroaster preaches a religion of one supreme god in Iran',
      detail: 'The prophet\'s Gathas proclaim Ahura Mazda and a cosmic struggle between good and evil, ideas that shaped Judaism, Christianity and Islam; his dates are disputed.',
      tier: 4, category: 'religion', link: 'https://en.wikipedia.org/wiki/Zoroaster' },
    { t: bce(1000), title: 'Lapita voyagers reach Fiji, Tonga and Samoa by canoe',
      detail: 'Austronesian seafarers with outrigger canoes cross hundreds of kilometers of open Pacific, settling the islands from which Polynesia was later colonized.',
      tier: 4, category: 'migration', link: 'https://en.wikipedia.org/wiki/Lapita_culture' },
    { t: bce(911), end: bce(609), title: 'Neo-Assyrian Empire dominates the Near East',
      detail: 'Iron-armed armies and mass deportations bring Mesopotamia, the Levant and briefly Egypt under Assyrian rule until Nineveh falls to the Babylonians and Medes.',
      tier: 3, category: 'empire', link: 'https://en.wikipedia.org/wiki/Neo-Assyrian_Empire' },
    { t: bce(900), end: bce(200), title: 'Chavín de Huántar draws pilgrims to the Peruvian Andes',
      detail: 'A temple complex of stone galleries, drains that roar with water and the fanged Lanzón idol becomes the religious centre of the first culture to unite the Andes, spreading its jaguar and serpent imagery from the coast to the highlands.',
      tier: 4, category: 'religion', link: 'https://en.wikipedia.org/wiki/Chav%C3%ADn_culture' },
    { t: bce(814), title: 'Phoenician colonists from Tyre found Carthage',
      detail: 'By tradition Queen Dido establishes the North African port that anchors a Phoenician trading network reaching Spain and beyond the Strait of Gibraltar.',
      tier: 4, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Ancient_Carthage' },
    { t: bce(776), title: 'First recorded Olympic Games are held at Olympia',
      detail: 'A footrace won by Coroebus of Elis begins the four-yearly festival of Zeus that Greeks later used to reckon their dates.',
      tier: 4, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Ancient_Olympic_Games' },
    { t: bce(753, 4, 21), title: 'Rome is founded by Romulus, according to tradition',
      detail: 'Roman historians dated their city\'s foundation on the Palatine Hill to 21 April 753 BCE, the starting point of the ab urbe condita calendar.',
      tier: 3, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Founding_of_Rome' },
    { t: bce(750), title: 'Homer\'s Iliad and Odyssey are composed',
      detail: 'The Greek epics of the Trojan War and the wanderings of Odysseus take their lasting form, becoming the foundation of Western literature.',
      tier: 3, category: 'art', link: 'https://en.wikipedia.org/wiki/Homer' },
    { t: bce(728), title: 'Piye of Kush conquers Egypt and founds the Nubian 25th Dynasty',
      detail: 'The king of Napata marches north from Sudan, takes Memphis and receives the submission of the Nile delta princes; his Victory Stela describes the campaign, and his successors rule Egypt as "Black Pharaohs" for two generations.',
      tier: 4, category: 'empire', link: 'https://en.wikipedia.org/wiki/Piye' },
    { t: bce(700), title: 'Sages of the Upanishads teach Brahman, atman and rebirth (c. 700 BCE)',
      detail: 'Composed in the Ganges plain over several centuries, the earliest Upanishads turn Vedic ritual inward, arguing that the individual self is one with the universal spirit and introducing karma and reincarnation to Indian thought.',
      tier: 3, category: 'religion', link: 'https://en.wikipedia.org/wiki/Upanishads' },
    { t: bce(650), title: 'Ashurbanipal assembles the great library of Nineveh',
      detail: 'The last great Assyrian king orders scribes across Mesopotamia to copy every tablet of learning for his palace; the 30,000 fragments dug up in the 1850s include the Epic of Gilgamesh and the first systematically collected library known.',
      tier: 4, category: 'science', link: 'https://en.wikipedia.org/wiki/Library_of_Ashurbanipal' },
    { t: bce(610), title: 'Sappho composes lyric poetry on the island of Lesbos',
      detail: 'The poet of Mytilene sings of love and longing in verses that Plato later called the work of a tenth Muse; though only fragments survive, her metre and her frankness shaped lyric poetry for two and a half millennia.',
      tier: 4, category: 'art', link: 'https://en.wikipedia.org/wiki/Sappho' },
    { t: bce(600), title: 'Lydia strikes the first coins in electrum',
      detail: 'Stamped lumps of gold-silver alloy issued in Sardis create standardized money, an idea that spread through Greece and Persia within a century.',
      tier: 3, category: 'technology', link: 'https://en.wikipedia.org/wiki/Lydia' },
    { t: bce(600), title: 'Phoenician sailors circumnavigate Africa for Pharaoh Necho II (c. 600 BCE)',
      detail: 'According to Herodotus, a fleet sent by Necho II sailed south from the Red Sea, stopped each year to sow and harvest grain, and returned through the Pillars of Hercules after three years, reporting that the sun stood on their right, to the north.',

  HT.events.push(
    // ---- 5th century BCE ------------------------------------------------------------------
    { t: bce(500), title: "Nok culture produces West Africa's earliest terracotta sculptures (c. 500 BCE)",

    { t: bce(500), title: "Sun Tzu's The Art of War is written (c. 500 BCE)",

    { t: bce(490), end: bce(479), title: "Greek city-states repel the Persian invasions of Darius and Xerxes",

    { t: bce(475), end: bce(221), title: "Warring States period in China",

    { t: bce(450), title: "Rome publishes the Twelve Tables, its first written law code",

    { t: bce(447), end: bce(432), title: "Parthenon is built on the Athenian Acropolis",

    { t: bce(431), end: bce(404), title: "Peloponnesian War between Athens and Sparta",

    { t: bce(430), title: "Herodotus completes the Histories, the first work of history (c. 430 BCE)",

    { t: bce(420), title: "Democritus proposes that everything is made of atoms (c. 420 BCE)",

    { t: bce(400), title: "Hippocrates establishes medicine as a rational discipline (c. 400 BCE)",

    // ---- 4th century BCE ------------------------------------------------------------------
    { t: bce(399), title: "Socrates is tried and executed in Athens",

    { t: bce(335), title: "Aristotle founds the Lyceum",

    { t: bce(334), end: bce(323), title: "Alexander the Great conquers the Persian Empire",

    // ---- 3rd century BCE ------------------------------------------------------------------
    { t: bce(300), title: "Euclid compiles the Elements (c. 300 BCE)",

    { t: bce(300), title: "Yayoi wet-rice farming and bronze spread across Japan (c. 300 BCE)",

    { t: bce(285), title: "Library of Alexandria is founded (c. 285 BCE)",

    { t: bce(256), title: "Li Bing builds the Dujiangyan irrigation system in Sichuan",

    { t: bce(250), title: "Djenné-Djenno, the oldest known city in sub-Saharan Africa, grows (c. 250 BCE)",

    { t: bce(240), title: "Eratosthenes measures the circumference of the Earth (c. 240 BCE)",

    { t: bce(218), title: "Hannibal leads his army and elephants across the Alps",

    { t: bce(214), title: "Qin links frontier walls into the first Great Wall of China",

    { t: bce(212), title: "Archimedes is killed at the fall of Syracuse",

    { t: bce(210), title: "Qin Shi Huang is buried with the Terracotta Army",

    { t: bce(200), title: "Buddhist monks carve the first cave temples at Ajanta (c. 200 BCE)",

    { t: ce(9, 9), title: "Germanic tribes destroy three Roman legions in the Teutoburg Forest",

      tier: 4, category: 'exploration', link: 'https://en.wikipedia.org/wiki/Leif_Erikson' },
    { t: ce(1000), end: ce(1500), title: "Kilwa Kisiwani grows rich on Swahili coast trade (c. 1000)",
      detail: "The island sultanate off Tanzania controlled the gold shipped from Sofala, minted coins and built Africa's largest mosque south of the Sahara; Ibn Battuta in 1331 called it one of the finest cities in the world.",
      tier: 5, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Kilwa_Kisiwani' },
    { t: ce(1010), title: "Murasaki Shikibu completes The Tale of Genji",
      detail: "Written by a lady-in-waiting at the Heian court in Kyoto, the 54-chapter story of Prince Genji and his loves is often called the world's first novel.",
      tier: 5, category: 'art', link: 'https://en.wikipedia.org/wiki/The_Tale_of_Genji' },
    { t: ce(1010), title: "Ferdowsi completes the Shahnameh, the Persian national epic",
      detail: "After some thirty years' work the poet of Tus finished 50,000 couplets on the kings and heroes of Iran from creation to the Arab conquest, preserving the Persian language against Arabic and giving Iran its founding story.",
      tier: 5, category: 'art', link: 'https://en.wikipedia.org/wiki/Shahnameh' },
    { t: ce(1021), title: "Ibn al-Haytham's Book of Optics founds experimental science",
      detail: "Writing in Cairo, Alhazen showed that sight comes from light entering the eye, studied lenses and the camera obscura, and insisted that theories be tested by experiment.",
      tier: 5, category: 'science', link: 'https://en.wikipedia.org/wiki/Book_of_Optics' },
    { t: ce(1025), title: "Avicenna completes The Canon of Medicine",
      detail: "Ibn Sina's five-volume synthesis of Greek and Islamic medicine was the standard medical textbook in both Europe and the Islamic world for more than 600 years.",
      tier: 4, category: 'medicine', link: 'https://en.wikipedia.org/wiki/The_Canon_of_Medicine' },
    { t: ce(1025), title: "Chola navy under Rajendra I raids Srivijaya across the Bay of Bengal",
      detail: "The south Indian empire's fleet sacked the Malay ports of the Srivijaya thalassocracy, a rare seaborne expedition by an Indian state that secured Chola merchants' access to the China trade.",
      tier: 5, category: 'war', link: 'https://en.wikipedia.org/wiki/Chola_invasion_of_Srivijaya' },
    { t: ce(1040), title: "Bi Sheng invents movable-type printing",
      detail: "As described by Shen Kuo, Bi Sheng's baked-clay characters could be arranged, printed and reused; Korea was casting metal type by the 1230s, four centuries before Gutenberg.",
      tier: 3, category: 'technology', link: 'https://en.wikipedia.org/wiki/Bi_Sheng' },
    { t: ce(1044), title: "First gunpowder recipes recorded in the Wujing Zongyao",
      detail: "The Song military compendium gave three formulas of saltpetre, sulphur and charcoal for bombs and fire arrows; gunpowder reached the Islamic world and Europe by the 13th century.",
      tier: 2, category: 'technology', link: 'https://en.wikipedia.org/wiki/Wujing_Zongyao' },
    { t: ce(1050), title: "Cahokia becomes the largest city north of Mexico (c. 1050)",
      detail: "Mississippian farmers near modern St Louis raised more than 100 earthen mounds, including the 30-meter Monks Mound, around plazas serving perhaps 15,000 people; the city was abandoned by 1400.",
      tier: 4, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Cahokia' },
    { t: ymd(1054, 7, 4), title: "Chinese astronomers record the supernova that made the Crab Nebula",
      detail: "The guest star in Taurus shone in daylight for 23 days and at night for almost two years; its remnant, the Crab Nebula, was matched to the record in the 20th century.",
      tier: 6, category: 'space', link: 'https://en.wikipedia.org/wiki/SN_1054' },
    { t: ymd(1054, 7, 16), title: "Great Schism divides the Orthodox and Catholic churches",
      detail: "Papal legates laid a bull of excommunication on the altar of Hagia Sophia and Patriarch Cerularius answered in kind; the breach between Rome and Constantinople never healed.",
      tier: 3, category: 'religion', link: 'https://en.wikipedia.org/wiki/East%E2%80%93West_Schism' },
    { t: ymd(1066, 10, 14), title: "William the Conqueror wins the Battle of Hastings",
      detail: "The Norman victory over King Harold ended Anglo-Saxon rule; Norman French remade England's aristocracy, law and language, and the Domesday survey followed in 1086.",
      tier: 3, category: 'war', link: 'https://en.wikipedia.org/wiki/Battle_of_Hastings' },
    { t: ce(1088), title: "University of Bologna founded, Europe's first university",
      detail: "Students hired masters of Roman law in Bologna; Paris, Oxford and other universities followed within a century, creating the degree-granting institution used worldwide today.",
      tier: 5, category: 'civilization', link: 'https://en.wikipedia.org/wiki/University_of_Bologna' },
    { t: ymd(1095, 11, 27), end: ymd(1099, 7, 15), title: "First Crusade, from Clermont to the capture of Jerusalem",
      detail: "Pope Urban II's call at Clermont sent armies east that took Jerusalem in 1099 amid massacre, founding Crusader states and two centuries of holy war.",
      tier: 3, category: 'war', link: 'https://en.wikipedia.org/wiki/First_Crusade' },

    // ---- 1100–1300 ----
    { t: ce(1100), end: ce(1450), title: "Great Zimbabwe rises as the capital of a gold-trading kingdom",
      detail: "The Shona city's dry-stone walls, up to 11 meters high, enclosed a population of perhaps 18,000 that traded gold and ivory through the Swahili coast as far as China.",
      tier: 5, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Great_Zimbabwe' },
    { t: ce(1113), end: ce(1150), title: "Angkor Wat built by Suryavarman II as a temple to Vishnu",
      detail: "The Khmer Empire's greatest temple, later Buddhist, is the largest religious monument on Earth; the city of Angkor around it may have housed close to a million people.",
      tier: 4, category: 'art', link: 'https://en.wikipedia.org/wiki/Angkor_Wat' },
    { t: ce(1130), end: ce(1190), title: "Toledo translators bring Arabic science to Latin Europe",
      detail: "Scholars such as Gerard of Cremona rendered Arabic versions of Aristotle, Ptolemy, Euclid, al-Khwarizmi and Avicenna into Latin, seeding the universities and the Renaissance.",
      tier: 5, category: 'science', link: 'https://en.wikipedia.org/wiki/Toledo_School_of_Translators' },
    { t: ce(1163), title: "Construction of Notre-Dame de Paris begins",
      detail: "Bishop Maurice de Sully's cathedral, with its pointed arches, rib vaults, flying buttresses and rose windows, became the model of the Gothic style that spread from the Île-de-France across Europe over the next century.",
      tier: 4, category: 'art', link: 'https://en.wikipedia.org/wiki/Notre-Dame_de_Paris' },
    { t: ce(1185), title: "Minamoto no Yoritomo establishes the Kamakura shogunate",
      detail: "After destroying the Taira at Dan-no-ura, Yoritomo ruled from Kamakura as the emperor's military deputy; warrior governments led by shoguns held real power in Japan until 1868.",
      tier: 4, category: 'politics', link: 'https://en.wikipedia.org/wiki/Kamakura_shogunate' },
    { t: ymd(1187, 10, 2), title: "Saladin retakes Jerusalem from the Crusaders",
      detail: "Three months after destroying the Crusader army at Hattin, Saladin accepted the city's surrender and spared its people; the loss launched the Third Crusade under Richard I.",
      tier: 4, category: 'war', link: 'https://en.wikipedia.org/wiki/Siege_of_Jerusalem_(1187)' },
    { t: ce(1200), title: "King Lalibela carves eleven churches from Ethiopian bedrock (c. 1200)",
      detail: "The Zagwe king had monolithic churches, including the cross-shaped Bete Giyorgis, hewn downward into red volcanic tuff and linked by tunnels, creating a New Jerusalem that remains a pilgrimage center.",
      tier: 5, category: 'religion', link: 'https://en.wikipedia.org/wiki/Lalibela' },
    { t: ce(1200), end: ce(1400), title: "Ife artists cast naturalistic bronze and terracotta heads (c. 1200)",
      detail: "In the Yoruba holy city of Ife in Nigeria, sculptors produced lifelike portrait heads in copper alloy and clay, probably of kings, that rank among the finest works of African art.",
      tier: 5, category: 'art', link: 'https://en.wikipedia.org/wiki/If%C3%A8' },
    { t: ce(1200), title: "Polynesians settle Rapa Nui (Easter Island) (c. 1200)",
      detail: "Voyagers reached the most remote inhabited island on Earth and over the following centuries carved and raised nearly 900 moai statues, some weighing more than 80 tonnes, on stone platforms facing inland.",
      tier: 5, category: 'migration', link: 'https://en.wikipedia.org/wiki/Easter_Island' },
    { t: ce(1202), title: "Fibonacci's Liber Abaci brings Hindu-Arabic numerals to Europe",
      detail: "Leonardo of Pisa's book taught merchants place-value arithmetic with the digits 0 to 9 he had learned in North Africa, gradually displacing Roman numerals and the abacus.",
      tier: 5, category: 'science', link: 'https://en.wikipedia.org/wiki/Liber_Abaci' },
    { t: ce(1206), title: "Al-Jazari describes programmable automata in his Book of Ingenious Devices",
      detail: "The Artuqid engineer's treatise details water clocks, crankshafts and a musical boat whose drummers were set by pegged cylinders, an early programmable mechanism.",
      tier: 5, category: 'computing', link: 'https://en.wikipedia.org/wiki/Ismail_al-Jazari' },
    { t: ce(1206), end: ce(1368), title: "Genghis Khan and his heirs build the Mongol Empire",
      detail: "Temujin was proclaimed Genghis Khan in 1206; within 80 years his descendants ruled from Korea to the Rus principalities and raided as far as Hungary, killing tens of millions yet linking Eurasia in trade, ideas and disease.",
      tier: 1, category: 'empire', link: 'https://en.wikipedia.org/wiki/Mongol_Empire' },
    { t: ymd(1215, 6, 15), title: "King John seals Magna Carta at Runnymede",
      detail: "The barons' charter bound the king to the law and promised that no free man be imprisoned without lawful judgment, becoming a touchstone of constitutional government.",
      tier: 3, category: 'politics', link: 'https://en.wikipedia.org/wiki/Magna_Carta' },
    { t: ce(1235), title: "Sundiata Keita founds the Mali Empire after the Battle of Kirina",
      detail: "The Mandinka prince, hero of the Epic of Sundiata sung by griots to this day, defeated the Sosso king Soumaoro and united the Manding chiefdoms into the empire that Mansa Musa later made famous.",
      tier: 4, category: 'empire', link: 'https://en.wikipedia.org/wiki/Sundiata_Keita' },
    { t: ce(1242), title: "Ibn al-Nafis describes the pulmonary circulation of the blood",
      detail: "In a commentary written in Cairo, the Syrian physician rejected Galen's invisible pores in the heart and stated that blood passes from the right ventricle through the lungs to the left, three centuries before Europe.",
      tier: 5, category: 'medicine', link: 'https://en.wikipedia.org/wiki/Ibn_al-Nafis' },
    { t: ce(1250), end: ce(1300), title: "Polynesians settle New Zealand, the last large landmass reached",
      detail: "Double-hulled canoes from East Polynesia carried the ancestors of the Maori to Aotearoa, completing the human settlement of the world's major habitable lands.",
      tier: 3, category: 'migration', link: 'https://en.wikipedia.org/wiki/M%C4%81ori_history' },
    { t: ymd(1258, 2, 10), title: "Mongols sack Baghdad and end the Abbasid caliphate",
      detail: "Hulagu Khan's army stormed the city, killed the caliph al-Musta'sim and slaughtered much of the population; the libraries of the House of Wisdom were destroyed and Baghdad's five centuries as the capital of Islam ended.",
      tier: 4, category: 'war', link: 'https://en.wikipedia.org/wiki/Siege_of_Baghdad' },
    { t: ce(1271), end: ce(1295), title: "Marco Polo travels to Kublai Khan's China",
      detail: "The Venetian merchant spent 17 years in Yuan China; his Travels, dictated in a Genoese prison, gave Europeans their fullest picture of Asia and inspired Columbus.",
      tier: 4, category: 'exploration', link: 'https://en.wikipedia.org/wiki/Marco_Polo' },
    { t: ce(1286), title: "Eyeglasses are invented in northern Italy (c. 1286)",
      detail: "A Pisan friar preached in 1306 that spectacles had been devised less than twenty years earlier; convex lenses set in frames let aging scribes, scholars and craftsmen keep working, and concave lenses followed.",
      tier: 5, category: 'technology', link: 'https://en.wikipedia.org/wiki/Glasses' },
    { t: ce(1299), title: "Osman I founds the Ottoman state in Anatolia",
      detail: "From a small frontier principality near Byzantine Bithynia, Osman's descendants built an empire spanning three continents that lasted until 1922.",
      tier: 4, category: 'empire', link: 'https://en.wikipedia.org/wiki/Osman_I' },

    // ---- 1300–1500 ----
    { t: ce(1300), title: "Mechanical clocks with escapements appear in Europe",
      detail: "Weight-driven clocks with a verge-and-foliot escapement spread through Italian and English churches from about 1300, making hours uniform and time a public commodity.",
      tier: 5, category: 'technology', link: 'https://en.wikipedia.org/wiki/Verge_escapement' },
    { t: ce(1320), title: "Dante completes the Divine Comedy",
      detail: "Written in Tuscan rather than Latin, the poem's journey through Hell, Purgatory and Paradise fixed the Italian literary language and stands among the summits of world literature.",
      tier: 5, category: 'art', link: 'https://en.wikipedia.org/wiki/Divine_Comedy' },
    { t: ce(1324), title: "Mansa Musa's hajj displays the gold of the Mali Empire",
      detail: "The Malian ruler crossed the Sahara with thousands of followers and so much gold that its price in Cairo reportedly slumped for years; Timbuktu flourished as a center of learning.",
      tier: 4, category: 'empire', link: 'https://en.wikipedia.org/wiki/Mansa_Musa' },
    { t: ce(1325), title: "Aztecs found Tenochtitlan on an island in Lake Texcoco",
      detail: "The Mexica settled where, legend says, an eagle perched on a cactus; by 1500 their capital of causeways and canals held some 200,000 people, larger than any city in Europe.",
      tier: 3, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Tenochtitlan' },
    { t: ce(1325), end: ce(1354), title: "Ibn Battuta travels 120,000 km across the Islamic world and beyond",
      detail: "Leaving Tangier for the hajj at 21, the Moroccan jurist went on to visit East Africa, Anatolia, the Golden Horde, India, the Maldives, China and Mali; his Rihla is the fullest travel account of the medieval world.",
      tier: 4, category: 'exploration', link: 'https://en.wikipedia.org/wiki/Ibn_Battuta' },
    { t: ce(1337), end: ce(1453), title: "Hundred Years' War between England and France",
      detail: "Edward III's claim to the French throne began a century of conflict marked by the longbow at Crécy and Agincourt, Joan of Arc and the first battlefield cannon; France prevailed.",
      tier: 3, category: 'war', link: 'https://en.wikipedia.org/wiki/Hundred_Years%27_War' },
    { t: ce(1347), end: ce(1351), title: "Black Death kills a third or more of Europe",
      detail: "Bubonic plague carried along Mongol trade routes reached Sicily in October 1347 and swept Europe, the Middle East and North Africa, killing perhaps 75 to 200 million people.",
      tier: 1, category: 'medicine', link: 'https://en.wikipedia.org/wiki/Black_Death' },
    { t: ce(1368), end: ce(1644), title: "Ming dynasty rules China after expelling the Mongols",
      detail: "The peasant-born Hongwu emperor restored native rule; the Ming rebuilt the Great Wall, built the Forbidden City and governed roughly a quarter of the world's people.",
      tier: 3, category: 'empire', link: 'https://en.wikipedia.org/wiki/Ming_dynasty' },
    { t: ce(1370), end: ce(1405), title: "Timur conquers an empire from Samarkand to Delhi and Damascus",
      detail: "The Turco-Mongol warlord's campaigns across Persia, India, Syria and Anatolia killed millions and piled pyramids of skulls, yet his capital Samarkand became a showcase of Islamic architecture and science.",
      tier: 4, category: 'empire', link: 'https://en.wikipedia.org/wiki/Timur' },
    { t: ce(1377), title: "Ibn Khaldun completes the Muqaddimah",
      detail: "Writing in an Algerian castle, the Tunisian scholar analysed the rise and fall of dynasties through group solidarity, economics and demography, founding what later readers called sociology and the philosophy of history.",
      tier: 5, category: 'science', link: 'https://en.wikipedia.org/wiki/Muqaddimah' },
    { t: ymd(1377, 7, 27), title: "Ragusa imposes the first quarantine against plague",
      detail: "The Adriatic republic ordered ships and travelers from plague areas to wait 30 days, later 40 (hence quarantine), before entry, the first systematic public health isolation.",
      tier: 5, category: 'medicine', link: 'https://en.wikipedia.org/wiki/Quarantine' },
    { t: ymd(1392, 8, 5), title: "Yi Seong-gye founds the Joseon dynasty in Korea",
      detail: "The general who turned his army back from an invasion of Ming China deposed the last Goryeo king and took the throne as Taejo; Joseon made Neo-Confucianism the state creed and ruled Korea for five centuries.",
      tier: 4, category: 'empire', link: 'https://en.wikipedia.org/wiki/Joseon' },
    { t: ce(1400), end: ce(1600), title: 'Renaissance',
      detail: 'Beginning in Florence, a revival of classical learning and naturalistic art spread across Europe, from Brunelleschi and Donatello to Leonardo, Michelangelo and Raphael, alongside humanist scholarship and the printed book.',
      tier: 2, category: 'art', link: 'https://en.wikipedia.org/wiki/Renaissance' },
    { t: ce(1405), end: ce(1433), title: "Zheng He's treasure fleets sail the Indian Ocean",
      detail: "Seven Ming expeditions with ships far larger than any in Europe reached India, Arabia and East Africa before the court abandoned ocean voyaging.",
      tier: 4, category: 'exploration', link: 'https://en.wikipedia.org/wiki/Ming_treasure_voyages' },
    { t: ymd(1429, 5, 8), title: "Joan of Arc lifts the English siege of Orléans",
      detail: "The 17-year-old peasant visionary led the relief that turned the Hundred Years' War in France's favor; captured and burned as a heretic in 1431, she was canonized in 1920.",
      tier: 4, category: 'war', link: 'https://en.wikipedia.org/wiki/Siege_of_Orl%C3%A9ans_(1428%E2%80%931429)' },
    { t: ce(1438), end: ce(1533), title: "Inca Empire expands under Pachacuti to rule the Andes",
      detail: "From Cusco, Pachacuti and his heirs built the largest state in the pre-Columbian Americas, bound together by 40,000 km of roads, khipu records and sites such as Machu Picchu.",
      tier: 3, category: 'empire', link: 'https://en.wikipedia.org/wiki/Inca_Empire' },
    { t: ce(1446), title: "King Sejong promulgates Hangul, the Korean alphabet",
      detail: "The Hunminjeongeum introduced a 28-letter phonetic script designed so that commoners could learn to read; it eventually replaced Chinese characters for everyday Korean writing.",
      tier: 5, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Hangul' },
    { t: ce(1450), title: "Inca build Machu Picchu high above the Urubamba valley (c. 1450)",
      detail: "Probably a royal estate of Pachacuti, the mountaintop complex of temples, terraces and fitted stone houses was never found by the Spanish and was brought to world attention by Hiram Bingham in 1911.",
      tier: 5, category: 'art', link: 'https://en.wikipedia.org/wiki/Machu_Picchu' },
    { t: ymd(1453, 5, 29), title: "Constantinople falls to Mehmed II and the Ottomans",
      detail: "Ottoman cannon breached the Theodosian Walls after a 53-day siege; the fall ended the Roman imperial line after 1,500 years and made the city the Ottoman capital.",
      tier: 2, category: 'war', link: 'https://en.wikipedia.org/wiki/Fall_of_Constantinople' },
    { t: ce(1455), title: "Gutenberg prints the 42-line Bible",
      detail: "Johannes Gutenberg's press at Mainz combined cast metal type, oil-based ink and a screw press; within 50 years European presses had turned out some 20 million volumes.",
      tier: 0, category: 'technology', link: 'https://en.wikipedia.org/wiki/Gutenberg_Bible' },
    { t: ce(1464), title: "Sunni Ali builds the Songhai Empire from Gao",
      detail: "Taking Timbuktu in 1468 and Djenné in 1473 with a river fleet on the Niger, Sunni Ali made Songhai the largest state in West African history; under Askia Muhammad it became a center of Islamic scholarship.",
      tier: 4, category: 'empire', link: 'https://en.wikipedia.org/wiki/Songhai_Empire' },
    { t: ce(1488), title: "Bartolomeu Dias rounds the Cape of Good Hope",
      detail: "Blown south by a storm, the Portuguese captain rounded the southern tip of Africa and entered the Indian Ocean, proving a sea route to Asia existed and opening the way for Vasco da Gama a decade later.",
      tier: 4, category: 'exploration', link: 'https://en.wikipedia.org/wiki/Bartolomeu_Dias' },
    { t: ymd(1492, 1, 2), title: "Granada surrenders, completing the Reconquista",
      detail: "Boabdil handed the last Muslim kingdom in Iberia to Ferdinand and Isabella, who months later expelled Spain's Jews and financed Columbus's voyage.",
      tier: 5, category: 'war', link: 'https://en.wikipedia.org/wiki/Granada_War' },
    { t: ymd(1492, 10, 12), title: "Columbus reaches the Americas",
      detail: "Seeking a western route to Asia for Castile, Columbus landed on a Bahamian island he named San Salvador, beginning the permanent linking of the Old and New Worlds and the Columbian Exchange.",
      tier: 0, category: 'exploration', link: 'https://en.wikipedia.org/wiki/Voyages_of_Christopher_Columbus' },
    { t: ymd(1494, 6, 7), title: "Treaty of Tordesillas divides the non-European world between Spain and Portugal",
      detail: "Drawing a line 370 leagues west of the Cape Verde islands, the two crowns split future discoveries between them; the line gave Portugal Brazil and Spain most of the Americas.",
      tier: 5, category: 'politics', link: 'https://en.wikipedia.org/wiki/Treaty_of_Tordesillas' },
    { t: ymd(1498, 5, 20), title: "Vasco da Gama reaches India by sea around Africa",
      detail: "The Portuguese fleet anchored off Calicut ten months after leaving Lisbon; the direct spice route broke the Venetian and Mamluk monopoly and began Europe's maritime empires in Asia.",
      tier: 3, category: 'exploration', link: 'https://en.wikipedia.org/wiki/Vasco_da_Gama' }
  );

/* HT.events — Early modern era, 1500–1800 (CONTRACT.md §6)

 * Tier is the coarsest view at which the event appears, judged against all of
 * human history (CONTRACT.md §3). Dates are the commonly cited values; day

 * reigns, wars and other periods. Every event carries a `link` to the English

 */
(function (root) {
  'use strict';
  const HT = root.HT || (root.HT = {});
  const { bce, ce, ymd, ya } = HT.time;
  HT.events = HT.events || [];
  HT.events.push(
    // ---- 1500–1550 ---------------------------------------------------------
    {
      t: ce(1500, 4, 22),
      title: "Cabral's fleet reaches Brazil and claims it for Portugal",

    {

      title: "Ismail I founds the Safavid dynasty in Iran",
      detail: "Crowned shah at Tabriz, Ismail made Twelver Shia Islam the state religion, setting Iran on a path distinct from its Sunni Ottoman and Uzbek neighbors and shaping the country to this day.",
      tier: 5, category: 'empire',
      link: 'https://en.wikipedia.org/wiki/Ismail_I'
    },
    {
      t: ce(1503),
      title: "Leonardo da Vinci begins the Mona Lisa",
      detail: "Leonardo started his portrait of Lisa Gherardini in Florence and kept refining it until his death in France, where it entered the royal collection and became the world's most famous painting.",
      tier: 5, category: 'art',
      link: 'https://en.wikipedia.org/wiki/Mona_Lisa'
    },
    {
      t: ce(1508), end: ce(1512, 11, 1),
      title: "Michelangelo paints the Sistine Chapel ceiling",
      detail: "Commissioned by Pope Julius II, Michelangelo spent four years on scaffolding painting some 300 figures, including the Creation of Adam; the ceiling was unveiled on All Saints' Day 1512 and is a summit of Renaissance art.",
      tier: 4, category: 'art',
      link: 'https://en.wikipedia.org/wiki/Sistine_Chapel_ceiling'
    },
    {
      t: ce(1511, 8, 24),
      title: "Afonso de Albuquerque captures Malacca for Portugal",
      detail: "The Portuguese seized the sultanate that controlled the strait between the Indian Ocean and the South China Sea, giving Europe its first foothold in the spice trade of Southeast Asia.",
      tier: 5, category: 'empire',
      link: 'https://en.wikipedia.org/wiki/Capture_of_Malacca_(1511)'
    },
    {
      t: ce(1517, 10, 31),
      title: "Martin Luther posts the Ninety-five Theses",
      detail: "Luther's attack on the sale of indulgences, circulated from Wittenberg, launched the Protestant Reformation that split Western Christianity and redrew the politics of Europe.",
      tier: 1, category: 'religion',
      link: 'https://en.wikipedia.org/wiki/Ninety-five_Theses'
    },
    {
      t: ce(1519, 9, 20), end: ce(1522, 9, 6),
      title: "Magellan–Elcano expedition makes the first circumnavigation of the globe",
      detail: "Five ships left Spain under Ferdinand Magellan; after his death in the Philippines, Juan Sebastián Elcano brought the Victoria home with 18 survivors, proving the world's oceans were one connected sea.",
      tier: 3, category: 'exploration',
      link: 'https://en.wikipedia.org/wiki/Magellan_expedition'
    },
    {
      t: ce(1520, 9, 30), end: ce(1566, 9, 6),
      title: "Suleiman the Magnificent rules the Ottoman Empire at its height",
      detail: "Suleiman took Belgrade, Rhodes and most of Hungary, besieged Vienna in 1529, and codified Ottoman law while his fleets dominated the Mediterranean.",
      tier: 4, category: 'empire',
      link: 'https://en.wikipedia.org/wiki/Suleiman_the_Magnificent'
    },
    {
      t: ce(1521, 8, 13),
      title: "Cortés captures Tenochtitlan and the Aztec Empire falls",
      detail: "After a 93-day siege, Hernán Cortés and tens of thousands of Indigenous allies took the Aztec capital, opening the American mainland to Spanish rule and the catastrophic spread of Old World diseases.",
      tier: 1, category: 'empire',
      link: 'https://en.wikipedia.org/wiki/Fall_of_Tenochtitlan'
    },
    {
