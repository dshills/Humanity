<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070a0e">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3eee3">
<meta name="description" content="A zoomable timeline of human history, from the first Homo sapiens 300,000 years ago to today.">
<title>Humanity — a zoomable timeline</title>
<style>
/* ==========================================================================
   Humanity — styles.css
   --------------------------------------------------------------------------
   Direction: "deep-time observatory". The chrome is an instrument console —
   monospace, uppercase, wide-tracked micro-type; hairline grid; corner
   brackets; glass panels; live telemetry — and the fifteen category hues are
   the only saturated colour on the page. Six sensor-style modes reinterpret
   the same scene (OPS, CRT, NVG, IRONBOW, NOIR, PAPER); the monochrome ones
   push the whole stage through SVG gradient-map filters defined in the page.

   Tokens required by CONTRACT.md §8 live on :root (OPS, dark) and are
   re-defined per mode under html[data-theme=…]. `auto` resolves to OPS or
   PAPER from prefers-color-scheme in app.js.
   ========================================================================== */

:root {
  color-scheme: dark;

  /* contract tokens (OPS) */
  --bg: #070a0e;
  --fg: #d6e1e8;
  --muted: #7f93a1;
  --axis: #4c6273;
  --tick: #35485a;
  --grid: #16232d;
  --accent: #5fd3ff;
  --panel-bg: rgba(9, 14, 19, 0.82);
  --panel-border: rgba(95, 211, 255, 0.18);
  --tooltip-bg: rgba(9, 14, 19, 0.9);
  --shadow: 0 18px 48px rgba(0, 0, 0, 0.55), 0 1px 0 rgba(95, 211, 255, 0.08) inset;

  /* extras */
  --bg-deep: #03050a;
  --accent-fg: #04141c;
  --accent-rgb: 95, 211, 255;
  --hover: rgba(95, 211, 255, 0.08);
  --active: rgba(95, 211, 255, 0.16);
  --grid-line: rgba(95, 211, 255, 0.05);
  --glow: 0 0 22px rgba(95, 211, 255, 0.22);
  --grain: 0.07;
  --scan: 0;
  --vignette: 0;
  --font-ui: "Avenir Next", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system,
             "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-mono: "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, "DejaVu Sans Mono",
               "Liberation Mono", monospace;
  --font-display: var(--font-mono);
  --font-read: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia,
               "Times New Roman", serif;
  --hit: 40px;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

/* --- CRT: amber phosphor, rolling scanlines ------------------------------ */
html[data-theme="crt"] {
  --bg: #0a0703;
  --bg-deep: #050301;
  --fg: #ffd9a8;
  --muted: #a8865c;
  --axis: #7a5b34;
  --tick: #4d3a22;
  --grid: #1e150a;
  --accent: #ffb454;
  --accent-fg: #1a0f02;
  --accent-rgb: 255, 180, 84;
  --panel-bg: rgba(14, 9, 3, 0.85);
  --panel-border: rgba(255, 180, 84, 0.2);
  --tooltip-bg: rgba(14, 9, 3, 0.92);
  --hover: rgba(255, 180, 84, 0.08);
  --active: rgba(255, 180, 84, 0.16);
  --grid-line: rgba(255, 180, 84, 0.045);
  --glow: 0 0 22px rgba(255, 180, 84, 0.25);
  --grain: 0.09;
  --scan: 0.22;
  --vignette: 0.55;
}

/* --- NVG: green phosphor, gradient-mapped stage --------------------------- */
html[data-theme="nvg"] {
  --bg: #020803;
  --bg-deep: #010401;
  --fg: #b9ffc0;
  --muted: #5fa868;
  --axis: #3d7a45;
  --tick: #2a5430;
  --grid: #0f2415;
  --accent: #7dff8a;
  --accent-fg: #041a08;
  --accent-rgb: 125, 255, 138;
  --panel-bg: rgba(3, 12, 5, 0.86);
  --panel-border: rgba(125, 255, 138, 0.22);
  --tooltip-bg: rgba(3, 12, 5, 0.94);
  --hover: rgba(125, 255, 138, 0.08);
  --active: rgba(125, 255, 138, 0.16);
  --grid-line: rgba(125, 255, 138, 0.05);
  --glow: 0 0 26px rgba(125, 255, 138, 0.3);
  --grain: 0.14;
  --scan: 0.14;
  --vignette: 0.7;
}

/* --- IRONBOW: thermal palette, gradient-mapped stage ---------------------- */
html[data-theme="ironbow"] {
  --bg: #05020a;
  --bg-deep: #030106;
  --fg: #ffe2b0;
  --muted: #b08a6a;
  --axis: #7c4b3a;
  --tick: #4a2a33;
  --grid: #1d0f22;
  --accent: #ffb000;
  --accent-fg: #1a0c00;
  --accent-rgb: 255, 176, 0;
  --panel-bg: rgba(10, 4, 14, 0.86);
  --panel-border: rgba(255, 176, 0, 0.22);
  --tooltip-bg: rgba(10, 4, 14, 0.94);
  --hover: rgba(255, 176, 0, 0.08);
  --active: rgba(255, 176, 0, 0.16);
  --grid-line: rgba(255, 176, 0, 0.045);
  --glow: 0 0 26px rgba(255, 96, 0, 0.3);
  --grain: 0.06;
  --scan: 0;
  --vignette: 0.6;
}

/* --- NOIR: high-contrast grayscale ---------------------------------------- */
html[data-theme="noir"] {
  --bg: #0a0a0a;
  --bg-deep: #050505;
  --fg: #f2f2f2;
  --muted: #8c8c8c;
  --axis: #5a5a5a;
  --tick: #3a3a3a;
  --grid: #1a1a1a;
  --accent: #ffffff;
  --accent-fg: #000000;
  --accent-rgb: 255, 255, 255;
  --panel-bg: rgba(12, 12, 12, 0.86);
  --panel-border: rgba(255, 255, 255, 0.16);
  --tooltip-bg: rgba(12, 12, 12, 0.94);
  --hover: rgba(255, 255, 255, 0.08);
  --active: rgba(255, 255, 255, 0.16);
  --grid-line: rgba(255, 255, 255, 0.04);
  --glow: 0 0 22px rgba(255, 255, 255, 0.18);
  --grain: 0.12;
  --scan: 0;
  --vignette: 0.5;
}

/* --- PAPER: warm ink on paper, serif display ------------------------------ */
html[data-theme="paper"] {
  color-scheme: light;
  --bg: #f3eee3;
  --bg-deep: #e9e2d3;
  --fg: #1d1b17;
  --muted: #6b6558;
  --axis: #8a8272;
  --tick: #b9b1a0;
  --grid: #e0d9c9;
  --accent: #8a2f1a;
  --accent-fg: #fbf7ef;
  --accent-rgb: 138, 47, 26;
  --panel-bg: rgba(251, 248, 241, 0.9);
  --panel-border: #d8cfbd;
  --tooltip-bg: rgba(251, 248, 241, 0.96);
  --shadow: 0 16px 40px rgba(40, 30, 10, 0.14), 0 1px 2px rgba(40, 30, 10, 0.08);
  --hover: rgba(29, 27, 23, 0.06);
  --active: rgba(29, 27, 23, 0.11);
  --grid-line: rgba(29, 27, 23, 0.045);
  --glow: none;
  --grain: 0.05;
  --scan: 0;
  --vignette: 0;
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
}

/* Category hues — mirror HT.tiers.COLORS. Fallback fill for markers app.js did
   not paint explicitly, and the panel's category dot. */
.cat-origins      { --cat: #a98304; }
.cat-migration    { --cat: #019d9a; }
.cat-technology   { --cat: #a86003; }
.cat-agriculture  { --cat: #4a9f47; }
.cat-civilization { --cat: #6e7e01; }
.cat-empire       { --cat: #b53874; }
.cat-religion     { --cat: #8c54c3; }
.cat-science      { --cat: #0993d2; }
.cat-art          { --cat: #c360bc; }
.cat-war          { --cat: #d6464d; }
.cat-exploration  { --cat: #dd6f23; }
.cat-politics     { --cat: #7d80df; }
.cat-medicine     { --cat: #078968; }
.cat-computing    { --cat: #058298; }
.cat-space        { --cat: #3072d0; }
.cat-earth        { --cat: #b0563a; }

/* --------------------------------------------------------------------------
   Base
   -------------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.4 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background-color 360ms var(--ease), color 360ms var(--ease);
}

[hidden] { display: none !important; }

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  margin: 0;
  padding: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
:focus:not(:focus-visible) { outline: none; }

/* Instrument type: the one voice the chrome speaks in. */
.mono,
#hud, #dock, #crumbs, #cursor-date, #controls, #legend, #panel-category, #panel-date, .tick-label {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

/* --------------------------------------------------------------------------
   App grid: header (auto) / stage (1fr); the panel is a 340px right column
   that pushes the stage at ≥ 641px and a bottom sheet at ≤ 640px.
   -------------------------------------------------------------------------- */
#app {
  display: grid;
  height: 100vh;
  height: 100dvh;
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas:
    "header"
    "stage";
}

body.panel-open #app {
  grid-template-columns: minmax(0, 1fr) 340px;
  grid-template-areas:
    "header header"
    "stage  panel";
}

/* --------------------------------------------------------------------------
   Header — title + tagline | crumbs (scrolls) | cursor date | controls
   -------------------------------------------------------------------------- */
#header {
  grid-area: header;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  grid-template-areas: "title crumbs date controls";
  align-items: center;
  column-gap: 16px;
  min-height: 58px;
  padding: 0 14px 0 20px;
  background: var(--panel-bg);
  -webkit-backdrop-filter: blur(14px);
          backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--panel-border);
  position: relative;
  z-index: 10;
  transition: background-color 360ms var(--ease), border-color 360ms var(--ease);
}
#header::after {                       /* accent hairline that reads as a status bar */
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 1px;
  background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.6), transparent 40%, transparent 60%, rgba(var(--accent-rgb), 0.35));
  pointer-events: none;
}

#brand {
  grid-area: title;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  padding-right: 18px;
  border-right: 1px solid var(--panel-border);
  min-width: 0;
  white-space: nowrap;
}
#title {
  margin: 0;
  font: 500 17px/1 var(--font-display);
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--fg);
}
html[data-theme="paper"] #title { letter-spacing: 0.06em; font-size: 21px; text-transform: none; }
#tagline {
  font: 500 9.5px/1 var(--font-mono);
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0.85;
}
#tagline::before { content: "// "; opacity: 0.6; }

/* Breadcrumbs: chevron-separated, current one emphasized. */
#crumbs {
  grid-area: crumbs;
  display: flex;
  align-items: center;
  min-width: 0;
  padding-right: 28px;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  scrollbar-width: none;
  -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 28px), transparent);
          mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 28px), transparent);
}
#crumbs::-webkit-scrollbar { display: none; }

.crumb {
  flex: none;
  position: relative;
  display: inline-flex;
  align-items: center;
  min-height: var(--hit);
  padding: 0 8px;
  border-radius: 4px;
  color: var(--muted);
  font-size: 11.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: color 120ms var(--ease), background-color 120ms var(--ease);
}
.crumb + .crumb { margin-left: 20px; }
.crumb + .crumb::before {
  content: "\203A";
  position: absolute;
  left: -15px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--tick);
  font-size: 15px;
  line-height: 1;
  pointer-events: none;
}
.crumb:hover { color: var(--fg); background: var(--hover); }
.crumb:active { background: var(--active); }
.crumb.current { color: var(--accent); cursor: default; text-shadow: var(--glow); }
.crumb:focus-visible { outline-offset: -2px; }
.crumb.current:hover { background: none; }

/* Cursor date readout: tabular so the header never jitters. */
#cursor-date {
  grid-area: date;
  min-width: 13ch;
  text-align: right;
  font-size: 11.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}
#cursor-date:empty::before { content: "\2014"; color: var(--tick); }

#controls {
  grid-area: controls;
  display: flex;
  align-items: center;
  gap: 6px;
}
#controls button {
  min-height: var(--hit);
  min-width: var(--hit);
  padding: 0 12px;
  border: 1px solid var(--panel-border);
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg);
  white-space: nowrap;
  transition: background-color 120ms var(--ease), border-color 120ms var(--ease), color 120ms var(--ease), box-shadow 120ms var(--ease);
}
#controls button:hover { background: var(--hover); border-color: rgba(var(--accent-rgb), 0.5); }
#controls button:active { background: var(--active); }
#controls button:disabled { opacity: 0.4; cursor: default; }
#btn-earth[aria-pressed="true"] { border-color: rgba(var(--accent-rgb), 0.45); color: var(--accent); }
#btn-legend[aria-expanded="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-fg);
  box-shadow: var(--glow);
}

/* --------------------------------------------------------------------------
   Stage
   -------------------------------------------------------------------------- */
#stage {
  grid-area: stage;
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background:
    radial-gradient(90% 60% at 50% 62%, rgba(var(--accent-rgb), 0.06) 0%, transparent 70%),
    linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 55%, var(--bg-deep) 100%);
  user-select: none;
  -webkit-user-select: none;
  transition: background 360ms var(--ease);
}

/* Hairline grid + corner brackets: the observatory's reticle. */
#stage::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 48px 48px;
  -webkit-mask-image: radial-gradient(80% 80% at 50% 55%, #000 30%, transparent 100%);
          mask-image: radial-gradient(80% 80% at 50% 55%, #000 30%, transparent 100%);
}
#stage::after {
  content: "";
  position: absolute;
  inset: 12px;
  z-index: 3;
  pointer-events: none;
  --c: rgba(var(--accent-rgb), 0.55);
  background:
    linear-gradient(var(--c), var(--c)) top left / 18px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) top left / 1px 18px no-repeat,
    linear-gradient(var(--c), var(--c)) top right / 18px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) top right / 1px 18px no-repeat,
    linear-gradient(var(--c), var(--c)) bottom left / 18px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) bottom left / 1px 18px no-repeat,
    linear-gradient(var(--c), var(--c)) bottom right / 18px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) bottom right / 1px 18px no-repeat;
}

#timeline {
  position: relative;
  z-index: 1;
  display: block;
  width: 100%;
  height: 100%;
  font-family: var(--font-ui);
  font-size: 13px;
  cursor: crosshair;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}
#timeline.dragging { cursor: grabbing; }

/* Sensor modes: the whole stage image passes through a gradient map. */
html[data-theme="nvg"] #timeline     { filter: url(#sensor-nvg); }
html[data-theme="ironbow"] #timeline { filter: url(#sensor-ironbow); }
html[data-theme="noir"] #timeline    { filter: url(#sensor-noir); }

/* Atmosphere layers (all pointer-events: none): grain, scanlines, vignette. */
.fx {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}
.fx-grain {
  opacity: var(--grain);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  background-size: 160px 160px;
  mix-blend-mode: overlay;
}
.fx-scan {
  opacity: var(--scan);
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.55) 0 1px, transparent 1px 3px);
  background-size: 100% 3px;
}
html[data-theme="crt"] .fx-scan { animation: scan-roll 6s linear infinite; }
.fx-scan::after {                      /* CRT refresh band */
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  height: 90px;
  top: -90px;
  background: linear-gradient(180deg, transparent, rgba(var(--accent-rgb), 0.06), transparent);
  opacity: 0;
}
html[data-theme="crt"] .fx-scan::after { opacity: 1; animation: band-roll 7s linear infinite; }
.fx-vignette {
  opacity: var(--vignette);
  background: radial-gradient(70% 70% at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.85) 100%);
}
@keyframes scan-roll { from { background-position: 0 0; } to { background-position: 0 3px; } }
@keyframes band-roll { from { transform: translateY(0); } to { transform: translateY(calc(100vh + 90px)); } }

/* Tick furniture: recessive hairlines, crisp. */
.g-minor, .g-major, .g-labels, .g-axis, .g-cursor { pointer-events: none; }

.tick        { stroke-width: 1; shape-rendering: crispEdges; }
.tick.minor  { stroke: var(--grid); }
.tick.major  { stroke: var(--tick); }
.axis        { stroke: var(--axis); stroke-width: 1.5; shape-rendering: crispEdges; }

.tick-label {
  fill: var(--muted);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.cursor-line {
  stroke: var(--accent);
  stroke-opacity: 0.55;
  stroke-width: 1;
  stroke-dasharray: 4 3;
  shape-rendering: crispEdges;
}

/* Cursor chip: the date under the pointer, riding the guide line at the axis. */
#cursor-chip {
  position: absolute;
  z-index: 4;
  padding: 3px 7px;
  border: 1px solid rgba(var(--accent-rgb), 0.45);
  border-radius: 3px;
  background: var(--tooltip-bg);
  color: var(--accent);
  font: 600 10.5px/1.2 var(--font-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
  pointer-events: none;
  transform: translate(-50%, 0);
  box-shadow: var(--glow);
}

/* Events */
.event {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.event .hit { fill: transparent; stroke: none; pointer-events: all; }
.event .marker,
.event .bar { transition: transform 150ms var(--ease), stroke-width 150ms var(--ease), fill-opacity 150ms var(--ease); }

.event .marker:not([fill]),
.event .bar:not([fill]) { fill: var(--cat, var(--muted)); }

.event .marker {
  stroke: var(--bg);
  stroke-width: 2;
  transform-box: fill-box;
  transform-origin: center;
}
.event .bar {
  rx: 3;
  ry: 3;
  fill-opacity: 0.85;
}

/* Pulse ring on the top tiers: a slow sonar ping. */
.event .pulse {
  fill: none;
  stroke-width: 1.5;
  stroke-opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  animation: ping 2.8s var(--ease-out) infinite;
  pointer-events: none;
}
.event.tier-1 .pulse { animation-delay: -1.4s; animation-duration: 3.6s; }
@keyframes ping {
  0%   { transform: scale(1);   stroke-opacity: 0.7; }
  70%  { transform: scale(3.2); stroke-opacity: 0; }
  100% { transform: scale(3.2); stroke-opacity: 0; }
}

/* Labels wear the text token, never the series hue; a surface halo lifts
   them off ticks and bars. One size/weight so measured widths match. */
.event .label {
  fill: var(--fg);
  font-size: 13px;
  paint-order: stroke fill;
  stroke: var(--bg);
  stroke-width: 3px;
  stroke-linejoin: round;
  pointer-events: none;
}
.event .stem { transition: stroke-opacity 150ms var(--ease); }

/* Arrival: when a zoom settles, events rise into their lanes in sequence. */
.event.arrive { animation: arrive 420ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 22ms); }
@keyframes arrive {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}

.event:hover .marker,
.event:focus-visible .marker { transform: scale(1.35); stroke-width: 2.5; }
.event:hover .bar,
.event:focus-visible .bar { fill-opacity: 1; transform: scaleY(1.35); transform-box: fill-box; transform-origin: center; }
.event:hover .label,
.event:focus-visible .label { fill: var(--accent); }
.event:hover .stem { stroke-opacity: 0.9 !important; }
.event.selected .label { fill: var(--accent); }
.event:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* --------------------------------------------------------------------------
   HUD — telemetry in the stage's bottom corners
   -------------------------------------------------------------------------- */
#hud {
  position: absolute;
  left: 22px;
  right: 22px;
  bottom: 18px;
  z-index: 3;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  pointer-events: none;
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.hud-block { display: grid; grid-template-columns: auto auto; gap: 5px 14px; align-items: baseline; }
#hud-right .hud-block { grid-template-columns: auto auto; text-align: right; }
.hud-k { color: var(--muted); opacity: 0.75; }
.hud-v { color: var(--fg); font-weight: 600; letter-spacing: 0.1em; }
#hud-mode { color: var(--accent); text-shadow: var(--glow); }
.beacon {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--accent);
}
.beacon::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.9);
  animation: blink 1.6s steps(2, jump-none) infinite;
}
@keyframes blink { to { opacity: 0.25; } }

/* Earth sparklines: CO₂, Antarctic temperature and sea level beneath the axis. */
.g-earth { pointer-events: none; }
.earth-line { fill: none; stroke-width: 1.25; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.earth-line.co2  { stroke: var(--accent); }
.earth-line.temp { stroke: #ff7a59; }
.earth-line.sea  { stroke: #5fa8ff; }
.earth-fill.co2  { fill: var(--accent); fill-opacity: 0.07; }
.earth-base { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.earth-label {
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  fill: var(--muted);
  paint-order: stroke fill;
  stroke: var(--bg);
  stroke-width: 3px;
}
.earth-label tspan.v { fill: var(--fg); font-weight: 600; }
.earth-label.co2 tspan.k  { fill: var(--accent); }
.earth-label.temp tspan.k { fill: #ff7a59; }
.earth-label.sea tspan.k  { fill: #5fa8ff; }
html[data-theme="paper"] .earth-line.temp, html[data-theme="paper"] .earth-label.temp tspan.k { stroke: #c2452a; fill: #c2452a; }
html[data-theme="paper"] .earth-line.sea, html[data-theme="paper"] .earth-label.sea tspan.k { stroke: #2f6fb5; fill: #2f6fb5; }
html[data-theme="paper"] .earth-line.temp { fill: none; }
html[data-theme="paper"] .earth-line.sea { fill: none; }

/* Now marker on the axis: today's position when it is in view. */
.now-marker { stroke: var(--accent); stroke-width: 1.5; stroke-opacity: 0.8; }

/* --------------------------------------------------------------------------
   Dock — sensor modes, bottom centre
   -------------------------------------------------------------------------- */
#dock {
  position: absolute;
  left: 50%;
  bottom: 16px;
  z-index: 4;
  display: flex;
  gap: 2px;
  padding: 4px;
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  background: var(--panel-bg);
  -webkit-backdrop-filter: blur(14px);
          backdrop-filter: blur(14px);
  box-shadow: var(--shadow);
  transform: translateX(-50%);
  transition: background-color 360ms var(--ease), border-color 360ms var(--ease);
}
#dock button {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-width: 58px;
  min-height: var(--hit);
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  transition: background-color 120ms var(--ease), color 120ms var(--ease), box-shadow 160ms var(--ease);
}
#dock button kbd {
  font: 500 9px/1 var(--font-mono);
  letter-spacing: 0.1em;
  color: var(--tick);
  border: 1px solid var(--tick);
  border-radius: 2px;
  padding: 1px 4px;
}
#dock button:hover { color: var(--fg); background: var(--hover); }
#dock button[aria-pressed="true"] {
  color: var(--accent-fg);
  background: var(--accent);
  box-shadow: var(--glow);
}
#dock button[aria-pressed="true"] kbd { color: var(--accent-fg); border-color: rgba(0, 0, 0, 0.25); }

/* --------------------------------------------------------------------------
   Tooltip
   -------------------------------------------------------------------------- */
#tooltip {
  position: absolute;
  z-index: 5;
  max-width: 300px;
  padding: 10px 13px 11px;
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  background: var(--tooltip-bg);
  -webkit-backdrop-filter: blur(12px);
          backdrop-filter: blur(12px);
  box-shadow: var(--shadow);
  color: var(--fg);
  font-size: 13px;
  line-height: 1.45;
  pointer-events: none;
  animation: tt-in 140ms var(--ease-out);
}
#tooltip > .tt-title { font-weight: 600; }
#tooltip > * + * { margin-top: 4px; }
#tooltip .tt-date {
  display: block;
  color: var(--accent);
  font: 600 10.5px/1.3 var(--font-mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
#tooltip .tt-detail { color: var(--muted); font-size: 12.5px; }

@keyframes tt-in {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

/* --------------------------------------------------------------------------
   Legend — floating card in the stage's top-right
   -------------------------------------------------------------------------- */
#legend {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 4;
  display: grid;
  grid-template-columns: repeat(3, auto);
  gap: 8px 18px;
  max-width: calc(100% - 28px);
  max-height: calc(100% - 28px);
  overflow: auto;
  padding: 12px 14px;
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  background: var(--panel-bg);
  -webkit-backdrop-filter: blur(14px);
          backdrop-filter: blur(14px);
  box-shadow: var(--shadow);
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  animation: tt-in 160ms var(--ease-out);
}
.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--fg);
  white-space: nowrap;
}
.legend-item i {
  flex: none;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  box-shadow: 0 0 0 2px var(--bg);
  background: var(--cat, var(--muted));
}

/* --------------------------------------------------------------------------
   Detail panel — right column at ≥ 641px, bottom sheet at ≤ 640px
   -------------------------------------------------------------------------- */
#panel {
  grid-area: panel;
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
  padding: 24px 24px 26px;
  border-left: 1px solid var(--panel-border);
  background: var(--panel-bg);
  -webkit-backdrop-filter: blur(16px);
          backdrop-filter: blur(16px);
  overflow-y: auto;
  overscroll-behavior: contain;
  animation: panel-in 260ms var(--ease-out);
}
#panel::after {                        /* corner bracket */
  content: "";
  position: absolute;
  top: 10px;
  left: 10px;
  width: 14px;
  height: 14px;
  border-top: 1px solid rgba(var(--accent-rgb), 0.6);
  border-left: 1px solid rgba(var(--accent-rgb), 0.6);
  pointer-events: none;
}

#panel-close {
  position: absolute;
  top: 10px;
  right: 10px;
  width: var(--hit);
  height: var(--hit);
  border-radius: 4px;
  font-size: 22px;
  line-height: 1;
  color: var(--muted);
  transition: background-color 120ms var(--ease), color 120ms var(--ease);
}
#panel-close:hover { background: var(--hover); color: var(--fg); }
#panel-close:active { background: var(--active); }

#panel-category {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 6px 44px 0 0;
  min-height: 16px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}
#panel-category:not(:empty)::before {
  content: "";
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--cat, var(--muted));
  box-shadow: 0 0 8px var(--cat, transparent);
}

#panel-title {
  margin: 12px 44px 0 0;
  font: 500 22px/1.25 var(--font-read);
  letter-spacing: 0.005em;
  color: var(--fg);
  overflow-wrap: anywhere;
}
html[data-theme="paper"] #panel-title { font-size: 24px; }

#panel-date {
  margin-top: 8px;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
}

#panel-detail {
  margin: 16px 0 0;
  padding-top: 14px;
  border-top: 1px solid var(--panel-border);
  font: 15px/1.6 var(--font-read);
  color: var(--fg);
  overflow-wrap: anywhere;
}

#panel-link {
  display: inline-flex;
  align-items: center;
  min-height: var(--hit);
  margin: -4px 0 8px;
  font: 600 11px/1 var(--font-mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 4px;
  text-decoration-thickness: 1px;
}
#panel-link:hover { text-decoration-thickness: 2px; }

#panel-zoom {
  margin-top: 18px;
  min-height: var(--hit);
  padding: 0 16px;
  border-radius: 4px;
  background: var(--accent);
  color: var(--accent-fg);
  font: 600 11px/1 var(--font-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  box-shadow: var(--glow);
  transition: opacity 120ms var(--ease), transform 120ms var(--ease);
}
#panel-zoom:hover { opacity: 0.92; }
#panel-zoom:active { transform: translateY(1px); }

@keyframes panel-in {
  from { opacity: 0; transform: translateX(24px); }
  to   { opacity: 1; transform: none; }
}
@keyframes sheet-in {
  from { transform: translateY(100%); }
  to   { transform: none; }
}

/* --------------------------------------------------------------------------
   Narrow screens (≤ 640px)
   -------------------------------------------------------------------------- */
@media (max-width: 640px) {
  #app,
  body.panel-open #app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas:
      "header"
      "stage"
      "panel";
  }

  #header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    row-gap: 0;
    column-gap: 10px;
    padding: 4px 10px 4px 14px;
  }
  #brand { order: 1; flex: 1 1 auto; padding-right: 0; border-right: 0; }
  #tagline { display: none; }
  #controls { order: 2; flex: none; }
  #controls button { padding: 0 8px; font-size: 10px; }
  #crumbs { order: 3; flex: 1 1 55%; min-width: 0; }
  #cursor-date {
    order: 4;
    flex: 0 1 auto;
    min-width: 0;
    max-width: 42%;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 10.5px;
  }

  #stage::before { background-size: 32px 32px; }
  #stage::after { inset: 8px; }

  #hud { left: 12px; right: 12px; bottom: 74px; font-size: 9.5px; }
  #hud-right { display: none; }

  #dock { bottom: 10px; max-width: calc(100% - 20px); overflow-x: auto; scrollbar-width: none; }
  #dock button { min-width: 46px; padding: 4px 6px; font-size: 9px; }
  #dock button kbd { display: none; }
  body.panel-open #dock, body.panel-open #hud { display: none; }

  #legend {
    top: 10px;
    left: 10px;
    right: 10px;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px 12px;
    max-width: none;
  }

  #panel {
    max-height: 45vh;
    padding: 18px 18px 20px;
    border-left: 0;
    border-top: 1px solid var(--panel-border);
    border-radius: 12px 12px 0 0;
    box-shadow: var(--shadow);
    animation: sheet-in 260ms var(--ease-out);
  }
  #panel::after { display: none; }
  #panel::before {
    content: "";
    position: absolute;
    top: 7px;
    left: 50%;
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--tick);
    transform: translateX(-50%);
  }
  #panel-close { top: 8px; right: 8px; }
  #panel-title { font-size: 20px; }
  #panel-detail { font-size: 14px; }
}

/* --------------------------------------------------------------------------
   Preferences
   -------------------------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .event .pulse, .beacon::before { animation: none !important; }
  .fx-scan::after { display: none; }
}

@media (forced-colors: active) {
  .event .marker,
  .event .bar,
  .legend-item i,
  #panel-category::before { forced-color-adjust: none; }
  .fx { display: none; }
}
</style>

<svg width="0" height="0" aria-hidden="true" style="position:absolute" focusable="false">
  <defs>

<div id="app">

<script>
/* ======== src/time.js ======== */
/* HT.time — time model and date formatting (CONTRACT.md §2)
 *
 * `t` is a floating-point astronomical year: 1 CE = 1, 1 BCE = 0, 2 BCE = -1.
 * The fractional part is the fraction of that calendar year elapsed, in the
 * proleptic Gregorian calendar, UTC. All conversions are done from day counts;
 * the JS Date object is only ever *read* (fromDate/now), never used for arithmetic.
 */
(function (root) {
  'use strict';
  const HT = root.HT || (root.HT = {});

  const PRESENT = 1950;                       // "years ago" / BP reference year
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONTH_DAYS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  // Cumulative days before each month in a common year.
  const MONTH_CUM = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];

  // Float-noise tolerance (in days) used when flooring day-of-year and minutes so that
  // ymd/fromDate -> toParts round-trips exactly. A double near |t| carries ~|t|·1e-16 years of
  // representation error, which the ×366 day conversion turns into ~|t|·4e-14 days; 2e-13·|t|
  // leaves a 5× margin (≈5 ms at ROOT_START, ≈0.1 ms in the 20th century) while staying far below
  // one millisecond wherever day-precision data lives, so 23:59:59.999 stays on its own day.
  function dayEps(t) {
    return 1e-9 + Math.abs(t) * 2e-13;
  }

  function isLeap(y) {
    return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
  }

  function daysInYear(y) {
    return isLeap(y) ? 366 : 365;
  }

  function daysInMonth(year, month) {
    return month === 2 && isLeap(year) ? 29 : MONTH_DAYS[month - 1];
  }

  function clampMonth(month) {
    month = Math.floor(Number(month));
    if (!(month >= 1)) return 1;
    if (month > 12) return 12;
    return month;
  }

  // 1-based day of year; `day` may be fractional (e.g. 20.5 = noon on the 20th).
  function dayOfYear(year, month, day) {
    month = clampMonth(month);
    return MONTH_CUM[month - 1] + (month > 2 && isLeap(year) ? 1 : 0) + Number(day);
  }

  function ymd(year, month, day) {
    if (month === undefined) month = 1;
    if (day === undefined) day = 1;
    year = Math.floor(Number(year));
    return year + (dayOfYear(year, month, day) - 1) / daysInYear(year);
  }

  function ce(y, month, day) {
    return ymd(y, month, day);
  }

  function bce(y, month, day) {
    return ymd(1 - Math.floor(Number(y)), month, day);
  }

  function ya(n) {
    return PRESENT - n;
  }

  const ROOT_START = ya(300000);              // -298050

  function fromDate(date) {
    const secs = date.getUTCHours() * 3600 + date.getUTCMinutes() * 60 +
      date.getUTCSeconds() + date.getUTCMilliseconds() / 1000;
    return ymd(date.getUTCFullYear(), date.getUTCMonth() + 1, date.getUTCDate() + secs / 86400);
  }

  function now() {
    return fromDate(new Date());
  }

  function toParts(t) {
    let year = Math.floor(t);
    const eps = dayEps(t);
    let dayFloat = (t - year) * daysInYear(year);       // 0 ≤ dayFloat < daysInYear
    let dayIdx = Math.floor(dayFloat + eps);             // 0-based day of year
    if (dayIdx >= daysInYear(year)) {                     // float noise just below Jan 1 of next year
      year += 1;
      dayIdx = 0;
      dayFloat = 0;
    }
    let tod = dayFloat - dayIdx;                          // fraction of the day elapsed
    if (tod < 0) tod = 0;
    let totalMinutes = Math.floor(tod * 1440 + eps * 1440);
    if (totalMinutes > 1439) totalMinutes = 1439;

    const leap = isLeap(year);
    let month = 1;
    let rem = dayIdx;
    while (month < 12) {
      const len = month === 2 && leap ? 29 : MONTH_DAYS[month - 1];
      if (rem < len) break;
      rem -= len;
      month++;
    }
    return {
      year: year,
      month: month,
      day: rem + 1,
      hour: Math.floor(totalMinutes / 60),
      minute: totalMinutes % 60,
      dayOfYear: dayIdx + 1
    };
  }

  // Historical (non-astronomical) year: never 0; -1 = 1 BCE.
  function histYear(t) {
    return t >= 1 ? Math.floor(t) : Math.floor(t) - 1;

    { t: ya(300000), title: 'Earliest Homo sapiens (Jebel Irhoud, Morocco)',

    { t: ya(300000), title: 'Schöningen spears: the oldest complete wooden hunting weapons',

    { t: ya(290000), title: 'Kabwe skull: archaic humans still share Africa with early Homo sapiens',

    { t: ya(260000), title: 'Florisbad skull: an early Homo sapiens from South Africa',

    { t: ya(250000), title: 'Homo naledi lives in the Rising Star caves, South Africa',

    { t: ya(230000), title: 'Omo Kibish fossils, Ethiopia',

    { t: ya(210000), title: 'Apidima 1: a possible early Homo sapiens in Greece',

    { t: ya(200000), title: 'Border Cave: the oldest known grass bedding',

    { t: ya(200000), title: 'Denisovans occupy Denisova Cave in the Altai',

    { t: ya(200000), title: 'Neanderthals make birch-tar glue, the first synthetic material',

    { t: ya(185000), title: 'Misliya Cave jaw: Homo sapiens reaches the Levant',

      tier: 4, category: 'migration', link: 'https://en.wikipedia.org/wiki/Tam_Pa_Ling_Cave' },
    { t: ya(55000), title: 'Homo sapiens interbreeds with Neanderthals',
      detail: 'Soon after leaving Africa, modern humans mixed with Neanderthals in the Near East; people of non-African ancestry still carry about two percent Neanderthal DNA as a result.',
      tier: 1, category: 'origins', link: 'https://en.wikipedia.org/wiki/Interbreeding_between_archaic_and_modern_humans' },
    { t: ya(51200), title: 'Oldest known figurative cave art at Leang Karampuang, Sulawesi',
      detail: 'A painted scene of a warty pig with three human-like figures in the Maros-Pangkep karst was dated in 2024 to at least 51,200 years, overtaking the 45,500-year-old pig of nearby Leang Tedongnge as the oldest figurative art known.',
      tier: 1, category: 'art', link: 'https://en.wikipedia.org/wiki/Caves_in_the_Maros-Pangkep_karst' },
    { t: ya(50000), title: 'Denisovan ancestry enters the human gene pool',
      detail: "Ancestors of today's Papuans and Aboriginal Australians mixed with Denisovans, an archaic human group known mainly from DNA in a finger bone from Denisova Cave, Siberia.",
      tier: 3, category: 'origins', link: 'https://en.wikipedia.org/wiki/Denisovan' },
    { t: ya(50000), title: 'Oldest known eyed sewing needle, Denisova Cave',
      detail: 'A seven-centimetre bird-bone needle with a drilled eye from Denisova Cave in the Altai is about 50,000 years old, evidence of tailored clothing for surviving Ice Age cold.',
      tier: 4, category: 'technology', link: 'https://en.wikipedia.org/wiki/Sewing_needle' },
    { t: ya(48000), title: 'Fa-Hien Cave: rainforest hunters with bows in Sri Lanka',
      detail: 'Microliths and bone points from Fa-Hien Cave, about 48,000 years old, are the earliest evidence of Homo sapiens in South Asia and of bow-and-arrow hunting outside Africa, with people thriving on monkeys and squirrels in dense rainforest.',
      tier: 4, category: 'migration', link: 'https://en.wikipedia.org/wiki/Fa_Hien_Cave' },
    { t: ya(45000), title: 'Modern humans enter Europe',
      detail: 'Bones and tools from Bacho Kiro Cave in Bulgaria show Homo sapiens in Europe by about 45,000 years ago, beginning several thousand years of overlap with Neanderthals.',
      tier: 1, category: 'migration', link: 'https://en.wikipedia.org/wiki/Bacho_Kiro_cave' },
    { t: ya(45000), title: "Ust'-Ishim man: the oldest sequenced modern human genome",
      detail: 'A thigh bone found on the bank of the Irtysh River in western Siberia belonged to a man who lived about 45,000 years ago; his genome, published in 2014, shows Neanderthal DNA in long unbroken stretches, dating the interbreeding to a few thousand years earlier.',
      tier: 4, category: 'origins', link: 'https://en.wikipedia.org/wiki/Ust%27-Ishim_man' },
    { t: ya(43000), title: 'Lebombo bone: a notched baboon fibula from the Eswatini border',
      detail: 'A baboon fibula marked with 29 notches, found in Border Cave and dated to about 43,000 years, is often cited as the oldest known tally stick and a possible lunar counter, though its purpose remains uncertain.',
      tier: 4, category: 'science', link: 'https://en.wikipedia.org/wiki/Lebombo_bone' },
    { t: ya(43000), end: ya(28000), title: 'Aurignacian culture: the first modern humans across Europe',
      detail: 'The earliest Upper Palaeolithic culture of Europe brought blade tools, split-based bone points, beads, figurines and cave painting from the Balkans to Spain, marking the arrival of fully modern behaviour on the continent.',
      tier: 3, category: 'art', link: 'https://en.wikipedia.org/wiki/Aurignacian' },
    { t: ya(42000), title: 'Bone and ivory flutes: the earliest musical instruments',
      detail: 'Flutes carved from vulture wing bones and mammoth ivory at Geissenklösterle and Hohle Fels in Germany, about 42,000 years old, are the oldest known musical instruments.',
      tier: 3, category: 'art', link: 'https://en.wikipedia.org/wiki/Paleolithic_flutes' },
    { t: ya(42000), title: 'Mungo Lady: the earliest known cremation',
      detail: 'At Lake Mungo in New South Wales a young woman was cremated and her bones buried around 42,000 years ago; nearby Mungo Man was interred with red ochre, showing early ritual in Australia.',
      tier: 3, category: 'religion', link: 'https://en.wikipedia.org/wiki/Mungo_Lady' },
    { t: ya(41000), title: 'Red hand stencils and discs painted in El Castillo cave, Spain',
      detail: 'Uranium-series dating of calcite over a red disc in the Cave of El Castillo gave a minimum age of 40,800 years, making it among the oldest cave art in Europe and raising the possibility that Neanderthals made some of it.',
      tier: 4, category: 'art', link: 'https://en.wikipedia.org/wiki/Cave_of_El_Castillo' },
    { t: ya(40000), title: 'Neanderthals go extinct',
      detail: 'The last Neanderthal populations in Europe disappeared about 40,000 years ago after some 5,000 years alongside modern humans, leaving Homo sapiens as the only surviving human species.',
      tier: 2, category: 'origins', link: 'https://en.wikipedia.org/wiki/Neanderthal_extinction' },
    { t: ya(40000), title: 'Lion-man and Venus of Hohle Fels carved from mammoth ivory',
      detail: 'The half-lion, half-human Löwenmensch from Hohlenstein-Stadel and the Venus of Hohle Fels, both from caves in the Swabian Jura, are the oldest known figurative sculptures.',
      tier: 2, category: 'art', link: 'https://en.wikipedia.org/wiki/L%C3%B6wenmensch_figurine' },
    { t: ya(40000), title: 'Tianyuan man: an early modern human near Beijing',
      detail: 'Bones from Tianyuan Cave at Zhoukoudian, about 40,000 years old, come from one of the earliest modern humans in East Asia; his genome, sequenced in 2013, already lay on the lineage leading to present-day East Asians and Native Americans.',
      tier: 4, category: 'origins', link: 'https://en.wikipedia.org/wiki/Tianyuan_man' },

    // ---- 40,000 – 20,000 years ago: Ice Age art and the glacial maximum ----
    { t: ya(38000), title: 'First people settle the Japanese archipelago',
      detail: 'Ground-edge stone axes and trapezoid tools at sites across Honshu and Kyushu show hunters arriving from the Asian mainland by about 38,000 years ago, some of them crossing open sea to reach islands such as Kozushima for obsidian.',
      tier: 4, category: 'migration', link: 'https://en.wikipedia.org/wiki/Japanese_Paleolithic' },
    { t: ya(36000), title: 'Chauvet Cave paintings',
      detail: 'Hundreds of charcoal and ochre images of lions, rhinos, horses and bears in the Chauvet Cave in southern France, about 36,000 years old, are the earliest masterpieces of cave art.',
      tier: 2, category: 'art', link: 'https://en.wikipedia.org/wiki/Chauvet_Cave' },
    { t: ya(34000), title: 'Sungir burials with thousands of ivory beads',
      detail: 'Two children and an adult man at Sungir near Vladimir, Russia, were buried with spears, bracelets and more than 10,000 mammoth-ivory beads sewn onto their clothing.',
      tier: 3, category: 'religion', link: 'https://en.wikipedia.org/wiki/Sungir' },
    { t: ya(33000), title: 'Dyed flax fibres at Dzudzuana Cave, the oldest known textiles',
      detail: 'Microscopic wild flax fibres, some twisted, knotted and coloured with plant dyes, were found in layers of Dzudzuana Cave in Georgia dating back more than 30,000 years, evidence of cord, baskets and perhaps woven cloth in the Ice Age.',
      tier: 4, category: 'technology', link: 'https://en.wikipedia.org/wiki/Flax' },
    { t: ya(32000), title: 'Humans occupy the Arctic at the Yana River',
      detail: 'The Yana Rhinoceros Horn Site in Siberia, above the Arctic Circle, shows people hunting mammoth and horse at 71 degrees north about 32,000 years ago, before the peak of the last glaciation.',
      tier: 4, category: 'migration', link: 'https://en.wikipedia.org/wiki/Yana_Rhinoceros_Horn_Site' },
    { t: ya(31000), title: 'Oldest known surgical amputation, Borneo',
      detail: 'A young person buried in Liang Tebo cave, Borneo, had a lower leg skilfully removed and survived for years afterwards, pushing evidence of surgery back to about 31,000 years ago.',
      tier: 3, category: 'medicine', link: 'https://en.wikipedia.org/wiki/Amputation' },
    { t: ya(30000), title: 'Bhimbetka rock paintings, India (possibly up to 30,000 years old)',
      detail: 'The sandstone shelters of Bhimbetka in Madhya Pradesh hold hundreds of painted panels of animals, hunters and dancers; the oldest are claimed to be up to 30,000 years old, though most securely dated panels are Mesolithic, about 10,000 years old.',
      tier: 4, category: 'art', link: 'https://en.wikipedia.org/wiki/Bhimbetka_rock_shelters' },
    { t: ya(29500), title: 'Venus of Willendorf',
      detail: 'The 11-centimetre limestone figurine found near Willendorf, Austria, in 1908, about 29,500 years old, is the best known of the Venus figurines made across Ice Age Europe.',
      tier: 3, category: 'art', link: 'https://en.wikipedia.org/wiki/Venus_of_Willendorf' },
    { t: ya(28000), title: 'Venus of Dolní Věstonice: the oldest known fired ceramic',
      detail: 'A figurine of fired clay and bone ash from Dolní Věstonice in Moravia, about 29,000 to 25,000 years old, is the earliest known ceramic object, made by mammoth hunters some 10,000 years before anyone used clay for pots.',
      tier: 3, category: 'technology', link: 'https://en.wikipedia.org/wiki/Venus_of_Doln%C3%AD_V%C4%9Bstonice' },
    { t: ya(28000), title: 'Painted rock shelter of Nawarla Gabarnmang, Arnhem Land',
      detail: 'A charcoal drawing on a fallen ceiling fragment from Nawarla Gabarnmang in northern Australia, dated to about 28,000 years, is the oldest firmly dated rock art on the continent, in a shelter whose pillars were reshaped by its occupants.',
      tier: 5, category: 'art', link: 'https://en.wikipedia.org/wiki/Gabarnmung' },
    { t: ya(27000), title: 'Apollo 11 Cave slabs: the oldest known art in Africa',
      detail: 'Seven painted stone slabs showing animals, including a cat-like creature with human hind legs, were found in a cave in the Huns Mountains of Namibia and dated to about 27,000 years, the earliest securely dated pictorial art in Africa.',
      tier: 4, category: 'art', link: 'https://en.wikipedia.org/wiki/Apollo_11_Cave' },
    { t: ya(26000), end: ya(19000), title: 'Last Glacial Maximum',
      detail: 'Ice sheets reached their greatest extent and sea level fell about 120 metres, exposing land bridges such as Beringia while human populations retreated into warmer refugia.',
      tier: 1, category: 'origins', link: 'https://en.wikipedia.org/wiki/Last_Glacial_Maximum' },
    { t: ya(24000), title: "Mal'ta boy: an Ice Age Siberian ancestral to Native Americans",
      detail: 'The genome of a child buried near Lake Baikal about 24,000 years ago, published in 2013, revealed the Ancient North Eurasians, a vanished population that contributed roughly a third of the ancestry of Indigenous Americans and part of that of Europeans.',
      tier: 4, category: 'origins', link: 'https://en.wikipedia.org/wiki/Mal%27ta%E2%80%93Buret%27_culture' },
    { t: ya(24000), title: 'Bluefish Caves: possible human presence in Yukon during the glacial maximum',
      detail: 'Cut-marked horse and caribou bones from Bluefish Caves in the Yukon, redated in 2017 to about 24,000 years, suggest that people were living in eastern Beringia at the height of the Ice Age, isolated from the rest of the Americas by ice.',
      tier: 5, category: 'migration', link: 'https://en.wikipedia.org/wiki/Bluefish_Caves' },
    { t: ya(23000), title: 'Ohalo II: hunter-gatherers harvest and grind wild cereals',
      detail: 'Brush huts on the shore of the Sea of Galilee preserved wild wheat and barley, a grinding stone and sickle blades, evidence of small-scale cultivation 11,000 years before farming.',
      tier: 3, category: 'agriculture', link: 'https://en.wikipedia.org/wiki/Ohalo_II' },
    { t: ya(22000), title: 'White Sands footprints in New Mexico',
      detail: 'Human footprints beside an ancient lake bed in White Sands National Park have been dated to 23,000 to 21,000 years, which if correct puts people in the Americas during the glacial maximum.',
      tier: 3, category: 'migration', link: 'https://en.wikipedia.org/wiki/White_Sands_fossil_footprints' },
    { t: ya(21000), title: 'Solutrean flintknappers perfect pressure flaking and the eyed needle',
      detail: 'During the coldest millennia of the Ice Age, toolmakers in France and Spain produced thin laurel-leaf points by pressure flaking and heat treatment, alongside the earliest bone needles in Europe, a peak of stone-working skill.',
      tier: 5, category: 'technology', link: 'https://en.wikipedia.org/wiki/Solutrean' },
    { t: ya(20000), title: 'Earliest pottery at Xianrendong Cave, China',
      detail: 'Fragments of cooking vessels from Xianrendong Cave in Jiangxi, about 20,000 years old, are the oldest pottery known, made by hunter-gatherers thousands of years before farming.',
      tier: 2, category: 'technology', link: 'https://en.wikipedia.org/wiki/Xianren_Cave' },
    { t: ya(20000), title: 'Ishango bone tally sticks',
      detail: 'A baboon fibula from Ishango in the Congo, notched in groups that some read as counting or arithmetic, is a candidate for the oldest mathematical artefact at about 20,000 years.',
      tier: 3, category: 'science', link: 'https://en.wikipedia.org/wiki/Ishango_bone' },

    // ---- 20,000 – 12,000 years ago: the ice retreats, the Americas fill, villages appear ----
    { t: ya(17500), title: 'Spear-thrower (atlatl) appears in Europe',
      detail: 'Antler spear-throwers from Combe Saunière in France, about 17,500 years old, are the earliest known atlatls, which let hunters hurl darts with far greater speed and range.',
      tier: 4, category: 'technology', link: 'https://en.wikipedia.org/wiki/Spear-thrower' },
    { t: ya(17000), end: ya(12000), title: 'Magdalenian culture: the golden age of Ice Age art',
      detail: 'Reindeer hunters of France, Spain and central Europe carved harpoons, decorated spear-throwers and engraved plaquettes, and painted the great caves of Lascaux, Altamira and Niaux as the ice sheets retreated.',
      tier: 4, category: 'art', link: 'https://en.wikipedia.org/wiki/Magdalenian' },
    { t: ya(17000), title: 'Lascaux cave paintings',
      detail: 'Nearly 600 painted animals, including the great aurochs of the Hall of the Bulls, decorate Lascaux in the Dordogne; the cave was discovered by four teenagers in 1940.',
      tier: 2, category: 'art', link: 'https://en.wikipedia.org/wiki/Lascaux' },
    { t: ya(16500), title: 'Jōmon pottery begins in Japan',
      detail: 'Sherds from Odai Yamamoto in northern Honshu, about 16,500 years old, open the Jōmon tradition, the longest continuous pottery culture in the world.',
      tier: 4, category: 'technology', link: 'https://en.wikipedia.org/wiki/J%C5%8Dmon_pottery' },
    { t: ya(16000), title: 'Humans reach the Americas from Beringia',
      detail: 'People crossing from Siberia over the Bering land bridge moved south along the Pacific coast by at least 16,000 years ago; footprints at White Sands suggest people may have been present by 21,000–23,000 years ago.',
      tier: 0, category: 'migration', link: 'https://en.wikipedia.org/wiki/Settlement_of_the_Americas' },
    { t: ya(15000), title: 'Dogs domesticated from wolves',
      detail: 'By about 15,000 years ago wolves had become dogs, the first domesticated animal, helping hunters and living in human camps from Europe to Siberia millennia before any crop was farmed.',
      tier: 1, category: 'agriculture', link: 'https://en.wikipedia.org/wiki/Domestication_of_the_dog' },
    { t: ya(15000), title: 'Mammoth-bone huts of Mezhyrich, Ukraine',
      detail: 'Four dwellings built from the bones of some 150 mammoths, roofed with hides and heated by hearths, were found at Mezhyrich near Kyiv; about 15,000 years old, they are among the best-preserved Ice Age houses, with a possible map engraved on a tusk.',
      tier: 4, category: 'technology', link: 'https://en.wikipedia.org/wiki/Mezhyrich' },
    { t: ya(14600), title: 'Meltwater Pulse 1A: seas rise 15 metres in a few centuries',
      detail: 'As the ice sheets collapsed about 14,600 years ago, global sea level jumped by roughly 15 to 20 metres in under 500 years, drowning coastal plains from Sundaland to Doggerland and forcing coastal peoples inland.',
      tier: 4, category: 'origins', link: 'https://en.wikipedia.org/wiki/Meltwater_pulse_1A' },
    { t: ya(14500), title: 'Monte Verde settlement in Chile',
      detail: 'A campsite sealed beneath a peat bog at Monte Verde in southern Chile, about 14,500 years old, showed people deep in South America before the Clovis culture and overturned the Clovis-first model.',
      tier: 4, category: 'migration', link: 'https://en.wikipedia.org/wiki/Monte_Verde' },
    { t: ya(14500), end: ya(11500), title: 'Natufian culture: first sedentary villages',
      detail: 'Natufian hunter-gatherers in the Levant built stone houses, harvested wild cereals with sickles and buried their dead beneath their floors, setting the stage for farming.',
      tier: 1, category: 'civilization', link: 'https://en.wikipedia.org/wiki/Natufian_culture' },
    { t: ya(14500), title: 'Polychrome bison painted on the ceiling of Altamira',
      detail: 'Magdalenian artists in Cantabria used the bulges of the rock to give volume to a herd of red and black bison; dismissed as a forgery when reported in 1880, Altamira was the first Palaeolithic cave art ever recognised.',
      tier: 3, category: 'art', link: 'https://en.wikipedia.org/wiki/Cave_of_Altamira' },
    { t: ya(14400), title: 'Oldest known bread baked at Shubayqa in Jordan',
      detail: 'Charred crumbs of flatbread made from wild einkorn and club-rush tubers, found in a Natufian fireplace at Shubayqa 1 in the Black Desert, are about 14,400 years old, some 4,000 years before cereal farming.',
      tier: 4, category: 'agriculture', link: 'https://en.wikipedia.org/wiki/History_of_bread' },
    { t: ya(14300), title: 'Paisley Caves: pre-Clovis people in Oregon',
      detail: 'Dried human faeces from Paisley Caves in south-central Oregon yielded DNA and radiocarbon dates of about 14,300 years, among the earliest direct evidence of people in North America south of the ice sheets.',
      tier: 5, category: 'migration', link: 'https://en.wikipedia.org/wiki/Paisley_Caves' },
    { t: ya(14200), title: 'Bonn-Oberkassel dog buried with two people in Germany',
      detail: 'A dog laid in a grave beside a man and a woman near Bonn about 14,200 years ago is the oldest undisputed domestic dog; it had survived a severe bout of distemper as a puppy, implying that people nursed it through the illness.',
      tier: 5, category: 'agriculture', link: 'https://en.wikipedia.org/wiki/Bonn%E2%80%93Oberkassel_dog' },
    { t: ya(13400), title: 'Jebel Sahaba: earliest evidence of warfare',
      detail: 'A cemetery near Wadi Halfa in Sudan holds dozens of people, many with projectile wounds and embedded flint points, the oldest known signs of repeated violent conflict between groups.',
      tier: 3, category: 'war', link: 'https://en.wikipedia.org/wiki/Jebel_Sahaba' },
    { t: ya(13050), end: ya(12750), title: 'Clovis culture spreads across North America',
      detail: 'Distinctive fluted Clovis spear points appear from Canada to Mexico within a few centuries, the first widespread archaeological culture of the Americas.',
      tier: 3, category: 'technology', link: 'https://en.wikipedia.org/wiki/Clovis_culture' },
    { t: ya(13000), end: ya(11700), title: 'Ice Age megafauna vanish from the Americas',
      detail: 'Mammoths, mastodons, giant ground sloths and sabre-toothed cats disappeared from North and South America at the end of the Pleistocene, as human hunting and rapid climate change combined.',
      tier: 3, category: 'origins', link: 'https://en.wikipedia.org/wiki/Late_Pleistocene_extinctions' },
    { t: ya(13000), title: 'Abu Hureyra: foragers on the Euphrates begin to cultivate rye',
      detail: 'Villagers at Tell Abu Hureyra in Syria, hit by the drought of the Younger Dryas, appear to have sown wild rye about 13,000 years ago, one of the earliest claimed instances of cultivation, before returning to farming for good a millennium later.',
      tier: 4, category: 'agriculture', link: 'https://en.wikipedia.org/wiki/Tell_Abu_Hureyra' },
    { t: ya(12900), end: ya(11700), title: 'Younger Dryas cold snap',
      detail: 'A sudden return to near-glacial cold lasting some 1,200 years reversed the warming of the late Ice Age; its stress on Natufian foragers is often credited with pushing them toward cultivation.',
      tier: 3, category: 'origins', link: 'https://en.wikipedia.org/wiki/Younger_Dryas' },
    { t: ya(12500), title: 'Folsom hunters pursue bison on the Great Plains',
      detail: 'After the Clovis mammoth hunters, people using finely fluted Folsom points specialised in hunting the giant bison of the Plains; a point found among bison bones at Folsom, New Mexico, in 1927 proved that humans had lived in Ice Age America.',
      tier: 5, category: 'technology', link: 'https://en.wikipedia.org/wiki/Folsom_tradition' },
    { t: ya(12000), title: 'Shigir Idol carved in the Urals',
      detail: 'A larch plank carved with faces and geometric patterns, found in a Russian peat bog in 1890, is the oldest known wooden sculpture at about 12,000 years old.',
      tier: 5, category: 'art', link: 'https://en.wikipedia.org/wiki/Shigir_Idol' },
    { t: ya(12000), title: 'Burial of a Natufian shaman at Hilazon Tachtit, Israel',
      detail: 'An elderly disabled woman was buried in a cave in Galilee about 12,000 years ago with 50 tortoise shells, a leopard pelvis, an eagle wing and a human foot, the earliest grave interpreted as that of a shaman, followed by a feast.',
      tier: 5, category: 'religion', link: 'https://en.wikipedia.org/wiki/Natufian_culture' },
    { t: ya(12000), title: 'Gwion Gwion figures painted in the Kimberley, Australia',
      detail: 'Elegant painted figures in elaborate dress, once called Bradshaw paintings, cover rock shelters across the Kimberley; dating of mud-wasp nests over them in 2020 points to an age of about 12,000 years, the oldest known style of painted human figures in Australia.',
      tier: 5, category: 'art', link: 'https://en.wikipedia.org/wiki/Gwion_Gwion_rock_paintings' }
  );
