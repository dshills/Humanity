      tier: 3, category: 'medicine',
      link: 'https://en.wikipedia.org/wiki/Louis_Pasteur' },
    { t: ymd(1861, 4, 12), end: ymd(1865, 4, 9), title: 'American Civil War',
      detail: 'The Confederate attack on Fort Sumter opened four years of war that killed some 750,000 Americans, preserved the Union and, through the Emancipation Proclamation and 13th Amendment, ended slavery in the United States.',
      tier: 3, category: 'war',
      link: 'https://en.wikipedia.org/wiki/American_Civil_War' },
    { t: ymd(1865, 2, 8), title: 'Mendel presents his laws of inheritance',
      detail: 'Gregor Mendel told the Brünn Natural History Society how eight years of pea-plant crosses revealed that traits pass on as discrete factors in fixed ratios; ignored for 35 years, his paper became the foundation of genetics when rediscovered in 1900.',
      tier: 5, category: 'science',
      link: 'https://en.wikipedia.org/wiki/Gregor_Mendel' },
    { t: ymd(1865, 8, 12), title: 'Lister performs the first antiseptic surgery',
      detail: 'Applying Pasteur\'s germ theory, Joseph Lister dressed a boy\'s compound leg fracture in Glasgow with carbolic acid and it healed without infection; antiseptic and then aseptic technique cut surgical death rates dramatically.',
      tier: 5, category: 'medicine',
      link: 'https://en.wikipedia.org/wiki/Joseph_Lister' },
    { t: ymd(1868, 1, 3), title: 'Meiji Restoration returns power to the emperor of Japan',
      detail: 'Samurai from Satsuma and Chōshū overthrew the Tokugawa shogunate in the name of the young Emperor Meiji, launching a crash programme of Westernization that made Japan an industrial and military power within a generation.',
      tier: 3, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Meiji_Restoration' },
    { t: ymd(1869, 3, 6), title: 'Mendeleev presents the periodic table',
      detail: 'Dmitri Mendeleev arranged the 63 known elements by atomic weight and chemical properties, leaving gaps whose later-discovered elements such as gallium and germanium confirmed his system.',
      tier: 5, category: 'science',
      link: 'https://en.wikipedia.org/wiki/Dmitri_Mendeleev' },
    { t: ymd(1869, 11, 17), title: 'Suez Canal opens',
      detail: 'Ferdinand de Lesseps\'s canal linked the Mediterranean to the Red Sea, cutting the sea route from Europe to India by thousands of miles and making Egypt a strategic prize for the imperial powers.',
      tier: 4, category: 'technology',
      link: 'https://en.wikipedia.org/wiki/Suez_Canal' },

    // ---- 1870s – 1890s ---------------------------------------------------------------
    { t: ymd(1871, 1, 18), title: 'German Empire proclaimed in the Hall of Mirrors at Versailles',
      detail: 'After Bismarck\'s victory over France, Wilhelm I of Prussia was proclaimed German Emperor, uniting the German states into a single power that upset the balance of Europe.',
      tier: 4, category: 'empire',
      link: 'https://en.wikipedia.org/wiki/Proclamation_of_the_German_Empire' },
    { t: ymd(1874, 4, 15), title: 'Impressionists hold their first exhibition in Paris',
      detail: 'Monet, Renoir, Degas, Pissarro, Cézanne and Morisot showed their work independently of the official Salon at the studio of the photographer Nadar; a mocking review of Monet\'s Impression, Sunrise gave the movement its name.',
      tier: 7, category: 'art',
      link: 'https://en.wikipedia.org/wiki/Impressionism' },
    { t: ymd(1876, 3, 10), title: 'Bell makes the first telephone call',
      detail: 'Three days after his patent was granted, Alexander Graham Bell spoke "Mr Watson, come here, I want to see you" into his transmitter in Boston, and speech travelled by wire for the first time.',
      tier: 3, category: 'technology',
      link: 'https://en.wikipedia.org/wiki/Alexander_Graham_Bell' },
    { t: ymd(1879, 10, 22), title: 'Edison perfects a practical incandescent light bulb',
      detail: 'At Menlo Park, Thomas Edison\'s team ran a carbon-filament lamp for more than 13 hours, the first practical long-lasting electric light, and went on to build the generating stations and grids that electrified cities.',
      tier: 2, category: 'technology',
      link: 'https://en.wikipedia.org/wiki/Incandescent_light_bulb' },
    { t: ymd(1882, 3, 24), title: 'Koch identifies the bacterium that causes tuberculosis',
      detail: 'Robert Koch announced in Berlin that a single microbe caused the disease then killing one in seven Europeans, proving germ theory for a major human illness and setting the standard for identifying pathogens.',
      tier: 6, category: 'medicine',
      link: 'https://en.wikipedia.org/wiki/Robert_Koch' },
    { t: ymd(1883, 8, 27), title: 'Krakatoa erupts, heard 4,800 km away',
      detail: 'The Indonesian volcano destroyed itself in the loudest sound in recorded history; tsunamis up to 30 metres high killed some 36,000 people on Java and Sumatra, and its dust reddened sunsets around the world for years.',
      tier: 5, category: 'civilization',
      link: 'https://en.wikipedia.org/wiki/1883_eruption_of_Krakatoa' },
    { t: ymd(1884, 11, 15), end: ymd(1885, 2, 26), title: 'Berlin Conference sets the rules for the partition of Africa',
      detail: 'Convened by Bismarck, the European powers agreed how to claim African territory without consulting a single African; by 1914 nearly the whole continent was under colonial rule.',
      tier: 4, category: 'empire',
      link: 'https://en.wikipedia.org/wiki/Berlin_Conference' },
    { t: ymd(1886, 1, 29), title: 'Karl Benz patents the first automobile',
      detail: 'Benz\'s three-wheeled Patent-Motorwagen, driven by a single-cylinder petrol engine, is generally counted as the first practical car; his wife Bertha\'s 106-km drive in 1888 proved it roadworthy.',
      tier: 4, category: 'technology',
      link: 'https://en.wikipedia.org/wiki/Benz_Patent-Motorwagen' },
    { t: ymd(1888, 5, 13), title: 'Brazil abolishes slavery, the last country in the Americas to do so',
      detail: 'Princess Isabel signed the Lei Áurea (Golden Law) freeing some 700,000 enslaved people without compensation to owners; the planters\' anger helped bring down the monarchy the following year.',
      tier: 5, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Lei_%C3%81urea' },
    { t: ymd(1892, 1, 1), title: 'Ellis Island immigration station opens in New York Harbor',
      detail: 'Fifteen-year-old Annie Moore from Ireland was the first of some 12 million immigrants processed at Ellis Island, the gateway of the great European migration to the United States.',
      tier: 7, category: 'migration',
      link: 'https://en.wikipedia.org/wiki/Ellis_Island' },
    { t: ymd(1893, 9, 19), title: 'New Zealand becomes the first country to give women the vote',
      detail: 'After a petition of some 32,000 signatures gathered by Kate Sheppard\'s suffragists, Governor Lord Glasgow signed the Electoral Act granting all women the right to vote in national elections.',
      tier: 6, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Women%27s_suffrage_in_New_Zealand' },
    { t: ymd(1894, 7, 25), end: ymd(1895, 4, 17), title: 'First Sino-Japanese War',
      detail: 'Japan\'s modernized army and navy routed Qing China on land in Korea and at sea off the Yalu; the Treaty of Shimonoseki ceded Taiwan to Japan, ended Chinese suzerainty over Korea and announced Japan as East Asia\'s rising power.',
      tier: 5, category: 'war',
      link: 'https://en.wikipedia.org/wiki/First_Sino-Japanese_War' },
    { t: ymd(1895, 11, 8), title: 'Röntgen discovers X-rays',
      detail: 'Experimenting with cathode-ray tubes in Würzburg, Wilhelm Röntgen found invisible rays that passed through flesh and exposed photographic plates; within months doctors were imaging bones, and he won the first Nobel Prize in Physics.',
      tier: 5, category: 'science',
      link: 'https://en.wikipedia.org/wiki/Wilhelm_R%C3%B6ntgen' },
    { t: ymd(1895, 12, 28), title: 'Lumière brothers hold the first public film screening',
      detail: 'Auguste and Louis Lumière projected ten short films to a paying audience at the Grand Café in Paris, launching cinema as a mass medium.',
      tier: 5, category: 'art',
      link: 'https://en.wikipedia.org/wiki/Auguste_and_Louis_Lumi%C3%A8re' },
    { t: ymd(1896, 3, 1), title: 'Ethiopia defeats Italy at the Battle of Adwa',
      detail: 'Emperor Menelik II\'s army of some 100,000 destroyed an invading Italian force in the mountains of Tigray; Italy recognized Ethiopian independence, and Adwa became a symbol of African resistance to the colonial scramble.',
      tier: 5, category: 'war',
      link: 'https://en.wikipedia.org/wiki/Battle_of_Adwa' },
    { t: ymd(1896, 4, 6), end: ymd(1896, 4, 15), title: 'First modern Olympic Games held in Athens',
      detail: 'Pierre de Coubertin\'s revival of the ancient games drew 241 athletes from 14 nations to the restored Panathenaic Stadium.',
      tier: 7, category: 'civilization',
      link: 'https://en.wikipedia.org/wiki/1896_Summer_Olympics' },
    { t: ymd(1897, 8, 29), title: 'Theodor Herzl convenes the First Zionist Congress in Basel',
      detail: 'Some 200 delegates adopted the goal of a legally secured home for the Jewish people in Palestine, turning Zionism into an organized political movement.',
      tier: 6, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/First_Zionist_Congress' },
    { t: ymd(1898, 12, 26), title: 'Marie and Pierre Curie announce the discovery of radium',
      detail: 'Having found polonium in July, the Curies reported a second, intensely radioactive element extracted from tonnes of pitchblende; Marie Curie coined the word radioactivity and became the first person to win two Nobel Prizes.',
      tier: 5, category: 'science',
      link: 'https://en.wikipedia.org/wiki/Marie_Curie' },

    // ---- 1900s – 1910s ---------------------------------------------------------------
    { t: ymd(1900, 12, 14), title: 'Planck introduces the quantum to explain black-body radiation',
      detail: 'Max Planck told the German Physical Society that his radiation law only worked if energy were emitted in discrete packets proportional to frequency, E = hν, the reluctant first step of quantum theory.',
      tier: 5, category: 'science',
      link: 'https://en.wikipedia.org/wiki/Max_Planck' },
    { t: ymd(1901, 12, 12), title: 'Marconi receives the first transatlantic radio signal',
      detail: 'At Signal Hill in Newfoundland, Guglielmo Marconi heard the Morse letter S sent from Poldhu in Cornwall, 3,500 km away, proving that wireless could span oceans.',
      tier: 5, category: 'technology',
      link: 'https://en.wikipedia.org/wiki/Guglielmo_Marconi' },
    { t: ymd(1903, 12, 17), title: 'Wright brothers make the first powered flight at Kitty Hawk',
      detail: 'Orville Wright flew the Flyer 120 feet in 12 seconds over the dunes of North Carolina, the first controlled, sustained flight of a heavier-than-air powered aircraft.',
      tier: 1, category: 'technology',
      link: 'https://en.wikipedia.org/wiki/Wright_Flyer' },
    { t: ymd(1904, 1, 12), end: ymd(1908), title: 'Herero and Nama genocide in German South West Africa',
      detail: 'After the Herero rose against colonial rule, General von Trotha ordered their extermination; survivors were driven into the Omaheke desert or worked to death in camps, killing some 65,000 Herero and 10,000 Nama, the first genocide of the 20th century.',
      tier: 5, category: 'war',
      link: 'https://en.wikipedia.org/wiki/Herero_and_Nama_genocide' },
    { t: ymd(1904, 2, 8), end: ymd(1905, 9, 5), title: 'Russo-Japanese War',
      detail: 'Japan\'s surprise attack on the Russian fleet at Port Arthur opened a war it won on land at Mukden and at sea at Tsushima, the first modern defeat of a European power by an Asian one; the Treaty of Portsmouth ended it.',
      tier: 5, category: 'war',
      link: 'https://en.wikipedia.org/wiki/Russo-Japanese_War' },
    { t: ymd(1905, 1, 22), title: 'Bloody Sunday sparks the 1905 Russian Revolution',
      detail: 'Troops fired on workers marching to the Winter Palace with a petition for Tsar Nicholas II, setting off a year of strikes, mutinies and peasant risings that forced the October Manifesto and Russia\'s first elected Duma.',
      tier: 6, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Bloody_Sunday_(1905)' },
    // 18 Mar 1905 (photoelectric paper received) – 27 Sep 1905 (mass–energy paper received)
    { t: ymd(1905, 3, 18), end: ymd(1905, 9, 27), title: 'Einstein\'s miracle year: special relativity and E = mc²',
      detail: 'In four papers written while working as a Swiss patent clerk, Albert Einstein explained the photoelectric effect, proved atoms exist via Brownian motion, and introduced special relativity and mass–energy equivalence.',
      tier: 3, category: 'science',
      link: 'https://en.wikipedia.org/wiki/Annus_mirabilis_papers' },
    { t: ymd(1908, 10, 1), title: 'Ford introduces the Model T',
      detail: 'Henry Ford\'s cheap, rugged car, built from 1913 on the first moving assembly line, put America on wheels: 15 million were sold and the price fell from $850 to under $300.',
      tier: 5, category: 'technology',
      link: 'https://en.wikipedia.org/wiki/Ford_Model_T' },
    { t: ymd(1909, 4, 6), title: 'Peary claims to have reached the North Pole',
      detail: 'Robert Peary, Matthew Henson and four Inuit companions, Ootah, Egingwah, Seegloo and Ooqueah, reported reaching the pole by sledge; the claim was long accepted but is now widely doubted.',
      tier: 6, category: 'exploration',
      link: 'https://en.wikipedia.org/wiki/Robert_Peary' },
    { t: ymd(1909, 7, 2), title: 'Haber demonstrates ammonia synthesis from nitrogen and hydrogen',
      detail: 'Fritz Haber\'s high-pressure apparatus in Karlsruhe produced liquid ammonia from the air\'s nitrogen; scaled up by Carl Bosch at BASF in 1913, the process now makes the fertilizer that feeds about half of humanity.',
      tier: 4, category: 'science',
      link: 'https://en.wikipedia.org/wiki/Haber_process' },
    { t: ymd(1910, 11, 20), end: ymd(1920, 12, 1), title: 'Mexican Revolution',
      detail: 'Francisco Madero\'s call to arms against the dictator Porfirio Díaz unleashed a decade of civil war involving Villa, Zapata, Carranza and Obregón that killed perhaps a million people and produced the 1917 Constitution with its land reform and labour rights.',
      tier: 4, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Mexican_Revolution' },
    { t: ymd(1911, 3, 25), title: 'Triangle Shirtwaist Factory fire kills 146 garment workers in New York',
      detail: 'Locked exit doors trapped the workers, mostly young immigrant women, on the upper floors of a Manhattan factory; the deaths spurred factory-safety laws and the growth of the garment workers\' unions.',
      tier: 6, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Triangle_Shirtwaist_Factory_fire' },
    { t: ymd(1911, 10, 10), end: ymd(1912, 2, 12), title: 'Xinhai Revolution ends two millennia of imperial rule in China',
      detail: 'The Wuchang Uprising spread across the provinces until the six-year-old Puyi abdicated; Sun Yat-sen\'s republic replaced the Qing dynasty, though warlordism and civil war soon followed.',
      tier: 4, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/1911_Revolution' },
    { t: ymd(1911, 12, 14), title: 'Amundsen reaches the South Pole',
      detail: 'Roald Amundsen\'s five-man Norwegian party reached the pole by dog sled five weeks ahead of Robert Falcon Scott, whose British team died on the return march; the last great geographical prize on Earth had been claimed.',
      tier: 6, category: 'exploration',
      link: 'https://en.wikipedia.org/wiki/Amundsen%27s_South_Pole_expedition' },
    { t: ymd(1912, 4, 15), title: 'RMS Titanic sinks on her maiden voyage',
      detail: 'The largest ship afloat struck an iceberg in the North Atlantic and went down with about 1,500 of the 2,200 people aboard; lifeboat rules were overhauled and an international ice patrol created as a result.',
      tier: 6, category: 'technology',
      link: 'https://en.wikipedia.org/wiki/Sinking_of_the_Titanic' },
    { t: ymd(1913, 5, 29), title: 'Stravinsky\'s The Rite of Spring provokes a riot at its Paris premiere',
      detail: 'The pounding rhythms and dissonance of Igor Stravinsky\'s ballet for Diaghilev\'s Ballets Russes, with Nijinsky\'s stamping choreography, set off catcalls and fistfights at the Théâtre des Champs-Élysées; it became a cornerstone of modern music.',
      tier: 6, category: 'art',
      link: 'https://en.wikipedia.org/wiki/The_Rite_of_Spring' },
    { t: ymd(1913, 7), title: 'Bohr publishes his quantum model of the atom',
      detail: 'Niels Bohr proposed that electrons occupy fixed orbits and emit light only when jumping between them, explaining the spectrum of hydrogen and bringing Planck\'s quantum into the structure of matter.',
      tier: 5, category: 'science',
      link: 'https://en.wikipedia.org/wiki/Bohr_model' },
    { t: ymd(1914, 6, 28), title: 'Archduke Franz Ferdinand assassinated in Sarajevo',
      detail: 'Gavrilo Princip, a Bosnian Serb nationalist, shot the heir to the Austro-Hungarian throne and his wife; the July Crisis that followed drew the great powers into the First World War within five weeks.',
      tier: 6, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Assassination_of_Archduke_Franz_Ferdinand' },
    { t: ymd(1914, 7, 28), end: ymd(1918, 11, 11), title: 'First World War',
      detail: 'Industrialized total war between the Allies and the Central Powers killed some 20 million people, toppled the Russian, German, Austro-Hungarian and Ottoman empires, and redrew the map of Europe and the Middle East.',
      tier: 0, category: 'war',
      link: 'https://en.wikipedia.org/wiki/World_War_I' },
    { t: ymd(1914, 8, 15), title: 'Panama Canal opens',
      detail: 'The SS Ancon made the first official transit of the 82-km waterway, cutting the voyage from New York to San Francisco by 13,000 km; built by the United States after a French failure, it cost some 5,600 lives, mostly Caribbean workers.',
      tier: 4, category: 'technology',
      link: 'https://en.wikipedia.org/wiki/Panama_Canal' },
    { t: ymd(1915, 4, 24), end: ymd(1917), title: 'Armenian genocide in the Ottoman Empire',
      detail: 'Ottoman authorities arrested Armenian leaders in Constantinople and then deported the empire\'s Armenians on death marches into the Syrian desert; an estimated 600,000 to 1.5 million died, one of the crimes Raphael Lemkin had in mind when he coined the word genocide.',
      tier: 5, category: 'war',
      link: 'https://en.wikipedia.org/wiki/Armenian_genocide' },
    { t: ymd(1915, 11, 25), title: 'Einstein presents the general theory of relativity',
      detail: 'Einstein gave the Prussian Academy of Sciences his final field equations, describing gravity as the curvature of spacetime; Eddington\'s 1919 eclipse expedition confirmed the predicted bending of starlight and made Einstein world-famous.',
      tier: 4, category: 'science',
      link: 'https://en.wikipedia.org/wiki/General_relativity' },
    { t: ymd(1917, 11, 7), title: 'Bolsheviks seize power in the October Revolution',
      detail: 'Lenin\'s Bolsheviks stormed the Winter Palace in Petrograd and overthrew the Provisional Government, creating the world\'s first communist state and shaping global politics for the rest of the century.',
      tier: 1, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/October_Revolution' },
    { t: ymd(1918, 3, 4), end: ymd(1920, 4), title: '1918 influenza pandemic',
      detail: 'An H1N1 strain spread worldwide in three waves, infecting about a third of humanity and killing an estimated 50 million people, more than the war it accompanied.',
      tier: 3, category: 'medicine',
      link: 'https://en.wikipedia.org/wiki/Spanish_flu' },
    { t: ymd(1919, 4, 13), title: 'Jallianwala Bagh massacre in Amritsar',
      detail: 'Brigadier Reginald Dyer ordered his troops to fire without warning on thousands of unarmed Indians gathered in a walled garden, killing at least 379; the massacre turned Gandhi and millions of Indians decisively against British rule.',
      tier: 6, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Jallianwala_Bagh_massacre' },
    { t: ymd(1919, 6, 28), title: 'Treaty of Versailles signed',
      detail: 'Five years to the day after Sarajevo, the Allies imposed territorial losses, disarmament and reparations on Germany and created the League of Nations; resentment of the treaty fuelled the rise of the Nazis.',
      tier: 4, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Treaty_of_Versailles' },

    // ---- 1920s -----------------------------------------------------------------------
    { t: ymd(1920, 8, 18), title: '19th Amendment gives American women the vote',
      detail: 'Tennessee\'s ratification, carried by a single vote, made women\'s suffrage part of the US Constitution after a 72-year campaign that began at Seneca Falls.',
      tier: 5, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Nineteenth_Amendment_to_the_United_States_Constitution' },
    { t: ymd(1921, 7, 23), title: 'Chinese Communist Party holds its founding congress in Shanghai',
      detail: 'Thirteen delegates, among them Mao Zedong, met in secret in the French Concession with two Comintern advisers to found a party of some 50 members; it would win control of China in 1949 and rule it ever since.',
      tier: 5, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Chinese_Communist_Party' },
    { t: ymd(1922, 1, 11), title: 'Insulin first used to treat a diabetic patient',
      detail: 'Fourteen-year-old Leonard Thompson received the first injection of insulin at Toronto General Hospital; a purified dose on 23 January restored him, and Banting, Best, Collip and Macleod\'s extract turned type 1 diabetes from a death sentence into a manageable condition.',
      tier: 5, category: 'medicine',
      link: 'https://en.wikipedia.org/wiki/Frederick_Banting' },
    { t: ymd(1922, 10, 28), title: "Mussolini's March on Rome brings the Fascists to power",
      detail: 'Blackshirt columns converged on Rome; King Victor Emmanuel III refused to declare martial law and instead asked Mussolini to form a government, installing the first fascist regime in Europe.',
      tier: 6, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/March_on_Rome' },
    { t: ymd(1922, 11, 4), title: 'Howard Carter finds the tomb of Tutankhamun',
      detail: 'Carter\'s team uncovered the steps to the most intact royal tomb ever found in the Valley of the Kings; its golden treasures set off a worldwide craze for ancient Egypt.',
      tier: 7, category: 'exploration',
      link: 'https://en.wikipedia.org/wiki/Tomb_of_Tutankhamun' },
    { t: ymd(1922, 12, 30), title: 'Union of Soviet Socialist Republics founded',
      detail: 'Delegates of the Russian, Ukrainian, Byelorussian and Transcaucasian Soviet republics signed the treaty creating the USSR in Moscow, the one-party federal state that would last until December 1991.',
      tier: 5, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Treaty_on_the_Creation_of_the_USSR' },
    { t: ymd(1923, 10, 29), title: 'Republic of Turkey proclaimed with Atatürk as its first president',
      detail: 'The Grand National Assembly in Ankara proclaimed a republic under Mustafa Kemal, completing the replacement of the Ottoman Empire, whose sultanate had been abolished in 1922; the caliphate followed in March 1924.',
      tier: 5, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Mustafa_Kemal_Atat%C3%BCrk' },
    { t: ymd(1926, 1, 26), title: 'Baird gives the first public demonstration of television',
      detail: 'In his Soho attic laboratory, John Logie Baird showed members of the Royal Institution live moving images of a ventriloquist\'s dummy and his business partner, transmitted by a mechanical scanning disc.',
      tier: 5, category: 'technology',
      link: 'https://en.wikipedia.org/wiki/John_Logie_Baird' },
    { t: ymd(1926, 3, 16), title: 'Goddard launches the first liquid-fuelled rocket',
      detail: 'Robert Goddard\'s gasoline-and-liquid-oxygen rocket flew for about two and a half seconds from a farm in Auburn, Massachusetts, the technical ancestor of every launch vehicle since.',
      tier: 6, category: 'space',
      link: 'https://en.wikipedia.org/wiki/Robert_H._Goddard' },
    { t: ymd(1927, 5, 20), end: ymd(1927, 5, 21), title: 'Lindbergh flies solo across the Atlantic',
      detail: 'Charles Lindbergh flew the Spirit of St Louis nonstop from New York to Paris in 33 and a half hours, the first solo transatlantic flight, and became the most famous man in the world overnight.',
      tier: 7, category: 'exploration',
      link: 'https://en.wikipedia.org/wiki/Spirit_of_St._Louis' },
    { t: ymd(1928, 9, 3), title: 'Fleming discovers penicillin',
      detail: 'Returning from holiday to his St Mary\'s Hospital lab, Alexander Fleming noticed a mould killing bacteria on a discarded culture plate, the first antibiotic; Florey and Chain turned it into a mass-produced drug by 1943.',
      tier: 2, category: 'medicine',
      link: 'https://en.wikipedia.org/wiki/Alexander_Fleming' },
    { t: ymd(1929, 3, 15), title: 'Hubble shows the universe is expanding',
      detail: 'Edwin Hubble\'s paper showed that galaxies recede at speeds proportional to their distance, the observational foundation of the Big Bang model.',
      tier: 5, category: 'space',
      link: 'https://en.wikipedia.org/wiki/Hubble%27s_law' },
    { t: ymd(1929, 10, 29), title: 'Black Tuesday: Wall Street crash sets off the Great Depression',
      detail: 'Panic selling on the New York Stock Exchange wiped out billions in days and helped tip the world into a decade-long depression that put a quarter of American workers out of a job and fed political extremism.',
      tier: 3, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Wall_Street_crash_of_1929' },

    // ---- 1930s -----------------------------------------------------------------------
    { t: ymd(1930, 3, 12), end: ymd(1930, 4, 6), title: 'Gandhi leads the Salt March',
      detail: 'Mohandas Gandhi walked 385 km from Sabarmati to Dandi to make salt in defiance of the British monopoly, sparking mass civil disobedience across India and drawing world attention to its independence movement.',
      tier: 5, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Salt_March' },
    { t: ymd(1931, 9, 18), title: 'Japan invades Manchuria after the Mukden Incident',
      detail: 'Officers of Japan\'s Kwantung Army blew up a stretch of the South Manchuria Railway near Mukden as a pretext to seize all of Manchuria, set up the puppet state of Manchukuo in 1932 and lead Japan out of the League of Nations.',
      tier: 5, category: 'war',
      link: 'https://en.wikipedia.org/wiki/Mukden_Incident' },
    { t: ymd(1932), end: ymd(1933, 12, 31), title: 'Holodomor: famine kills millions in Soviet Ukraine',
      detail: 'Stalin\'s forced collectivization and ruthless grain requisitions, enforced by sealing Ukraine\'s borders, starved an estimated 3.5 to 5 million people to death; Ukraine and many other countries recognize it as a genocide.',
      tier: 5, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Holodomor' },
    { t: ymd(1932, 2, 27), title: 'Chadwick discovers the neutron',
      detail: 'James Chadwick\'s letter to Nature, dated 17 February and published on 27 February, identified the uncharged particle in the atomic nucleus, completing the picture of the atom and opening the way to nuclear fission.',
      tier: 6, category: 'science',
      link: 'https://en.wikipedia.org/wiki/Discovery_of_the_neutron' },
    { t: ymd(1932, 9, 23), title: 'Kingdom of Saudi Arabia proclaimed by Ibn Saud',

    { t: ymd(1945, 11, 20), end: ymd(1946, 10, 1), title: 'Nuremberg trials of the Nazi leadership', detail: 'An International Military Tribunal of the four Allied powers tries 24 senior Nazis for crimes against peace, war crimes and crimes against humanity, establishing that individuals can be held responsible under international law.', tier: 5, category: 'war', link: 'https://en.wikipedia.org/wiki/Nuremberg_trials' },

    { t: ymd(1947, 3, 12), end: ymd(1991, 12, 26), title: 'Cold War', detail: 'From the Truman Doctrine to the dissolution of the Soviet Union, the United States and the USSR wage a global contest of ideology, alliances, proxy wars and nuclear arms that shapes nearly every nation.', tier: 1, category: 'war', link: 'https://en.wikipedia.org/wiki/Cold_War' },

    { t: ymd(1948, 1, 30), title: 'Mahatma Gandhi assassinated in New Delhi', detail: 'The leader of India\'s nonviolent independence movement is shot by a Hindu nationalist, months after the country he helped free was partitioned.', tier: 5, category: 'politics', link: 'https://en.wikipedia.org/wiki/Assassination_of_Mahatma_Gandhi' },
    { t: ymd(1948, 5, 14), title: 'State of Israel declared', detail: 'David Ben-Gurion proclaims Jewish statehood as the British Mandate ends; war with neighboring Arab states follows immediately and the conflict over the land continues today.', tier: 3, category: 'politics', link: 'https://en.wikipedia.org/wiki/Israeli_Declaration_of_Independence' },
    { t: ymd(1948, 5, 26), title: 'National Party wins South Africa\'s election and begins apartheid', detail: 'Daniel Malan\'s Afrikaner nationalists take power on a platform of apartheid and over the following years codify racial segregation in every sphere of life; the system endures until 1994.', tier: 5, category: 'politics', link: 'https://en.wikipedia.org/wiki/1948_South_African_general_election' },
    { t: ymd(1948, 6, 24), end: ymd(1949, 5, 12), title: 'Berlin Blockade and Airlift', detail: 'The Soviet Union cuts all land routes to West Berlin; for eleven months Western aircraft fly in food and coal, some 278,000 sorties in all, until Stalin lifts the blockade in the first great confrontation of the Cold War.', tier: 5, category: 'war', link: 'https://en.wikipedia.org/wiki/Berlin_Blockade' },

    { t: ymd(1958, 9, 12), title: 'Jack Kilby demonstrates the first integrated circuit', detail: 'At Texas Instruments, Kilby shows a working circuit built on a single piece of germanium; the chip makes possible every computer, phone and digital device that followed.', tier: 3, category: 'technology', link: 'https://en.wikipedia.org/wiki/Jack_Kilby' },

    { t: ymd(1962, 10, 11), end: ymd(1965, 12, 8), title: 'Second Vatican Council', detail: 'Pope John XXIII\'s council modernizes the Catholic Church, permitting Mass in local languages and opening dialogue with other faiths.', tier: 7, category: 'religion', link: 'https://en.wikipedia.org/wiki/Second_Vatican_Council' },
    { t: ymd(1962, 10, 16), end: ymd(1962, 10, 28), title: 'Cuban Missile Crisis', detail: 'The discovery of Soviet nuclear missiles in Cuba brings the superpowers to the brink of nuclear war for thirteen days before Khrushchev agrees to withdraw them.', tier: 4, category: 'war', link: 'https://en.wikipedia.org/wiki/Cuban_Missile_Crisis' },
    { t: ymd(1963, 6, 16), title: 'Valentina Tereshkova becomes the first woman in space', detail: 'The 26-year-old former textile worker orbits Earth 48 times aboard Vostok 6 over three days, remaining the only woman to have flown a solo space mission.', tier: 6, category: 'space', link: 'https://en.wikipedia.org/wiki/Vostok_6' },
    { t: ymd(1963, 8, 28), title: 'March on Washington and the "I Have a Dream" speech', detail: 'A quarter of a million people rally for civil rights at the Lincoln Memorial, where Martin Luther King delivers his most famous address.', tier: 6, category: 'politics', link: 'https://en.wikipedia.org/wiki/March_on_Washington' },
    { t: ymd(1963, 11, 22), title: 'President Kennedy assassinated in Dallas', detail: 'John Kennedy is shot while riding in a motorcade; Lyndon Johnson is sworn in as president hours later aboard Air Force One.', tier: 6, category: 'politics', link: 'https://en.wikipedia.org/wiki/Assassination_of_John_F._Kennedy' },
    { t: ymd(1964, 2, 9), title: 'The Beatles appear on The Ed Sullivan Show', detail: 'Some 73 million Americans watch the band\'s first live US television appearance, launching the British Invasion and the era of rock as a global youth culture.', tier: 6, category: 'art', link: 'https://en.wikipedia.org/wiki/The_Beatles_on_The_Ed_Sullivan_Show' },
    { t: ymd(1964, 7, 2), title: 'US Civil Rights Act signed into law', detail: 'President Johnson signs the act outlawing segregation in public places and employment discrimination, the landmark legal victory of the civil rights movement.', tier: 4, category: 'politics', link: 'https://en.wikipedia.org/wiki/Civil_Rights_Act_of_1964' },
    { t: ymd(1964, 10, 1), title: 'Tōkaidō Shinkansen, the first high-speed railway, opens', detail: 'Japan\'s "bullet train" begins running between Tokyo and Osaka at 210 km/h, days before the Tokyo Olympics, and sets the model for high-speed rail worldwide.', tier: 6, category: 'technology', link: 'https://en.wikipedia.org/wiki/Tokaido_Shinkansen' },
    { t: ymd(1965, 9, 30), title: 'Indonesian mass killings follow the 30 September Movement', detail: 'After a failed coup attempt blamed on the communist party, the army under Suharto and allied militias kill an estimated 500,000 to a million alleged communists; Sukarno is sidelined.', tier: 5, category: 'war', link: 'https://en.wikipedia.org/wiki/Indonesian_mass_killings_of_1965%E2%80%9366' },
    { t: ymd(1966, 5, 16), end: ymd(1976, 10, 6), title: 'Cultural Revolution in China', detail: 'Mao unleashes the Red Guards to purge "bourgeois" elements, plunging China into a decade of persecution and destruction that ends only with his death and the arrest of the Gang of Four.', tier: 5, category: 'politics', link: 'https://en.wikipedia.org/wiki/Cultural_Revolution' },
    { t: ymd(1967, 5, 27), title: 'Australians vote to count Aboriginal people in the census', detail: 'More than 90 per cent of voters back a referendum giving the federal government power to legislate for Aboriginal Australians and including them in the national census.', tier: 7, category: 'politics', link: 'https://en.wikipedia.org/wiki/1967_Australian_referendum_(Aboriginals)' },
    { t: ymd(1967, 6, 5), end: ymd(1967, 6, 10), title: 'Six-Day War', detail: 'Israel defeats Egypt, Jordan and Syria in six days and captures the Sinai, Gaza, the West Bank, East Jerusalem and the Golan Heights, territories at the heart of the conflict ever since.', tier: 5, category: 'war', link: 'https://en.wikipedia.org/wiki/Six-Day_War' },
    { t: ymd(1967, 7, 6), end: ymd(1970, 1, 15), title: 'Nigerian Civil War over the secession of Biafra', detail: 'Nigeria fights to reabsorb the breakaway Igbo state of Biafra; a blockade causes famine that kills perhaps a million civilians, and images of starving children galvanise global relief.', tier: 5, category: 'war', link: 'https://en.wikipedia.org/wiki/Nigerian_Civil_War' },
    { t: ymd(1967, 11, 28), title: 'Jocelyn Bell Burnell discovers the first pulsar', detail: 'A Cambridge graduate student notices a regular radio pulse from PSR B1919+21, revealing rapidly spinning neutron stars; her supervisor receives the Nobel Prize for the discovery in 1974.', tier: 6, category: 'science', link: 'https://en.wikipedia.org/wiki/PSR_B1919%2B21' },
    { t: ymd(1967, 12, 3), title: 'Christiaan Barnard performs the first human heart transplant', detail: 'At Groote Schuur Hospital in Cape Town, Barnard transplants the heart of an accident victim into Louis Washkansky, who lives 18 days; the operation opens the era of organ transplantation.', tier: 6, category: 'medicine', link: 'https://en.wikipedia.org/wiki/Christiaan_Barnard' },
    { t: ymd(1968, 1, 5), end: ymd(1968, 8, 21), title: 'Prague Spring', detail: 'Alexander Dubček\'s reforms promise "socialism with a human face" until Warsaw Pact tanks invade Czechoslovakia and crush the experiment.', tier: 6, category: 'politics', link: 'https://en.wikipedia.org/wiki/Prague_Spring' },
    { t: ymd(1968, 4, 4), title: 'Martin Luther King assassinated in Memphis', detail: 'The civil rights leader is shot on a motel balcony; riots erupt in more than 100 American cities.', tier: 6, category: 'politics', link: 'https://en.wikipedia.org/wiki/Assassination_of_Martin_Luther_King_Jr.' },
    { t: ymd(1968, 10, 2), title: 'Tlatelolco massacre in Mexico City', detail: 'Ten days before the Olympic Games open, soldiers fire on student protesters in the Plaza de las Tres Culturas, killing dozens or hundreds in a crime the government long denied.', tier: 6, category: 'politics', link: 'https://en.wikipedia.org/wiki/Tlatelolco_massacre' },
    { t: ymd(1968, 12, 24), title: 'Apollo 8 orbits the Moon and photographs Earthrise', detail: 'Borman, Lovell and Anders become the first humans to leave Earth orbit; their Christmas Eve broadcast from lunar orbit and the Earthrise photograph reshape how humanity sees its planet.', tier: 6, category: 'space', link: 'https://en.wikipedia.org/wiki/Apollo_8' },
    { t: ymd(1969, 2, 9), title: 'Boeing 747 makes its first flight', detail: 'The first wide-body jumbo jet more than doubles airliner capacity, cutting fares and making long-distance air travel available to the masses.', tier: 7, category: 'technology', link: 'https://en.wikipedia.org/wiki/Boeing_747' },
    { t: ymd(1969, 6, 28), title: 'Stonewall riots in New York', detail: 'Patrons of the Stonewall Inn fight back against a police raid, igniting the modern gay rights movement; the first Pride marches are held a year later.', tier: 6, category: 'politics', link: 'https://en.wikipedia.org/wiki/Stonewall_riots' },
    { t: ymd(1969, 7, 20), title: 'Apollo 11 lands on the Moon', detail: 'Neil Armstrong and Buzz Aldrin become the first humans to walk on another world while an estimated 600 million people watch on television.', tier: 0, category: 'space', link: 'https://en.wikipedia.org/wiki/Apollo_11' },
    { t: ymd(1969, 8, 15), end: ymd(1969, 8, 18), title: 'Woodstock festival', detail: 'Some 400,000 people gather on a New York dairy farm for three days of music that became the defining event of the 1960s counterculture.', tier: 7, category: 'art', link: 'https://en.wikipedia.org/wiki/Woodstock' },
    { t: ymd(1969, 10, 29), title: 'First message sent over ARPANET', detail: 'A UCLA computer transmits "LO" to Stanford Research Institute before crashing, the first host-to-host link of the network that grew into the Internet.', tier: 3, category: 'computing', link: 'https://en.wikipedia.org/wiki/ARPANET' },
    // ---- 1970s ---------------------------------------------------------------------------
    { t: ymd(1970, 4, 11), end: ymd(1970, 4, 17), title: 'Apollo 13 crew survives an explosion en route to the Moon', detail: 'An oxygen tank rupture cripples the spacecraft; improvised fixes by the crew and Mission Control bring the three astronauts home safely.', tier: 7, category: 'space', link: 'https://en.wikipedia.org/wiki/Apollo_13' },
    { t: ymd(1970, 12, 10), title: 'Norman Borlaug receives the Nobel Peace Prize for the Green Revolution', detail: 'His high-yield, disease-resistant wheat, spread across Mexico, India and Pakistan, is credited with averting famine for hundreds of millions of people.', tier: 5, category: 'agriculture', link: 'https://en.wikipedia.org/wiki/Norman_Borlaug' },
    { t: ymd(1971, 3, 26), end: ymd(1971, 12, 16), title: 'Bangladesh Liberation War', detail: 'Pakistan\'s army launches a crackdown in East Pakistan; nine months of atrocities, ten million refugees and Indian intervention end with Pakistan\'s surrender and independent Bangladesh.', tier: 5, category: 'war', link: 'https://en.wikipedia.org/wiki/Bangladesh_Liberation_War' },
    { t: ymd(1971, 11, 15), title: 'Intel 4004, the first commercial microprocessor', detail: 'Intel ships a complete central processor on a single chip, the beginning of the microprocessor revolution that put computers in every device.', tier: 4, category: 'computing', link: 'https://en.wikipedia.org/wiki/Intel_4004' },
    { t: ymd(1972, 2, 21), title: 'Richard Nixon visits Mao\'s China', detail: 'The week-long visit ends more than two decades of hostility between the United States and the People\'s Republic, exploits the Sino-Soviet split and begins the opening that brought China back into the world economy.', tier: 6, category: 'politics', link: 'https://en.wikipedia.org/wiki/1972_visit_by_Richard_Nixon_to_China' },
    { t: ymd(1973, 1, 22), title: 'Roe v. Wade establishes a right to abortion in the United States', detail: 'The Supreme Court rules 7–2 that the constitutional right to privacy protects a woman\'s decision to end a pregnancy, a ruling that stands until it is overturned in 2022.', tier: 6, category: 'politics', link: 'https://en.wikipedia.org/wiki/Roe_v._Wade' },
    { t: ymd(1973, 9, 11), title: 'Chilean coup: Pinochet overthrows Salvador Allende', detail: 'The armed forces bomb the presidential palace; Allende dies and General Augusto Pinochet begins a 17-year dictatorship in which thousands are killed or disappeared.', tier: 6, category: 'politics', link: 'https://en.wikipedia.org/wiki/1973_Chilean_coup_d%27%C3%A9tat' },
    { t: ymd(1973, 10, 17), end: ymd(1974, 3, 18), title: '1973 oil crisis', detail: 'Arab OPEC members cut production and embargo supporters of Israel during the Yom Kippur War; oil prices quadruple, ending the postwar boom and reshaping energy policy worldwide.', tier: 5, category: 'politics', link: 'https://en.wikipedia.org/wiki/1973_oil_crisis' },
    { t: ymd(1973, 10, 20), title: 'Sydney Opera House opens', detail: 'Queen Elizabeth II opens Jørn Utzon\'s sail-roofed building on Bennelong Point after 14 years of construction; it becomes an icon of modern architecture and of Australia.', tier: 6, category: 'art', link: 'https://en.wikipedia.org/wiki/Sydney_Opera_House' },
    { t: ymd(1974, 4, 25), title: 'Carnation Revolution ends dictatorship in Portugal', detail: 'A nearly bloodless military coup topples Europe\'s longest-lived authoritarian regime, leads to democracy and brings independence to Portugal\'s African colonies within two years.', tier: 6, category: 'politics', link: 'https://en.wikipedia.org/wiki/Carnation_Revolution' },
    { t: ymd(1974, 8, 9), title: 'Nixon resigns over Watergate', detail: 'Richard Nixon becomes the first US president to resign, after tapes prove he obstructed the investigation into the 1972 break-in at Democratic headquarters.', tier: 7, category: 'politics', link: 'https://en.wikipedia.org/wiki/Watergate_scandal' },
    { t: ymd(1974, 11, 24), title: 'Discovery of "Lucy" in Ethiopia', detail: 'Donald Johanson finds the 3.2-million-year-old Australopithecus afarensis skeleton, showing that upright walking preceded large brains in human evolution.', tier: 7, category: 'science', link: 'https://en.wikipedia.org/wiki/Lucy_(hominid)' },
    { t: ymd(1975, 4, 4), title: 'Microsoft founded by Bill Gates and Paul Allen', detail: 'The partners start out in Albuquerque selling a BASIC interpreter for the Altair 8800; their MS-DOS and Windows go on to run most of the world\'s personal computers.', tier: 6, category: 'computing', link: 'https://en.wikipedia.org/wiki/Microsoft' },
    { t: ymd(1975, 4, 17), end: ymd(1979, 1, 7), title: 'Khmer Rouge rule and the Cambodian genocide', detail: 'Pol Pot\'s regime empties the cities and works, starves or executes some 1.5 to 2 million people, about a quarter of Cambodia\'s population, before a Vietnamese invasion topples it.', tier: 5, category: 'war', link: 'https://en.wikipedia.org/wiki/Cambodian_genocide' },
    { t: ymd(1976, 4, 1), title: 'Apple Computer founded', detail: 'Steve Jobs, Steve Wozniak and Ronald Wayne start the company in a Los Altos garage; the Apple II a year later helps launch the personal computer industry.', tier: 6, category: 'computing', link: 'https://en.wikipedia.org/wiki/Apple_Inc.' },
    { t: ymd(1976, 6, 16), title: 'Soweto uprising', detail: 'Police fire on Black schoolchildren marching against compulsory instruction in Afrikaans; hundreds die in the ensuing unrest and the image of dying 12-year-old Hector Pieterson shocks the world.', tier: 6, category: 'politics', link: 'https://en.wikipedia.org/wiki/Soweto_uprising' },
    { t: ymd(1976, 7, 20), title: 'Viking 1 makes the first successful landing on Mars', detail: 'The NASA lander touches down on Chryse Planitia, returns the first pictures from the Martian surface and tests the soil for signs of life, operating for more than six years.', tier: 6, category: 'space', link: 'https://en.wikipedia.org/wiki/Viking_1' },
    { t: ymd(1976, 7, 28), title: 'Tangshan earthquake kills at least 240,000 in China', detail: 'A magnitude 7.6 earthquake flattens the industrial city of Tangshan in the early morning, the deadliest earthquake of the 20th century by official count.', tier: 6, category: 'civilization', link: 'https://en.wikipedia.org/wiki/1976_Tangshan_earthquake' },
    { t: ymd(1976, 9, 9), title: 'Death of Mao Zedong', detail: 'The founder of the People\'s Republic dies after 27 years in power, opening the struggle that brought Deng Xiaoping and market reforms to the fore.', tier: 7, category: 'politics', link: 'https://en.wikipedia.org/wiki/Death_and_state_funeral_of_Mao_Zedong' },
    { t: ymd(1977, 5, 25), title: 'Star Wars released', detail: 'George Lucas\'s space opera becomes the highest-grossing film to date, transforms special effects and merchandising, and makes the blockbuster franchise the centre of the film industry.', tier: 6, category: 'art', link: 'https://en.wikipedia.org/wiki/Star_Wars_(film)' },
    { t: ymd(1977, 9, 5), title: 'Voyager 1 launched', detail: 'The probe flies past Jupiter and Saturn and in 2012 becomes the first human-made object to enter interstellar space, carrying a golden record of Earth\'s sounds and images.', tier: 7, category: 'space', link: 'https://en.wikipedia.org/wiki/Voyager_1' },
    { t: ymd(1978, 7, 25), title: 'Louise Brown, the first baby conceived by IVF, is born', detail: 'Born in Oldham, England, after work by Patrick Steptoe and Robert Edwards, she is the first "test-tube baby"; more than ten million children have since been born through in vitro fertilisation.', tier: 5, category: 'medicine', link: 'https://en.wikipedia.org/wiki/Louise_Brown' },
    { t: ymd(1978, 9, 17), title: 'Camp David Accords between Egypt and Israel', detail: 'After 13 days of talks hosted by Jimmy Carter, Anwar Sadat and Menachem Begin sign a framework that leads to the 1979 peace treaty, the first between Israel and an Arab state.', tier: 6, category: 'politics', link: 'https://en.wikipedia.org/wiki/Camp_David_Accords' },
    { t: ymd(1978, 10, 16), title: 'Karol Wojtyła elected Pope John Paul II', detail: 'The first non-Italian pope in 455 years, the Polish cardinal becomes a rallying figure for resistance to communism in Eastern Europe.', tier: 7, category: 'religion', link: 'https://en.wikipedia.org/wiki/Pope_John_Paul_II' },
    { t: ymd(1978, 12, 18), title: 'Deng Xiaoping launches China\'s reform and opening-up', detail: 'The Third Plenum of the 11th Central Committee turns China toward market reforms and foreign trade, beginning the fastest sustained economic rise in history.', tier: 3, category: 'politics', link: 'https://en.wikipedia.org/wiki/Reform_and_opening_up' },
    { t: ymd(1979, 2, 11), title: 'Iranian Revolution topples the Shah', detail: 'Ayatollah Khomeini\'s followers take power and establish an Islamic Republic, transforming the politics of the Middle East and the relationship between religion and state.', tier: 4, category: 'politics', link: 'https://en.wikipedia.org/wiki/Iranian_Revolution' },
    { t: ymd(1979, 5, 4), title: 'Margaret Thatcher becomes Britain\'s first female prime minister', detail: 'The Conservative leader wins a general election and governs for eleven years, privatising industries, curbing the unions and reshaping British politics.', tier: 6, category: 'politics', link: 'https://en.wikipedia.org/wiki/Margaret_Thatcher' },
    { t: ymd(1979, 12, 24), end: ymd(1989, 2, 15), title: 'Soviet–Afghan War', detail: 'The Soviet invasion to prop up a communist government bogs down against US-backed mujahideen; the costly withdrawal helps unravel the USSR and seeds later Afghan conflicts.', tier: 5, category: 'war', link: 'https://en.wikipedia.org/wiki/Soviet%E2%80%93Afghan_War' },
    // ---- 1980s ---------------------------------------------------------------------------
    { t: ymd(1980, 5, 8), title: 'WHO certifies the eradication of smallpox', detail: 'A disease that killed some 300 million people in the 20th century alone becomes the first ever eliminated by human effort, after a global vaccination campaign.', tier: 2, category: 'medicine', link: 'https://en.wikipedia.org/wiki/History_of_smallpox' },
    { t: ymd(1980, 9, 22), end: ymd(1988, 8, 20), title: 'Iran–Iraq War', detail: 'Saddam Hussein\'s invasion of revolutionary Iran becomes an eight-year war of trenches, chemical weapons and attacks on Gulf shipping that kills hundreds of thousands, perhaps a million, and ends in stalemate.', tier: 6, category: 'war', link: 'https://en.wikipedia.org/wiki/Iran%E2%80%93Iraq_War' },
    { t: ymd(1981, 6, 5), title: 'First cases of AIDS reported', detail: 'A CDC bulletin describes rare pneumonia in five gay men in Los Angeles, the first official notice of a pandemic that has since killed more than 40 million people.', tier: 4, category: 'medicine', link: 'https://en.wikipedia.org/wiki/History_of_HIV/AIDS' },
    { t: ymd(1981, 8, 12), title: 'IBM Personal Computer released', detail: 'The IBM PC\'s open architecture and Microsoft\'s MS-DOS set the standard that made personal computers a fixture of offices and homes.', tier: 7, category: 'computing', link: 'https://en.wikipedia.org/wiki/IBM_Personal_Computer' },
    { t: ymd(1982, 4, 2), end: ymd(1982, 6, 14), title: 'Falklands War', detail: 'Argentina\'s military junta seizes the British-held Falkland Islands; a British task force sails 8,000 miles to retake them in a ten-week war that costs about 900 lives and topples the junta.', tier: 6, category: 'war', link: 'https://en.wikipedia.org/wiki/Falklands_War' },
    { t: ymd(1983, 1, 1), title: 'ARPANET switches to TCP/IP, the birth of the Internet', detail: 'The network adopts the protocols that let independent networks interconnect, the day most often cited as the Internet\'s birthday.', tier: 3, category: 'computing', link: 'https://en.wikipedia.org/wiki/Internet_protocol_suite' },
    { t: ymd(1984, 10, 31), title: 'Indira Gandhi assassinated by her bodyguards', detail: 'India\'s prime minister is shot by two Sikh members of her guard in revenge for the army\'s storming of the Golden Temple; anti-Sikh riots kill thousands in the days that follow.', tier: 6, category: 'politics', link: 'https://en.wikipedia.org/wiki/Assassination_of_Indira_Gandhi' },
    { t: ymd(1984, 12, 3), title: 'Bhopal gas disaster', detail: 'On the night of 2–3 December a leak of methyl isocyanate from a Union Carbide pesticide plant kills thousands in Bhopal, India, in the world\'s worst industrial accident.', tier: 6, category: 'technology', link: 'https://en.wikipedia.org/wiki/Bhopal_disaster' },
    { t: ymd(1985, 3, 11), title: 'Mikhail Gorbachev becomes Soviet leader', detail: 'His policies of glasnost and perestroika loosen Soviet control at home and in Eastern Europe, setting in motion the end of the Cold War.', tier: 6, category: 'politics', link: 'https://en.wikipedia.org/wiki/Mikhail_Gorbachev' },
    { t: ymd(1985, 7, 13), title: 'Live Aid concerts for Ethiopian famine relief', detail: 'Bob Geldof\'s simultaneous concerts in London and Philadelphia are watched by an estimated 1.5 billion people and raise over £100 million for victims of the 1983–85 Ethiopian famine.', tier: 6, category: 'art', link: 'https://en.wikipedia.org/wiki/Live_Aid' },
    { t: ymd(1985, 9, 19), title: 'Mexico City earthquake', detail: 'A magnitude 8.0 earthquake off the Pacific coast devastates the capital 350 km away, killing at least 5,000 people; citizen rescue brigades expose the government\'s slow response.', tier: 6, category: 'civilization', link: 'https://en.wikipedia.org/wiki/1985_Mexico_City_earthquake' },
    { t: ymd(1986, 1, 28), title: 'Space Shuttle Challenger disintegrates after launch', detail: 'All seven crew members die 73 seconds into the flight after a failed O-ring seal lets hot gas breach a booster joint and tear the external fuel tank apart, grounding the shuttle fleet for nearly three years.', tier: 7, category: 'space', link: 'https://en.wikipedia.org/wiki/Space_Shuttle_Challenger_disaster' },
    { t: ymd(1986, 2, 19), title: 'Soviet space station Mir launched', detail: 'The core module of the first modular space station goes into orbit; Mir hosts crews for 15 years and sets records for long-duration spaceflight before re-entering in 2001.', tier: 6, category: 'space', link: 'https://en.wikipedia.org/wiki/Mir' },
    { t: ymd(1986, 2, 22), end: ymd(1986, 2, 25), title: 'People Power Revolution in the Philippines', detail: 'Millions of unarmed Filipinos fill Manila\'s EDSA highway to protect defecting soldiers; Ferdinand Marcos flees into exile and Corazon Aquino becomes president.', tier: 6, category: 'politics', link: 'https://en.wikipedia.org/wiki/People_Power_Revolution' },
    { t: ymd(1986, 4, 26), title: 'Chernobyl nuclear disaster', detail: 'Reactor 4 explodes during a botched safety test, spreading radioactive fallout across Europe in the worst nuclear accident in history.', tier: 5, category: 'technology', link: 'https://en.wikipedia.org/wiki/Chernobyl_disaster' },
    { t: ymd(1987, 9, 16), title: 'Montreal Protocol signed to protect the ozone layer', detail: 'Nations agree to phase out CFCs in the most successful environmental treaty to date; the ozone hole is now healing.', tier: 6, category: 'politics', link: 'https://en.wikipedia.org/wiki/Montreal_Protocol' },
    { t: ymd(1988, 12, 2), title: 'Benazir Bhutto becomes the first woman to lead a Muslim-majority country', detail: 'Sworn in as prime minister of Pakistan at 35 after the death of dictator Zia-ul-Haq, Bhutto serves two terms and is assassinated while campaigning in 2007.', tier: 6, category: 'politics', link: 'https://en.wikipedia.org/wiki/Benazir_Bhutto' },
    { t: ymd(1989, 3, 12), title: 'Tim Berners-Lee proposes the World Wide Web', detail: 'At CERN he circulates "Information Management: A Proposal", describing linked hypertext documents over the Internet; the first website, info.cern.ch, goes live in December 1990.', tier: 4, category: 'computing', link: 'https://en.wikipedia.org/wiki/History_of_the_World_Wide_Web' },
    { t: ymd(1989, 6, 4), title: 'Solidarity wins Poland\'s first partly free elections', detail: 'The trade union movement wins all but one of the contested seats, leading to the first non-communist government in the Eastern bloc and inspiring revolutions across the region.', tier: 7, category: 'politics', link: 'https://en.wikipedia.org/wiki/1989_Polish_parliamentary_election' },
    { t: ymd(1989, 6, 4), title: 'Tiananmen Square massacre', detail: 'The Chinese army clears weeks of pro-democracy protests from central Beijing, killing hundreds or more and entrenching Communist Party rule.', tier: 5, category: 'politics', link: 'https://en.wikipedia.org/wiki/1989_Tiananmen_Square_protests_and_massacre' },
    { t: ymd(1989, 11, 9), title: 'Fall of the Berlin Wall', detail: 'East Germany opens its border crossings and crowds tear down the wall, the decisive moment in the collapse of communism in Eastern Europe and the end of the Cold War.', tier: 2, category: 'politics', link: 'https://en.wikipedia.org/wiki/Fall_of_the_Berlin_Wall' },
    { t: ymd(1989, 11, 17), end: ymd(1989, 12, 29), title: 'Velvet Revolution in Czechoslovakia', detail: 'Six weeks of peaceful mass protests end communist rule and bring dissident playwright Václav Havel to the presidency.', tier: 7, category: 'politics', link: 'https://en.wikipedia.org/wiki/Velvet_Revolution' },
    { t: ymd(1989, 12, 16), end: ymd(1989, 12, 25), title: 'Romanian Revolution', detail: 'Protests in Timișoara spread to Bucharest; Nicolae Ceaușescu flees and is executed on Christmas Day, the only violent overthrow among the 1989 revolutions.', tier: 7, category: 'politics', link: 'https://en.wikipedia.org/wiki/Romanian_revolution' }
