      link: 'https://en.wikipedia.org/wiki/1991_eruption_of_Mount_Pinatubo' },
    { t: ymd(1991, 8, 6), title: 'Berners-Lee announces the World Wide Web on Usenet',
      detail: 'Tim Berners-Lee posted a summary of the WorldWideWeb project to the alt.hypertext newsgroup, inviting the world to try it; the first website, info.cern.ch, had gone live on 20 December 1990, and CERN released the Web software royalty-free on 30 April 1993.',
      tier: 1, category: 'computing',
      link: 'https://en.wikipedia.org/wiki/World_Wide_Web' },
    { t: ymd(1991, 8, 25), title: 'Linus Torvalds announces the Linux kernel',
      detail: 'A Finnish student\'s hobby operating system grew, through open collaboration, into the software running most servers, phones and supercomputers.',
      tier: 6, category: 'computing',
      link: 'https://en.wikipedia.org/wiki/History_of_Linux' },
    { t: ymd(1991, 12, 26), title: 'Dissolution of the Soviet Union',
      detail: 'The Supreme Soviet voted the USSR out of existence a day after Gorbachev resigned, ending the Cold War and creating 15 independent states.',
      tier: 1, category: 'empire',
      link: 'https://en.wikipedia.org/wiki/Dissolution_of_the_Soviet_Union' },
    { t: ymd(1992, 2, 7), title: 'Maastricht Treaty founds the European Union',
      detail: 'Twelve states signed the treaty that created the EU, set the path to a single currency, and introduced EU citizenship.',
      tier: 4, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Maastricht_Treaty' },
    { t: ymd(1992, 4, 6), end: ymd(1995, 12, 14), title: 'Bosnian War',
      detail: 'The bloodiest of the Yugoslav wars killed about 100,000 people and included the Srebrenica genocide before the Dayton Accords ended it.',
      tier: 6, category: 'war',
      link: 'https://en.wikipedia.org/wiki/Bosnian_War' },
    { t: ymd(1992, 6, 3), end: ymd(1992, 6, 14), title: 'Earth Summit in Rio de Janeiro',
      detail: 'The largest gathering of world leaders to date adopts Agenda 21 and opens the UN Framework Convention on Climate Change and the Convention on Biological Diversity for signature.',
      tier: 5, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Earth_Summit' },
    { t: ymd(1993), end: ymd(2005), title: 'The Internet becomes a mass medium',
      detail: 'With CERN\'s release of the Web into the public domain and the Mosaic browser in 1993, the Internet grew from an academic network into a medium used by a billion people by 2005, carrying email, commerce, search and news.',
      tier: 2, category: 'computing',
      link: 'https://en.wikipedia.org/wiki/History_of_the_Internet' },
    { t: ymd(1993, 9, 13), title: 'Oslo Accords signed on the White House lawn',
      detail: 'Yitzhak Rabin and Yasser Arafat shake hands as Israel and the PLO recognise each other and agree to Palestinian self-government in parts of the West Bank and Gaza.',
      tier: 6, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Oslo_Accords' },
    { t: ymd(1994, 4, 7), end: ymd(1994, 7, 15), title: 'Rwandan genocide',
      detail: 'Hutu extremists murdered roughly 800,000 Tutsi and moderate Hutu in about 100 days while the international community failed to intervene.',
      tier: 4, category: 'war',
      link: 'https://en.wikipedia.org/wiki/Rwandan_genocide' },
    { t: ymd(1994, 5, 10), title: 'Nelson Mandela inaugurated as president of South Africa',
      detail: 'After the country\'s first multiracial election, the former political prisoner became president, ending apartheid rule.',
      tier: 4, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Presidency_of_Nelson_Mandela' },
    { t: ymd(1994, 5, 18), title: 'Flavr Savr tomato, first genetically modified food approved',
      detail: 'The FDA cleared Calgene\'s slow-ripening tomato for sale, opening the way for GM crops that now dominate soybean, maize and cotton farming.',
      tier: 7, category: 'agriculture',
      link: 'https://en.wikipedia.org/wiki/Flavr_Savr' },
    { t: ymd(1995, 3, 26), title: 'Schengen Area abolishes internal border checks',
      detail: 'Passport controls were lifted between Belgium, France, Germany, Luxembourg, the Netherlands, Portugal and Spain, creating a zone of free movement that later grew to more than two dozen countries.',
      tier: 6, category: 'migration',
      link: 'https://en.wikipedia.org/wiki/Schengen_Area' },
    { t: ymd(1995, 7, 11), title: 'Srebrenica massacre',
      detail: 'Bosnian Serb forces under Ratko Mladić overrun a UN "safe area" and murder more than 8,000 Bosniak men and boys, the worst atrocity in Europe since the Second World War.',
      tier: 6, category: 'war',
      link: 'https://en.wikipedia.org/wiki/Srebrenica_massacre' },
    { t: ymd(1995, 9, 4), end: ymd(1995, 9, 15), title: 'Fourth World Conference on Women in Beijing',
      detail: 'Delegates from 189 countries adopt the Beijing Declaration and Platform for Action, and Hillary Clinton declares that "women\'s rights are human rights".',
      tier: 6, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/World_Conference_on_Women,_1995' },
    { t: ymd(1995, 10, 6), title: '51 Pegasi b, first planet found orbiting a Sun-like star',
      detail: 'Michel Mayor and Didier Queloz announced a giant planet circling 51 Pegasi every four days, launching the field of exoplanet science.',
      tier: 5, category: 'space',
      link: 'https://en.wikipedia.org/wiki/51_Pegasi_b' },
    { t: ymd(1995, 11, 22), title: 'Toy Story, the first fully computer-animated feature film',
      detail: 'Pixar\'s debut, released by Disney, proves that computer animation can carry a feature-length story and remakes the animation industry.',
      tier: 6, category: 'art',
      link: 'https://en.wikipedia.org/wiki/Toy_Story' },
    { t: ymd(1995, 12, 6), title: 'First HIV protease inhibitor (saquinavir) approved',
      detail: 'The FDA approved saquinavir; combination antiretroviral therapy soon made HIV a manageable chronic condition rather than a death sentence.',
      tier: 6, category: 'medicine',
      link: 'https://en.wikipedia.org/wiki/Saquinavir' },
    { t: ymd(1996, 7, 5), title: 'Dolly the sheep, first mammal cloned from an adult cell, is born',
      detail: 'Scientists at the Roslin Institute in Scotland cloned Dolly by nuclear transfer, proving that adult cells could be reprogrammed.',
      tier: 4, category: 'science',
      link: 'https://en.wikipedia.org/wiki/Dolly_(sheep)' },
    { t: ymd(1997, 5, 11), title: 'Deep Blue defeats world chess champion Garry Kasparov',
      detail: 'IBM\'s chess computer wins the deciding sixth game of a rematch in New York, the first time a machine beats a reigning world champion in a match under tournament conditions.',
      tier: 6, category: 'computing',
      link: 'https://en.wikipedia.org/wiki/Deep_Blue_versus_Garry_Kasparov' },
    { t: ymd(1997, 6, 26), title: 'Harry Potter and the Philosopher\'s Stone published',
      detail: 'Rowling\'s debut launched a series that sold more than 500 million copies and became one of the largest media franchises ever.',
      tier: 7, category: 'art',
      link: 'https://en.wikipedia.org/wiki/Harry_Potter_and_the_Philosopher%27s_Stone' },
    { t: ymd(1997, 7, 1), title: 'Hong Kong returned to China',
      detail: 'Britain\'s 156-year rule ended at midnight under the "one country, two systems" formula, a symbolic close to the European colonial era.',
      tier: 7, category: 'empire',
      link: 'https://en.wikipedia.org/wiki/Handover_of_Hong_Kong' },
    { t: ymd(1997, 7, 2), title: 'Asian financial crisis begins with the collapse of the Thai baht',
      detail: 'Thailand floats its currency after exhausting its reserves; the crisis spreads to Indonesia, South Korea and beyond, wiping out years of growth and toppling Suharto.',
      tier: 6, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/1997_Asian_financial_crisis' },
    { t: ymd(1998, 4, 10), title: 'Good Friday Agreement brings peace to Northern Ireland',
      detail: 'British and Irish governments and Northern Irish parties agree on power-sharing and decommissioning, largely ending three decades of the Troubles that killed some 3,500 people.',
      tier: 6, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Good_Friday_Agreement' },
    { t: ymd(1998, 5, 11), title: 'India conducts the Pokhran-II nuclear tests',
      detail: 'India detonates five devices and declares itself a nuclear state; Pakistan answers with its own tests on 28 May, making South Asia an openly nuclear-armed region.',
      tier: 6, category: 'war',
      link: 'https://en.wikipedia.org/wiki/Pokhran-II' },
    { t: ymd(1998, 8, 2), end: ymd(2003, 7, 18), title: 'Second Congo War, Africa\'s deadliest conflict',
      detail: 'Nine African nations and dozens of armed groups fight over the Democratic Republic of the Congo; war, famine and disease kill millions before a transitional government is formed.',
      tier: 5, category: 'war',
      link: 'https://en.wikipedia.org/wiki/Second_Congo_War' },
    { t: ymd(1998, 9, 4), title: 'Google founded',
      detail: 'Larry Page and Sergey Brin incorporated Google in a Menlo Park garage; its PageRank search made the Web navigable and built the ad-funded internet.',
      tier: 5, category: 'computing',
      link: 'https://en.wikipedia.org/wiki/Google' },
    { t: ymd(1999, 1, 1), title: 'Euro launched as the currency of eleven EU countries',
      detail: 'The euro began life as an electronic currency; notes and coins followed in 2002, replacing the franc, mark, lira and others.',
      tier: 5, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Euro' },
    { t: ymd(1999, 12, 31), title: 'Boris Yeltsin resigns and Vladimir Putin becomes acting president of Russia',
      detail: 'Yeltsin\'s surprise New Year\'s Eve resignation hands power to his prime minister, a former KGB officer who goes on to dominate Russian politics for decades.',
      tier: 6, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Vladimir_Putin' },
    // ---- 2000s ---------------------------------------------------------------------
    { t: ymd(2000, 6, 26), title: 'Working draft of the human genome announced',
      detail: 'The Human Genome Project and Celera jointly unveiled a first draft of the 3 billion base pairs, opening the era of genomic medicine.',
      tier: 2, category: 'science',
      link: 'https://en.wikipedia.org/wiki/Human_Genome_Project' },
    { t: ymd(2000, 11, 2), title: 'Expedition 1 begins continuous human presence aboard the ISS',
      detail: 'William Shepherd, Yuri Gidzenko and Sergei Krikalev arrived at the International Space Station; it has been crewed without interruption since.',
      tier: 6, category: 'space',
      link: 'https://en.wikipedia.org/wiki/Expedition_1' },
    { t: ymd(2001, 1, 15), title: 'Wikipedia launched',
      detail: 'Jimmy Wales and Larry Sanger started a free encyclopedia anyone could edit; it became the largest reference work in history.',
      tier: 4, category: 'computing',
      link: 'https://en.wikipedia.org/wiki/Wikipedia' },
    { t: ymd(2001, 9, 11), title: 'September 11 attacks',
      detail: 'Al-Qaeda hijackers crashed airliners into the World Trade Center and Pentagon, killing nearly 3,000 and triggering the global war on terror.',
      tier: 3, category: 'war',
      link: 'https://en.wikipedia.org/wiki/September_11_attacks' },
    { t: ymd(2001, 10, 7), end: ymd(2021, 8, 30), title: 'War in Afghanistan',
      detail: 'A US-led invasion toppled the Taliban weeks after 9/11; the longest war in American history ended with the Taliban back in Kabul.',
      tier: 5, category: 'war',
      link: 'https://en.wikipedia.org/wiki/War_in_Afghanistan_(2001%E2%80%932021)' },
    { t: ymd(2002, 7, 1), title: 'International Criminal Court comes into being',
      detail: 'The Rome Statute enters into force, creating the first permanent court to prosecute individuals for genocide, crimes against humanity and war crimes.',
      tier: 6, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/International_Criminal_Court' },
    { t: ymd(2002, 11, 16), title: 'SARS outbreak begins in Guangdong',
      detail: 'A novel coronavirus emerges in southern China and spreads to 29 countries, infecting more than 8,000 people and killing 774 before it is contained in 2003.',
      tier: 6, category: 'medicine',
      link: 'https://en.wikipedia.org/wiki/2002%E2%80%932004_SARS_outbreak' },
    { t: ymd(2003, 3, 20), end: ymd(2011, 12, 18), title: 'Iraq War',
      detail: 'A US-led coalition invaded to remove Saddam Hussein over weapons of mass destruction that were never found; insurgency and sectarian war followed.',
      tier: 5, category: 'war',
      link: 'https://en.wikipedia.org/wiki/Iraq_War' },
    { t: ymd(2003, 10, 15), title: 'Shenzhou 5: China\'s first crewed spaceflight',
      detail: 'Yang Liwei orbits Earth 14 times, making China the third country to launch a human into space on its own rocket.',
      tier: 6, category: 'space',
      link: 'https://en.wikipedia.org/wiki/Shenzhou_5' },
    { t: ymd(2004, 2, 4), title: 'Facebook launched',
      detail: 'Mark Zuckerberg opened the site to Harvard students; it grew into the first social network with billions of users.',
      tier: 5, category: 'computing',
      link: 'https://en.wikipedia.org/wiki/Facebook' },
    { t: ymd(2004, 12, 26), title: 'Indian Ocean earthquake and tsunami',
      detail: 'A magnitude 9 quake off Sumatra sent waves across the Indian Ocean, killing about 230,000 people in 14 countries.',
      tier: 5, category: 'civilization',
      link: 'https://en.wikipedia.org/wiki/2004_Indian_Ocean_earthquake_and_tsunami' },
    { t: ymd(2005, 1, 14), title: 'Huygens probe lands on Titan',
      detail: 'The ESA lander touched down on Saturn\'s largest moon, the most distant landing ever made, revealing a landscape carved by liquid methane.',
      tier: 7, category: 'exploration',
      link: 'https://en.wikipedia.org/wiki/Huygens_(spacecraft)' },
    { t: ymd(2005, 2, 14), title: 'YouTube founded',
      detail: 'Three former PayPal employees registered the video-sharing site; bought by Google in 2006, it made online video a mass medium.',
      tier: 6, category: 'computing',
      link: 'https://en.wikipedia.org/wiki/YouTube' },
    { t: ymd(2005, 8, 29), title: 'Hurricane Katrina floods New Orleans',
      detail: 'Levee failures put 80 per cent of the city under water; the storm kills more than 1,300 people along the Gulf Coast and exposes failures of disaster response.',
      tier: 6, category: 'civilization',
      link: 'https://en.wikipedia.org/wiki/Hurricane_Katrina' },
    { t: ymd(2006, 1, 16), title: 'Ellen Johnson Sirleaf inaugurated as Africa\'s first elected female head of state',
      detail: 'The Harvard-trained economist takes office in Liberia after a devastating civil war and shares the 2011 Nobel Peace Prize.',
      tier: 6, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Ellen_Johnson_Sirleaf' },
    { t: ymd(2007, 1, 9), title: 'Apple unveils the iPhone',
      detail: 'Steve Jobs introduced a touchscreen phone combining a computer, camera and internet device; smartphones soon reached most of humanity.',
      tier: 2, category: 'technology',
      link: 'https://en.wikipedia.org/wiki/IPhone_(1st_generation)' },
    { t: ymd(2008, 5, 12), title: 'Sichuan earthquake',
      detail: 'A magnitude 7.9 earthquake in western China kills about 87,000 people, including thousands of children in collapsed schools, and leaves millions homeless.',
      tier: 6, category: 'civilization',
      link: 'https://en.wikipedia.org/wiki/2008_Sichuan_earthquake' },
    { t: ymd(2008, 8, 8), title: 'Beijing Olympic Games open',
      detail: 'China stages a lavish opening ceremony and tops the gold-medal table at the first Olympics held in the country, a showcase of its rise as a global power.',
      tier: 6, category: 'civilization',
      link: 'https://en.wikipedia.org/wiki/2008_Summer_Olympics' },
    { t: ymd(2008, 9, 15), title: 'Lehman Brothers collapses, triggering the global financial crisis',
      detail: 'The largest bankruptcy in US history froze credit markets and turned a housing bust into the deepest global downturn since the 1930s.',
      tier: 3, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Bankruptcy_of_Lehman_Brothers' },
    { t: ymd(2008, 11, 4), title: 'Barack Obama elected first Black president of the United States',
      detail: 'The Illinois senator defeated John McCain, a milestone for a nation founded with slavery and segregated within living memory.',
      tier: 5, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/2008_United_States_presidential_election' },
    { t: ymd(2009, 1, 3), title: 'Bitcoin network launches with the genesis block',
      detail: 'The pseudonymous Satoshi Nakamoto mined the first block of a decentralized digital currency, founding the cryptocurrency and blockchain industry.',
      tier: 6, category: 'computing',
      link: 'https://en.wikipedia.org/wiki/Bitcoin' },
    { t: ymd(2009, 6, 11), title: 'WHO declares the H1N1 swine flu pandemic',
      detail: 'A new influenza strain first detected in Mexico and the United States becomes the first pandemic declared in 41 years, killing an estimated 150,000 to 575,000 people.',
      tier: 6, category: 'medicine',
      link: 'https://en.wikipedia.org/wiki/2009_swine_flu_pandemic' },
    // ---- 2010s ---------------------------------------------------------------------
    { t: ymd(2010, 1, 12), title: 'Haiti earthquake',
      detail: 'A magnitude 7.0 earthquake near Port-au-Prince kills well over 100,000 people and destroys much of the capital of the poorest country in the Americas.',
      tier: 6, category: 'civilization',
      link: 'https://en.wikipedia.org/wiki/2010_Haiti_earthquake' },
    { t: ymd(2010, 4, 20), title: 'Deepwater Horizon oil spill',
      detail: 'An explosion on a BP-leased drilling rig kills 11 workers; the blown-out well releases some 4.9 million barrels into the Gulf of Mexico over 87 days, the largest marine oil spill ever.',
      tier: 6, category: 'technology',
      link: 'https://en.wikipedia.org/wiki/Deepwater_Horizon_oil_spill' },
    { t: ymd(2010, 12, 17), title: 'Arab Spring begins in Tunisia',
      detail: 'A street vendor\'s protest set off uprisings that toppled rulers in Tunisia, Egypt, Libya and Yemen and led to civil war in Syria.',
      tier: 5, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Arab_Spring' },
    { t: ymd(2011, 3, 11), title: 'Tōhoku earthquake, tsunami and Fukushima nuclear disaster',
      detail: 'A magnitude 9 quake and tsunami killed about 18,000 people in Japan and caused meltdowns at Fukushima Daiichi, the worst nuclear accident since Chernobyl.',
      tier: 6, category: 'technology',
      link: 'https://en.wikipedia.org/wiki/2011_T%C5%8Dhoku_earthquake_and_tsunami' },
    { t: ymd(2011, 3, 15), end: ymd(2024, 12, 8), title: 'Syrian civil war',
      detail: 'Protests against Bashar al-Assad became a multi-sided war that killed hundreds of thousands and displaced half the population before rebels toppled Assad.',
      tier: 5, category: 'war',
      link: 'https://en.wikipedia.org/wiki/Syrian_civil_war' },
    { t: ymd(2011, 7, 9), title: 'South Sudan becomes independent',
      detail: 'After decades of civil war and a referendum in which nearly 99 per cent voted to secede from Sudan, the world\'s newest country is born.',
      tier: 6, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/South_Sudan' },
    { t: ymd(2012, 6, 28), title: 'CRISPR-Cas9 genome editing demonstrated',
      detail: 'Jennifer Doudna and Emmanuelle Charpentier showed the bacterial system could be programmed to cut any DNA sequence, making gene editing cheap and precise.',
      tier: 3, category: 'science',
      link: 'https://en.wikipedia.org/wiki/CRISPR_gene_editing' },
    { t: ymd(2012, 7, 4), title: 'Discovery of the Higgs boson announced at CERN',
      detail: 'The ATLAS and CMS experiments at the Large Hadron Collider found the particle predicted in 1964 that explains how others acquire mass.',
      tier: 4, category: 'science',
      link: 'https://en.wikipedia.org/wiki/Higgs_boson' },
    { t: ymd(2012, 8, 6), title: 'Curiosity rover lands on Mars',
      detail: 'NASA\'s car-sized rover is lowered into Gale Crater by a rocket-powered sky crane and finds evidence that ancient Mars had conditions suitable for microbial life.',
      tier: 6, category: 'space',
      link: 'https://en.wikipedia.org/wiki/Curiosity_(rover)' },
    { t: ymd(2012, 10, 9), title: 'Malala Yousafzai shot by the Taliban for advocating girls\' education',
      detail: 'The 15-year-old Pakistani schoolgirl survives a gunshot to the head and becomes a global campaigner, the youngest ever Nobel Peace laureate in 2014.',
      tier: 6, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Malala_Yousafzai' },
    { t: ymd(2013, 3, 13), title: 'Pope Francis elected, the first pope from the Americas',
      detail: 'Jorge Mario Bergoglio of Argentina became the first Jesuit pope and the first from outside Europe in nearly 1,300 years.',
      tier: 6, category: 'religion',
      link: 'https://en.wikipedia.org/wiki/Pope_Francis' },
    { t: ymd(2013, 6, 5), title: 'Edward Snowden reveals global mass surveillance',
      detail: 'The Guardian publishes the first of the NSA contractor\'s leaked documents, exposing bulk collection of phone and internet data and igniting a worldwide privacy debate.',
      tier: 6, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Snowden_disclosures' },
    { t: ymd(2014, 3, 18), title: 'Russia annexes Crimea',
      detail: 'After a disputed referendum, Moscow absorbed the Ukrainian peninsula, the first forcible annexation in Europe since 1945 and the prelude to full-scale war.',
      tier: 7, category: 'war',
      link: 'https://en.wikipedia.org/wiki/2014_Russian_annexation_of_Crimea' },
    { t: ymd(2014, 3, 23), title: 'West African Ebola epidemic declared',
      detail: 'Guinea reports an Ebola outbreak that spreads to Liberia and Sierra Leone, infecting more than 28,000 people and killing over 11,000 in the largest Ebola epidemic in history.',
      tier: 6, category: 'medicine',
      link: 'https://en.wikipedia.org/wiki/Western_African_Ebola_epidemic' },
    { t: ymd(2014, 6, 29), title: 'Islamic State declares a caliphate',
      detail: 'After seizing Mosul, the jihadist group proclaims Abu Bakr al-Baghdadi caliph over territory in Iraq and Syria; its brutal rule is dismantled by 2019.',
      tier: 6, category: 'war',
      link: 'https://en.wikipedia.org/wiki/Islamic_State' },
    { t: ymd(2015, 6, 26), title: 'US Supreme Court legalises same-sex marriage nationwide',
      detail: 'In Obergefell v. Hodges the court rules 5–4 that the Constitution guarantees same-sex couples the right to marry.',
      tier: 6, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Obergefell_v._Hodges' },
    { t: ymd(2015, 7, 14), title: 'New Horizons flies past Pluto',
      detail: 'The NASA probe returned the first close-up images of Pluto, completing the initial reconnaissance of the classical solar system.',
      tier: 7, category: 'exploration',
      link: 'https://en.wikipedia.org/wiki/New_Horizons' },
    { t: ymd(2015, 9, 14), title: 'First direct detection of gravitational waves',
      detail: 'LIGO recorded ripples in spacetime from two merging black holes, confirming a century-old prediction of Einstein and opening a new window on the universe.',
      tier: 4, category: 'science',
      link: 'https://en.wikipedia.org/wiki/First_observation_of_gravitational_waves' },
    { t: ymd(2015, 12, 12), title: 'Paris Agreement on climate change adopted',
      detail: '196 parties agreed to hold global warming well below 2 °C above pre-industrial levels, the first universal climate accord.',
      tier: 3, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Paris_Agreement' },
    { t: ymd(2016, 3, 9), end: ymd(2016, 3, 15), title: 'AlphaGo defeats Go champion Lee Sedol',
      detail: 'DeepMind\'s program won the Seoul match 4–1, a feat many experts had thought a decade away, signaling the power of deep learning.',
      tier: 6, category: 'computing',
      link: 'https://en.wikipedia.org/wiki/AlphaGo_versus_Lee_Sedol' },
    { t: ymd(2016, 6, 23), title: 'United Kingdom votes to leave the European Union',
      detail: '52% backed Brexit in a referendum; the UK formally left on 31 January 2020, the first member state ever to do so.',
      tier: 5, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/2016_United_Kingdom_European_Union_membership_referendum' },
    { t: ymd(2016, 11, 8), title: 'Donald Trump elected president of the United States',
      detail: 'The businessman and television personality defeated Hillary Clinton, a landmark for populist politics worldwide.',
      tier: 6, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/2016_United_States_presidential_election' },
    { t: ymd(2017, 8, 25), title: 'Rohingya crisis: Myanmar\'s army drives 700,000 into Bangladesh',
      detail: 'A military "clearance operation" in Rakhine State burns villages and kills thousands of Rohingya Muslims; the UN calls it a textbook example of ethnic cleansing.',
      tier: 6, category: 'war',
      link: 'https://en.wikipedia.org/wiki/Rohingya_genocide' },
    { t: ymd(2017, 10, 15), title: '#MeToo goes viral',
      detail: 'Days after allegations against Harvey Weinstein, actress Alyssa Milano asks survivors of sexual harassment to reply "me too"; millions do, and powerful men across industries are held to account.',
      tier: 6, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/MeToo_movement' },
    { t: ymd(2018, 8, 20), title: 'Greta Thunberg begins her school strike for the climate',
      detail: 'The 15-year-old sits outside the Swedish parliament with a hand-painted sign; within a year Fridays for Future draws millions of young people onto the streets worldwide.',
      tier: 6, category: 'politics',
      link: 'https://en.wikipedia.org/wiki/Greta_Thunberg' },
    { t: ymd(2018, 11, 25), title: 'He Jiankui announces the first gene-edited babies',
      detail: 'The Chinese scientist revealed twin girls whose embryos he had edited with CRISPR, drawing global condemnation and a prison sentence.',
      tier: 7, category: 'medicine',
      link: 'https://en.wikipedia.org/wiki/He_Jiankui_affair' },
    { t: ymd(2019, 1, 3), title: 'Chang\'e 4 makes the first landing on the far side of the Moon',
      detail: 'The Chinese probe touches down in the Von Kármán crater and deploys the Yutu-2 rover, relaying data via a satellite parked beyond the Moon.',
      tier: 6, category: 'space',
      link: 'https://en.wikipedia.org/wiki/Chang%27e_4' },
    { t: ymd(2019, 4, 10), title: 'First image of a black hole released',
      detail: 'The Event Horizon Telescope, a planet-sized array of radio dishes, imaged the shadow of the supermassive black hole in galaxy M87.',
      tier: 6, category: 'science',
      link: 'https://en.wikipedia.org/wiki/Event_Horizon_Telescope' },

    const base = view || rootView();
    const target = ev.t >= base.start && ev.t <= base.end ? fitInside({ start: start, end: end }, base) : { start: start, end: end };
    commit(target, { animate: true, url: 'push', stack: 'push', discrete: true });
  }

  // Shift a window so it lies inside `outer` when it is narrower than it; a zoom-in near an edge
  // then slides inward instead of overhanging the parent view (which would break the breadcrumb chain).
  function fitInside(win, outer) {
    const span = win.end - win.start;
    if (span >= outer.end - outer.start) return win;
    let start = win.start;
    let end = win.end;
    if (start < outer.start) { start = outer.start; end = start + span; }
    if (end > outer.end) { end = outer.end; start = end - span; }
    return { start: start, end: end };
  }

  // ------------------------------------------------------------------
  // 5. Rendering
  // ------------------------------------------------------------------

  // Label widths come from a hidden <text> (getComputedTextLength), cached per string.
  function measure(el, kind, text) {
    const key = kind + ' ' + text;
    let w = widthCache.get(key);
    if (w === undefined) {
      w = 0;
      if (el) {
        el.textContent = text;
        try { w = el.getComputedTextLength(); } catch (err) { w = 0; }
      }
      if (!(w > 0)) w = text.length * 7;               // fallback: contract's estimate
      widthCache.set(key, w);
    }
    return w;
  }

  function measureTickLabel(text) {
    return measure(measureTickEl, 'tick', text);
  }

  function measureEventLabel(text) {
    return measure(measureLabelEl, 'label', text);
  }

  // Truncate a title with an ellipsis so it fits within maxW px.
  function fitLabel(title, maxW) {
    const full = measureEventLabel(title);
    if (full <= maxW) return title;
    // Binary search the longest prefix that fits (each probe is one cached measurement, ~6 probes).
    const cut = function (n) { return title.slice(0, n).replace(/\s+$/, '') + '…'; };
    let lo = 1;
    let hi = title.length - 1;
    let best = cut(1);
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      const text = cut(mid);
      if (measureEventLabel(text) <= maxW) { best = text; lo = mid + 1; }
      else hi = mid - 1;
    }
    return best;
  }

  function measureSize() {
    size.width = Math.max(1, dom.stage.clientWidth || 1);
    size.height = Math.max(1, dom.stage.clientHeight || 1);
    // Read the HUD's position here, before any DOM writes in this frame, so renderEarth never forces a layout.
    size.hudTop = dom.hud && !dom.hud.hidden
      ? dom.hud.getBoundingClientRect().top - dom.stage.getBoundingClientRect().top
      : Infinity;
  }

  function render() {
    if (!dom || !shown) return;
    measureSize();
    const w = size.width;
    const h = size.height;
    dom.svg.setAttribute('width', w);
    dom.svg.setAttribute('height', h);
    dom.svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    const axisY = Math.round(h * AXIS_FRACTION);
    lastAxisY = axisY;
    renderTicks(shown, axisY);
    renderEvents(shown, axisY);
    renderEarth(shown, axisY);
    renderNowMarker(shown, axisY);
    dom.cursorLine.setAttribute('y1', 0);
    dom.cursorLine.setAttribute('y2', h);
    if (lastMouseX !== null) updateCursor(lastMouseX);  // the date under a resting pointer changes with the view
    updateHud(shown);
    settleNext = false;
  }

  // --- Earth layer: climate sparklines beneath the axis ---
  function earthSeries() {
    return HT.earth && HT.earth.series ? HT.earth.series : null;
  }

  // How long a series' last value is held past its final sample (ice cores stop before the present).
  const EARTH_HOLD = { co2: 3, temp: 150, sea: 120 };

  // Linear interpolation of a [t, v] series at t (null outside its range). Binary search.
  function seriesAt(arr, t, hold) {
    if (!arr || arr.length === 0 || t < arr[0][0]) return null;
    const last = arr[arr.length - 1];
    if (t > last[0]) return t - last[0] <= (hold || 0) ? last[1] : null;
    let lo = 0;
    let hi = arr.length - 1;
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (arr[mid][0] <= t) lo = mid; else hi = mid;
    }
    const a = arr[lo];
    const b = arr[hi];
    if (b[0] === a[0]) return a[1];
    return a[1] + (b[1] - a[1]) * (t - a[0]) / (b[0] - a[0]);
  }

  // Index of the first sample with t >= x (binary search; arr.length if none).
  function firstIndexAtOrAfter(arr, x) {
    let lo = 0;
    let hi = arr.length;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (arr[mid][0] < x) lo = mid + 1; else hi = mid;
    }
    return lo;
  }

  function earthFormat(key, v) {
    if (v === null) return '—';
    if (key === 'co2') return Math.round(v) + ' ppm';
    if (key === 'temp') return (v > 0 ? '+' : '') + v.toFixed(1) + '°';
    return (v > 0 ? '+' : '') + Math.round(v) + ' m';
  }

  function earthReadout(t) {
    const series = earthSeries();
    if (!series) return '—';
    return EARTH_ORDER.map(function (k) { return earthFormat(k, seriesAt(series[k], t, EARTH_HOLD[k])); }).join(' · ');
  }

  function renderEarth(v, axisY) {
    const series = earthSeries();
    const g = dom.gEarth;
    if (!series || !earthOn) { g.replaceChildren(); return; }
    const w = size.width;
    const h = size.height;
    const top = axisY + 46;                              // below the tick labels
    let floor = h - 108;                                 // above the HUD and dock
    if (size.hudTop > top) floor = Math.min(floor, size.hudTop - 10);
    const bottom = Math.min(floor, top + 150);
    if (bottom - top < 48) { g.replaceChildren(); return; }
    const frag = document.createDocumentFragment();
    const meta = (HT.earth && HT.earth.meta) || {};
    const step = Math.max(1, Math.floor(w / 700));       // px per sample when the view is dense
    for (let s = 0; s < EARTH_ORDER.length; s++) {
      const key = EARTH_ORDER[s];
      const arr = series[key];
      if (!arr || arr.length < 2) continue;
      const range = (meta[key] && meta[key].range) || [0, 1];
      const y = function (val) { return bottom - (val - range[0]) / (range[1] - range[0]) * (bottom - top); };
      // Points: interpolated value at each view edge plus every sample inside the view. When samples are
      // sparser than pixels we draw them all; when denser, we thin to one per `step` px.
      const pts = [];
      const v0 = seriesAt(arr, v.start, EARTH_HOLD[key]);
      if (v0 !== null) pts.push([0, y(v0)]);
      let lastPx = -Infinity;
      for (let i = firstIndexAtOrAfter(arr, v.start); i < arr.length; i++) {
        const t = arr[i][0];
        if (t > v.end) break;
        const px = tToPx(t, v);
        if (px - lastPx < step) continue;
        lastPx = px;
        pts.push([px, y(arr[i][1])]);
      }
      const v1 = seriesAt(arr, v.end, EARTH_HOLD[key]);
      if (v1 !== null) pts.push([w, y(v1)]);
      if (pts.length < 2) continue;
      const d = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
      if (key === 'co2') {
        frag.appendChild(svgEl('path', { class: 'earth-fill co2', d: d + ' L' + w + ' ' + bottom + ' L0 ' + bottom + ' Z' }));
      }
      frag.appendChild(svgEl('path', { class: 'earth-line ' + key, d: d }));
      // Stacked legend at the band's top-left: series name and the value at the view's end.
      const label = svgEl('text', { class: 'earth-label ' + key, x: 10, y: top + 12 + s * 13, 'text-anchor': 'start' });
      const k = svgEl('tspan', { class: 'k' }, (meta[key] && meta[key].label ? meta[key].label : key) + ' ');
      const val = svgEl('tspan', { class: 'v' }, earthFormat(key, v1 !== null ? v1 : (pts.length ? null : null)));
      label.appendChild(k);
      label.appendChild(val);
      frag.appendChild(label);
    }
    frag.appendChild(svgEl('line', { class: 'earth-base', x1: 0, x2: w, y1: crisp(bottom), y2: crisp(bottom) }));
    g.replaceChildren(frag);
  }

  function setEarth(on) {
    earthOn = !!on;
    try { root.localStorage.setItem(EARTH_KEY, earthOn ? '1' : '0'); } catch (err) { /* ignore */ }
    if (dom && dom.btnEarth) dom.btnEarth.setAttribute('aria-pressed', String(earthOn));
    if (dom && shown) render();
  }

  // Today's position on the axis, drawn when it is in view (the HUD beacon lights up with it).
  function renderNowMarker(v, axisY) {
    const now = nowT();
    const inView = now >= v.start && now <= v.end;
    if (!inView) { dom.gNow.replaceChildren(); return; }
    const x = crisp(tToPx(now, v));
    dom.gNow.replaceChildren(
      svgEl('line', { class: 'now-marker', x1: x, x2: x, y1: axisY - 14, y2: axisY + 14 }),
      svgEl('circle', { class: 'now-dot', cx: x, cy: axisY, r: 3, fill: 'var(--accent)' })
    );
  }

  // --- HUD telemetry ---
  function fmtSpan(years) {
    if (years >= 1) return Math.round(years).toLocaleString('en-US') + ' Y';
    const days = years * 365.25;
    if (days >= 1) return (days >= 10 ? Math.round(days) : days.toFixed(1)) + ' D';
    return Math.max(1, Math.round(days * 24)) + ' H';
  }

  function updateHud(v) {
    if (!dom || !dom.hudSpan) return;
    const span = v.end - v.start;
    dom.hudSpan.textContent = fmtSpan(span);
    dom.hudEvents.textContent = hudStats.visible + ' / ' + hudStats.inWindow;
    dom.hudTier.textContent = '\u2264 ' + hudStats.tier;
    dom.hudScale.textContent = '1 px = ' + fmtSpan(span / Math.max(1, size.width));
    const now = nowT();
    dom.hudNow.hidden = !(now >= v.start && now <= v.end);
    if (dom.hudEarth) dom.hudEarth.textContent = earthReadout(lastMouseX !== null ? pxToT(lastMouseX - svgLeft(), v) : v.end);
  }

  function tickClock() {
    if (!dom || !dom.hudClock) return;
    const d = new Date();
    const p = function (n) { return (n < 10 ? '0' : '') + n; };
    dom.hudClock.textContent = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
      ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  // --- Themes (sensor modes) ---
  function resolveTheme(name) {
    if (name !== 'auto') return name;
    const light = typeof root.matchMedia === 'function' && root.matchMedia('(prefers-color-scheme: light)').matches;
    return light ? 'paper' : 'ops';
  }

  function applyTheme() {
    if (typeof document === 'undefined') return;
    const t = resolveTheme(theme);
    document.documentElement.setAttribute('data-theme', t);
    if (dom && dom.dock) {
      const bs = dom.dock.querySelectorAll('button[data-theme]');
      for (let i = 0; i < bs.length; i++) bs[i].setAttribute('aria-pressed', String(bs[i].dataset.theme === t));
    }
    if (dom && dom.hudMode) dom.hudMode.textContent = t.toUpperCase();
  }

  function setTheme(name, opts) {
    if (name !== 'auto' && THEMES.indexOf(name) < 0) return;
    theme = name;
    try {
      if (name === 'auto') root.localStorage.removeItem(THEME_KEY);
      else root.localStorage.setItem(THEME_KEY, name);
    } catch (err) { /* storage may be unavailable */ }
    applyTheme();
    if (dom && view && !(opts && opts.silent)) writeUrl('replace');
  }

  function getTheme() { return theme; }

  // --- Axis and ticks ---
  function renderTicks(v, axisY) {
    const w = size.width;
    const minor = document.createDocumentFragment();
    const major = document.createDocumentFragment();
    const labels = document.createDocumentFragment();
    if (HT.ticks && typeof HT.ticks.computeTicks === 'function') {
      const ticks = HT.ticks.computeTicks(v.start, v.end, w, { labelWidth: measureTickLabel });
      const labelGap = (HT.ticks.DEFAULTS && HT.ticks.DEFAULTS.labelGap) || 12;
      let prevRight = -Infinity;                        // right edge of the last label actually drawn
      for (let i = 0; i < ticks.minor.length; i++) {
        const x = crisp(tToPx(ticks.minor[i], v));
        minor.appendChild(svgEl('line', { class: 'tick minor', x1: x, x2: x, y1: axisY, y2: axisY + 6 }));
      }
      for (let i = 0; i < ticks.major.length; i++) {
        const m = ticks.major[i];
        const x = crisp(tToPx(m.t, v));
        major.appendChild(svgEl('line', { class: 'tick major', x1: x, x2: x, y1: axisY - 8, y2: axisY + 12 }));
        if (m.labeled) {
          const half = measureTickLabel(m.label) / 2;
          // Edge labels are nudged inside the view. That can undo the centred-label thinning done
          // by computeTicks, so re-check against the previous drawn label and drop on collision.
          const lx = half * 2 + EDGE_PAD * 2 < w ? clamp(x, half + EDGE_PAD, w - half - EDGE_PAD) : x;
          if (lx - half < prevRight + labelGap) continue;
          prevRight = lx + half;
          labels.appendChild(svgEl('text', { class: 'tick-label', x: lx, y: axisY + 28, 'text-anchor': 'middle' }, m.label));
        }
      }
    }
    dom.gMinor.replaceChildren(minor);
    dom.gMajor.replaceChildren(major);
    dom.gLabels.replaceChildren(labels);
    dom.gAxis.replaceChildren(svgEl('line', { class: 'axis', x1: 0, x2: w, y1: crisp(axisY), y2: crisp(axisY) }));
  }

  // Base visibility comes from the tier table; when a window is sparse (deep prehistory, or a
  // narrow slice of an eventful era) lower tiers are admitted until MIN_VISIBLE events are in view
  // or the tiers run out. Lane packing still trims whatever does not fit.
  function effectiveTier(list, v, span) {
    const maxTier = HT.tiers.MAX_TIER;
    const base = HT.tiers.tierForSpan(span);
    const counts = [];
    for (let k = 0; k <= maxTier; k++) counts.push(0);
    for (let i = 0; i < list.length; i++) {
      const ev = list[i];
      const tEnd = hasEnd(ev) ? ev.end : ev.t;
      if (tEnd < v.start || ev.t > v.end) continue;
      counts[clamp(ev.tier, 0, maxTier)]++;
    }
    let n = 0;
    for (let k = 0; k <= base; k++) n += counts[k];
    let tier = base;
    while (n < MIN_VISIBLE && tier < maxTier) { tier++; n += counts[tier]; }
    return tier;
  }

  // --- Events: markers on the axis, labels packed into lanes stacked upward ---
  function renderEvents(v, axisY) {
    const w = size.width;
    const span = v.end - v.start;
    const list = events();
    const colors = (HT.tiers && HT.tiers.COLORS) || {};
    const maxLanes = clamp(Math.floor((axisY - LANE_TOP_PAD) / LANE_PITCH), 1, MAX_LANES);
    const maxLabelW = Math.max(60, Math.min(320, w * 0.6));
    const items = [];
    const meta = [];
    const tierLimit = effectiveTier(list, v, span);
    let inWindow = 0;

    for (let i = 0; i < list.length; i++) {
      const ev = list[i];
      if (ev.tier > tierLimit) continue;
      const ranged = hasEnd(ev);
      const tEnd = ranged ? ev.end : ev.t;
      if (tEnd < v.start || ev.t > v.end) continue;
      inWindow++;

      const x = tToPx(ev.t, v);
      const xEnd = ranged ? tToPx(tEnd, v) : x;
      const bx0 = clamp(x, 0, w);                       // on-screen extent of the marker/bar
      const bx1 = clamp(xEnd, 0, w);
      // Label to the right of the marker (or of the bar's visible left end); flip to the left
      // when it would overflow and the left side has room (or more room than the right). Whichever
      // side is used, the label is truncated to the room actually available so it never leaves the stage.
      const rightX = ranged ? bx0 + 2 : x + MARKER_R + LABEL_GAP;
      const leftX = ranged ? bx1 - 2 : x - MARKER_R - LABEL_GAP;
      const roomR = w - EDGE_PAD - rightX;
      const roomL = leftX - EDGE_PAD;
      const fullW = measureEventLabel(ev.title);
      let anchor = 'start';
      let ax = rightX;
      let room = roomR;
      if (fullW > roomR && (roomL >= Math.min(fullW, maxLabelW) || roomL > roomR)) {
        anchor = 'end';
        ax = leftX;
        room = roomL;
      }
      const text = fitLabel(ev.title, Math.max(24, Math.min(maxLabelW, room)));
      const lw = measureEventLabel(text);
      const lx0 = anchor === 'start' ? ax : ax - lw;
      const lx1 = lx0 + lw;
      const stemX = ranged ? bx0 : x;
      items.push({ x0: Math.min(lx0, stemX - 2), x1: Math.max(lx1, stemX + 2), priority: ev.tier });
      meta.push({ index: i, ev: ev, ranged: ranged, x: x, bx0: bx0, bx1: bx1, text: text, ax: ax, anchor: anchor, stemX: stemX });
    }

    let placed;
    if (HT.layout && typeof HT.layout.packLanes === 'function') {
      placed = HT.layout.packLanes(items, { gap: 8, maxLanes: maxLanes }).placed;
    } else {
      placed = items.map(function (_, i) { return { index: i, lane: 0 }; });
    }
    // Higher lanes first so lower-lane labels paint over stems that pass through them.
    placed = placed.slice().sort(function (a, b) { return b.lane - a.lane || a.index - b.index; });

    const frag = document.createDocumentFragment();
    for (let k = 0; k < placed.length; k++) {
      const m = meta[placed[k].index];
      const ev = m.ev;
      const lane = placed[k].lane;
      const baseline = axisY - LANE_BASE_OFFSET - lane * LANE_PITCH;
      const color = colors[ev.category] || 'currentColor';
      const g = svgEl('g', {
        class: 'event cat-' + ev.category + ' tier-' + ev.tier + (m.ranged ? ' ranged' : ' point') +
               (m.index === selected ? ' selected' : '') + (settleNext ? ' arrive' : ''),
        id: 'ev-' + m.index,
        'data-index': m.index,
        tabindex: 0,
        role: 'button',
        'aria-label': ev.title + ', ' + eventDateLabel(ev)
      });
      // Invisible hit areas: a generous pad around the marker/bar and the label's box, so a tap
      // does not have to land on a 10px dot (a miss would zoom instead of opening the event).
      const lw = measureEventLabel(m.text);
      g.appendChild(svgEl('rect', {
        class: 'hit', x: (m.anchor === 'start' ? m.ax : m.ax - lw) - 4, y: baseline - 13, width: lw + 8, height: 18
      }));
      if (m.ranged) {
        g.appendChild(svgEl('rect', { class: 'hit', x: m.bx0, y: axisY - 12, width: Math.max(1, m.bx1 - m.bx0), height: 24 }));
      } else {
        g.appendChild(svgEl('circle', { class: 'hit', cx: m.x, cy: axisY, r: 14 }));
      }
      const stemTop = baseline + 3;
      const stemBottom = m.ranged ? axisY - BAR_H / 2 - 1 : axisY - MARKER_R - 1;
      if (stemBottom > stemTop && (!m.ranged || m.x >= 0)) {
        g.appendChild(svgEl('line', {
          class: 'stem', x1: crisp(m.stemX), x2: crisp(m.stemX), y1: stemTop, y2: stemBottom,
          stroke: color, 'stroke-opacity': 0.4
        }));
      }
      if (settleNext) g.style.setProperty('--i', String(k));
      if (m.ranged) {
        g.appendChild(svgEl('rect', {
          class: 'bar', x: m.bx0, y: axisY - BAR_H / 2, width: Math.max(1, m.bx1 - m.bx0), height: BAR_H, rx: 1.5, fill: color
        }));
      } else {
        if (ev.tier <= 1) g.appendChild(svgEl('circle', { class: 'pulse', cx: m.x, cy: axisY, r: MARKER_R, stroke: color }));
        g.appendChild(svgEl('circle', { class: 'marker', cx: m.x, cy: axisY, r: MARKER_R, fill: color }));
      }
      g.appendChild(svgEl('text', { class: 'label', x: m.ax, y: baseline, 'text-anchor': m.anchor }, m.text));
      frag.appendChild(g);
    }
    dom.gEvents.replaceChildren(frag);
    hudStats = { visible: placed.length, inWindow: inWindow, tier: tierLimit };
  }

  // --- Cursor guide line + header readout ---
  function updateCursor(clientX) {
    if (!dom || !shown) return;
    const px = clientX - svgLeft();
    if (px < 0 || px > size.width) { hideCursor(); return; }
    dom.cursorLine.setAttribute('x1', crisp(px));
    dom.cursorLine.setAttribute('x2', crisp(px));
    dom.cursorLine.setAttribute('visibility', 'visible');
    const label = cursorLabel(pxToT(px, shown), shown.end - shown.start);
    dom.cursorDate.textContent = label;
    if (dom.hudEarth) dom.hudEarth.textContent = earthReadout(pxToT(px, shown));
    if (dom.cursorChip) {
      if (dom.cursorChip.textContent !== label) {     // measure only when the text changes (no layout per mousemove)
        dom.cursorChip.textContent = label;
        dom.cursorChip.hidden = false;
        chipHalf = dom.cursorChip.offsetWidth / 2 + 6;
      }
      dom.cursorChip.hidden = false;
      const half = chipHalf;
      dom.cursorChip.style.left = Math.round(clamp(px, half, size.width - half)) + 'px';
      dom.cursorChip.style.top = (lastAxisY + 40) + 'px';
    }
  }

  function hideCursor() {
    if (!dom) return;
    dom.cursorLine.setAttribute('visibility', 'hidden');
    if (dom.cursorChip) dom.cursorChip.hidden = true;
  }

  // --- Breadcrumbs ---
  function renderCrumbs() {
    if (!dom) return;
    const frag = document.createDocumentFragment();
    const last = stack.length - 1;
    for (let i = 0; i < stack.length; i++) {
      const e = stack[i];
      const b = htmlEl('button', 'crumb' + (i === last ? ' current' : ''),
        i === 0 ? ROOT_CRUMB : HT.time.formatRange(e.start, e.end));
      b.type = 'button';
      b.dataset.index = String(i);
      if (i === last) b.setAttribute('aria-current', 'page');
      frag.appendChild(b);
    }
    dom.crumbs.replaceChildren(frag);
    dom.crumbs.scrollLeft = dom.crumbs.scrollWidth;     // keep the current crumb in view when the chain is long
    dom.btnOut.disabled = stack.length <= 1 && isRoot(view);
  }

  function onCrumbClick(e) {
    const b = e.target && typeof e.target.closest === 'function' ? e.target.closest('.crumb') : null;
    if (!b) return;
    const i = Number(b.dataset.index);
    if (!(i >= 0) || i >= stack.length - 1) return;
    stack.length = i + 1;
    commit(stack[i], { animate: true, url: 'push', stack: 'keep' });
  }

  // --- Legend ---
  function renderLegend() {
    const cats = (HT.tiers && HT.tiers.CATEGORIES) || [];
    const colors = (HT.tiers && HT.tiers.COLORS) || {};
    const frag = document.createDocumentFragment();
    for (let i = 0; i < cats.length; i++) {
      const item = htmlEl('span', 'legend-item');
      const swatch = document.createElement('i');
      swatch.style.background = colors[cats[i]] || 'currentColor';
      item.appendChild(swatch);
      item.appendChild(document.createTextNode(cats[i]));
      frag.appendChild(item);
    }
    dom.legend.replaceChildren(frag);
  }

  function toggleLegend(force) {
    const open = force === undefined ? dom.legend.hidden : !!force;
    dom.legend.hidden = !open;
    dom.btnLegend.setAttribute('aria-expanded', String(open));
  }

  // ------------------------------------------------------------------
  // 6. Tooltip and detail panel
  // ------------------------------------------------------------------
  function showTooltip(index, clientX, clientY) {
    const ev = events()[index];
    if (!ev) { hideTooltip(); return; }
    const tip = dom.tooltip;
    if (tip.dataset.index !== String(index)) {
      tip.replaceChildren(
        htmlEl('div', 'tt-title', ev.title),
        htmlEl('div', 'tt-date', eventDateLabel(ev)),
        htmlEl('div', 'tt-detail', ev.detail)
      );
      tip.dataset.index = String(index);
    }
    tip.hidden = false;
    positionTooltip(clientX, clientY);
  }

  // Near the pointer, flipped/clamped so it stays inside the stage.
  function positionTooltip(clientX, clientY) {
    const tip = dom.tooltip;
    const rect = dom.stage.getBoundingClientRect();
    const tw = tip.offsetWidth;
    const th = tip.offsetHeight;
    let x = clientX - rect.left + 14;
    let y = clientY - rect.top + 16;
    if (x + tw > rect.width - 8) x = clientX - rect.left - 14 - tw;
    if (y + th > rect.height - 8) y = clientY - rect.top - 12 - th;
    x = Math.max(8, Math.min(x, Math.max(8, rect.width - tw - 8)));
    y = Math.max(8, y);
    tip.style.left = Math.round(x) + 'px';
    tip.style.top = Math.round(y) + 'px';
  }

  function hideTooltip() {
    if (!dom || dom.tooltip.hidden) return;
    dom.tooltip.hidden = true;
    delete dom.tooltip.dataset.index;
  }

  function openPanel(index) {
    const ev = events()[index];
    if (!ev) return;
    selected = index;
    const cat = String(ev.category || '');
    const colors = (HT.tiers && HT.tiers.COLORS) || {};
    dom.panelCategory.textContent = cat ? cat.charAt(0).toUpperCase() + cat.slice(1) : '';
    dom.panelCategory.className = cat ? 'cat-' + cat : '';
    dom.panelCategory.dataset.category = cat;
    dom.panelTitle.textContent = ev.title;
    dom.panelDate.textContent = eventDateLabel(ev);
    dom.panelDetail.textContent = ev.detail || '';
    if (typeof ev.link === 'string' && /^https:\/\//.test(ev.link)) {
      dom.panelLink.href = ev.link;
      dom.panelLink.textContent = /^https:\/\/[a-z-]+\.wikipedia\.org\//.test(ev.link) ? 'Read more on Wikipedia ↗' : 'Read more ↗';
      dom.panelLink.hidden = false;
    } else {
      dom.panelLink.hidden = true;
      dom.panelLink.removeAttribute('href');
    }
    hideTooltip();
    const wasHidden = dom.panel.hidden;
    dom.panel.hidden = false;
    document.body.classList.add('panel-open');
    markSelected();
    if (wasHidden) afterLayoutChange();
    try { dom.panel.focus({ preventScroll: true }); } catch (err) { /* ignore */ }
  }

  function closePanel() {
    if (!dom || dom.panel.hidden) return;
    dom.panel.hidden = true;
    document.body.classList.remove('panel-open');
    const was = selected >= 0 ? dom.gEvents.querySelector('.event[data-index="' + selected + '"]') : null;
    if (was) { try { was.focus({ preventScroll: true }); } catch (err) { /* ignore */ } }
    selected = -1;
    markSelected();
    afterLayoutChange();
  }

  function markSelected() {
    const nodes = dom.gEvents.querySelectorAll('.event');
    for (let i = 0; i < nodes.length; i++) {
      nodes[i].classList.toggle('selected', Number(nodes[i].dataset.index) === selected);
    }
  }

  // The panel pushes the timeline (grid reflow), so the stage size changes without a window resize.
  function afterLayoutChange() {
    if (typeof root.requestAnimationFrame === 'function') root.requestAnimationFrame(render);
    else render();
  }

  // ------------------------------------------------------------------
  // 7. Interaction
  // ------------------------------------------------------------------

  // --- Pointer: tap (zoom / open event), drag (pan), two-finger pinch (zoom) ---
  function onPointerDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    hideTooltip();
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { dom.svg.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    if (pointers.size === 1) {
      gesture = {
        type: 'press', id: e.pointerId, x0: e.clientX, y0: e.clientY,
        target: e.target, shift: e.shiftKey, view: shown, moved: false
      };
    } else if (pointers.size === 2) {
      startPinch();
    } else {
      gesture = null;                                   // three or more fingers: ignore the gesture
    }
    if (e.pointerType === 'mouse') e.preventDefault();  // no text selection while dragging
  }

  function onPointerMove(e) {
    const p = pointers.get(e.pointerId);
    if (p) { p.x = e.clientX; p.y = e.clientY; }
    if (gesture && gesture.type === 'pinch') {
      if (p) updatePinch();
      return;
    }
    if (gesture && gesture.type === 'press' && p && e.pointerId === gesture.id) {
      if (!gesture.moved) {
        const dx = e.clientX - gesture.x0;
        const dy = e.clientY - gesture.y0;
        if (Math.hypot(dx, dy) > DRAG_THRESHOLD) {
          gesture.moved = true;                         // becomes a drag: no zoom on release
          cancelAnimation();                            // freeze the view where it is and pan from there
          gesture.view = shown;
          hideTooltip();
          dom.svg.classList.add('dragging');
        }
      }
      if (gesture.moved) {
        const v = gesture.view;
        const dt = (e.clientX - gesture.x0) / size.width * (v.end - v.start);
        commit({ start: v.start - dt, end: v.end - dt },
          { animate: false, url: 'replace', stack: 'replace', discrete: false });
        if (e.pointerType !== 'touch') updateCursor(e.clientX);
        return;
      }
    }
    if (e.pointerType !== 'touch') updateHover(e);
  }

  function onPointerUp(e) {
    pointers.delete(e.pointerId);
    try { dom.svg.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    if (!gesture) return;
    if (gesture.type === 'pinch') {
      if (pointers.size < 2) endPinch();
      return;
    }
    if (gesture.type === 'press' && e.pointerId === gesture.id) {
      const g = gesture;
      gesture = null;
      dom.svg.classList.remove('dragging');
      if (g.moved) {
        suppressClickUntil = root.performance.now() + 400;
        return;
      }
      if (e.type === 'pointercancel') {                 // resync if the press interrupted an animation
        if (!sameView(shown, view)) { shown = view; render(); }
        return;
      }
      handleTap(g, e);
    }
  }

  function handleTap(g, e) {
    const evG = closestEvent(g.target);
    if (evG) {                                          // event tap opens the panel and never zooms
      openPanel(Number(evG.dataset.index));
      return;
    }
    const t = pxToT(e.clientX - svgLeft(), shown);
    if (e.shiftKey || g.shift) zoomOut();
    else zoomIn(t);
  }

  // Native click events are only used to stop propagation for event markers; taps are
  // resolved in pointerup so that pointer capture cannot change the target.
  function onClick(e) {
    if (root.performance.now() < suppressClickUntil) { e.preventDefault(); e.stopPropagation(); return; }
    if (closestEvent(e.target)) e.stopPropagation();
  }

  function startPinch() {
    cancelAnimation();
    hideTooltip();
    hideCursor();
    const ids = Array.from(pointers.keys());
    const a = pointers.get(ids[0]);
    const b = pointers.get(ids[1]);
    const left = svgLeft();
    gesture = {
      type: 'pinch', ids: ids, view: shown,
      t1: pxToT(a.x - left, shown), t2: pxToT(b.x - left, shown)
    };
  }

  // Keep the t under each finger fixed: solve the linear px = (t - start) * scale.
  function updatePinch() {
    const g = gesture;
    const pa = pointers.get(g.ids[0]);
    const pb = pointers.get(g.ids[1]);
    if (!pa || !pb) return;
    const left = svgLeft();
    const q1 = pa.x - left;
    const q2 = pb.x - left;
    if (Math.abs(q2 - q1) < 10 || g.t2 === g.t1) return;
    const scale = (q2 - q1) / (g.t2 - g.t1);           // px per year
    if (!(scale > 0)) return;                           // fingers crossed
    const start = g.t1 - q1 / scale;
    commit({ start: start, end: start + size.width / scale },
      { animate: false, url: 'replace', stack: 'replace', discrete: false });
  }

  function endPinch() {
    const rest = Array.from(pointers.entries());
    if (rest.length === 1) {                            // one finger left: continue as a pan
      const id = rest[0][0];
      const p = rest[0][1];
      gesture = { type: 'press', id: id, x0: p.x, y0: p.y, target: null, shift: false, view: shown, moved: true };
      dom.svg.classList.add('dragging');
    } else {
      gesture = null;
      dom.svg.classList.remove('dragging');
    }
    suppressClickUntil = root.performance.now() + 400;
  }

  function onPointerLeave() {
    lastMouseX = null;
    hideCursor();
    hideTooltip();
  }

  function updateHover(e) {
    lastMouseX = e.clientX;
    const evG = closestEvent(e.target);
    if (evG) showTooltip(Number(evG.dataset.index), e.clientX, e.clientY);
    else hideTooltip();
    updateCursor(e.clientX);
  }

  // --- Wheel / trackpad: zoom around the cursor; horizontal delta (or Shift) pans ---
  function onWheel(e) {
    e.preventDefault();
    if (!shown) return;
    cancelAnimation();
    hideTooltip();
    let dy = e.deltaY;
    let dx = e.deltaX;
    if (e.deltaMode === 1) { dy *= 16; dx *= 16; }
    else if (e.deltaMode === 2) { dy *= size.height; dx *= size.width; }
    const v = shown;
    const left = svgLeft();
    const tc = pxToT(e.clientX - left, v);
    let f = 1;
    let panPx = dx;
    if (e.shiftKey && !e.ctrlKey) panPx += dy;
    else f = clamp(Math.exp(dy * (e.ctrlKey ? PINCH_K : WHEEL_K)), 0.5, 2);
    let start = tc - (tc - v.start) * f;
    let end = tc + (v.end - tc) * f;
    const dt = panPx / size.width * (end - start);
    start += dt;
    end += dt;
    commit({ start: start, end: end }, { animate: false, url: 'replace', stack: 'replace', discrete: false });
    updateCursor(e.clientX);
  }

  // --- Keyboard ---
  function onKeyDown(e) {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
    const el = e.target;
    const tag = el && el.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (el && el.isContentEditable)) return;
    switch (e.key) {
      case 'Escape':
        if (!dom.panel.hidden) { closePanel(); e.preventDefault(); }
        else if (!dom.legend.hidden) { toggleLegend(false); e.preventDefault(); }
        else hideTooltip();
        break;
      case '-':
      case '_':
        zoomOut();
        e.preventDefault();
        break;
      case '0':
        home();
        e.preventDefault();
        break;
      case 'Enter':
      case ' ': {
        const evG = closestEvent(e.target);             // a focused event marker opens its panel
        if (evG) { openPanel(Number(evG.dataset.index)); e.preventDefault(); }
        break;
      }
      case '+':
      case '=':
        zoomIn((shown.start + shown.end) / 2);
        e.preventDefault();
        break;
      case '1': case '2': case '3': case '4': case '5': case '6':
        setTheme(THEMES[Number(e.key) - 1]);
        e.preventDefault();
        break;
      case 'e':
      case 'E':
        setEarth(!earthOn);
        e.preventDefault();
        break;
      case 't':
      case 'T': {
        const cur = THEMES.indexOf(resolveTheme(theme));
        setTheme(THEMES[(cur + 1) % THEMES.length]);
        e.preventDefault();
        break;
      }
      default:
        break;
    }
  }

  // --- Resize: window resize and stage size changes (panel open/close), debounced 100ms ---
  function onResize() {
    if (dom && shown) {                                  // cheap part right away: keep the SVG 1:1 with its box
      measureSize();
      dom.svg.setAttribute('width', size.width);
      dom.svg.setAttribute('height', size.height);
      dom.svg.setAttribute('viewBox', '0 0 ' + size.width + ' ' + size.height);
    }
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      resizeTimer = 0;
      widthCache.clear();                               // fonts may change with the viewport
      render();
    }, RESIZE_DEBOUNCE_MS);
  }

  // --- Browser history: popstate (back/forward) and hashchange (manual edits) ---
  function onLocationChange(e) {
    discardPendingUrl();
    const target = parseHash(root.location.hash) || rootView();
    if (sameView(target, view)) return;
    const saved = e && e.state && e.state.ht ? restoreStack(e.state.stack, target) : null;
    stack = saved || deriveStack(target);
    commit(target, { animate: true, url: 'none', stack: 'keep' });
  }

  function bindEvents() {
    const svg = dom.svg;
    svg.addEventListener('pointerdown', onPointerDown);
    svg.addEventListener('pointermove', onPointerMove);
    svg.addEventListener('pointerup', onPointerUp);
    svg.addEventListener('pointercancel', onPointerUp);
    svg.addEventListener('pointerleave', onPointerLeave);
    svg.addEventListener('click', onClick);
    svg.addEventListener('wheel', onWheel, { passive: false });
    svg.addEventListener('dblclick', function (e) { e.preventDefault(); });
    // Safari's own pinch-zoom gesture events
    svg.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    svg.addEventListener('gesturechange', function (e) { e.preventDefault(); });

    dom.btnOut.addEventListener('click', function () { zoomOut(); });
    dom.btnHome.addEventListener('click', function () { home(); });
    dom.btnLegend.addEventListener('click', function () { toggleLegend(); });
    dom.crumbs.addEventListener('click', onCrumbClick);
    dom.panelClose.addEventListener('click', closePanel);
    dom.panelZoom.addEventListener('click', function () {
      const ev = events()[selected];
      if (ev) zoomToEvent(ev);
    });

    document.addEventListener('keydown', onKeyDown);
    root.addEventListener('resize', onResize);
    root.addEventListener('popstate', onLocationChange);
    root.addEventListener('hashchange', onLocationChange);
    if (typeof root.ResizeObserver === 'function') {
      const ro = new root.ResizeObserver(onResize);
      ro.observe(dom.stage);
    }
  }

  // ------------------------------------------------------------------
  // 8. init
  // ------------------------------------------------------------------
  function buildSvgScaffold() {
    const svg = dom.svg;
    svg.style.touchAction = 'none';                     // we handle pan/pinch ourselves
    svg.style.userSelect = 'none';
    svg.style.webkitUserSelect = 'none';
    dom.gMinor = svgEl('g', { class: 'g-minor' });
    dom.gMajor = svgEl('g', { class: 'g-major' });
    dom.gLabels = svgEl('g', { class: 'g-labels' });
    dom.gAxis = svgEl('g', { class: 'g-axis' });
    dom.gEvents = svgEl('g', { class: 'g-events' });
    dom.gEarth = svgEl('g', { class: 'g-earth', 'pointer-events': 'none' });
    dom.gNow = svgEl('g', { class: 'g-now', 'pointer-events': 'none' });
    dom.gCursor = svgEl('g', { class: 'g-cursor', 'pointer-events': 'none' });
    dom.cursorLine = svgEl('line', { class: 'cursor-line', x1: 0, x2: 0, y1: 0, y2: 0, visibility: 'hidden' });
    dom.gCursor.appendChild(dom.cursorLine);
    const gMeasure = svgEl('g', { class: 'g-measure', visibility: 'hidden', 'pointer-events': 'none', 'aria-hidden': 'true' });
    measureTickEl = svgEl('text', { class: 'tick-label', x: -1000, y: -1000 });
    const measureEvent = svgEl('g', { class: 'event' });
    measureLabelEl = svgEl('text', { class: 'label', x: -1000, y: -1000 });
    measureEvent.appendChild(measureLabelEl);
    gMeasure.appendChild(measureTickEl);
    gMeasure.appendChild(measureEvent);
    svg.replaceChildren(dom.gMinor, dom.gMajor, dom.gEarth, dom.gLabels, dom.gAxis, dom.gNow, dom.gEvents, dom.gCursor, gMeasure);

    // The tooltip is positioned in stage coordinates; make sure the stage is its containing block.
    dom.tooltip.style.position = 'absolute';
    dom.tooltip.style.pointerEvents = 'none';
    if (root.getComputedStyle(dom.stage).position === 'static') dom.stage.style.position = 'relative';
    if (!dom.panel.hasAttribute('tabindex')) dom.panel.tabIndex = -1;
  }

  function init() {
    if (inited) return;
    if (typeof document === 'undefined') return;
    const $ = function (id) { return document.getElementById(id); };
    const svg = $('timeline');
    if (!svg) return;
    inited = true;
    dom = {
      app: $('app'), header: $('header'), crumbs: $('crumbs'), cursorDate: $('cursor-date'),
      btnOut: $('btn-out'), btnHome: $('btn-home'), btnLegend: $('btn-legend'),
      stage: $('stage') || svg.parentNode, svg: svg, tooltip: $('tooltip'), legend: $('legend'),
      panel: $('panel'), panelClose: $('panel-close'), panelCategory: $('panel-category'),
      panelTitle: $('panel-title'), panelDate: $('panel-date'), panelDetail: $('panel-detail'),
      panelZoom: $('panel-zoom'),
      panelLink: $('panel-link'),
      dock: $('dock'), cursorChip: $('cursor-chip'),
      hudSpan: $('hud-span'), hudEvents: $('hud-events'), hudTier: $('hud-tier'), hudScale: $('hud-scale'),
      hudMode: $('hud-mode'), hudClock: $('hud-clock'), hudNow: $('hud-now'),
      hudEarth: $('hud-earth'), btnEarth: $('btn-earth'), hud: $('hud')
    };
    NOW = HT.time.now();
    // Theme: URL param (read in parseHash below) > stored choice > auto.
    try { const stored = root.localStorage.getItem(THEME_KEY); if (stored && THEMES.indexOf(stored) >= 0) theme = stored; } catch (err) { /* ignore */ }
    applyTheme();
    if (typeof root.matchMedia === 'function') {
      const mq = root.matchMedia('(prefers-color-scheme: light)');
      const onScheme = function () { if (theme === 'auto') applyTheme(); };
      if (typeof mq.addEventListener === 'function') mq.addEventListener('change', onScheme);
      else if (typeof mq.addListener === 'function') mq.addListener(onScheme);
    }
    if (dom.dock) {
      dom.dock.addEventListener('click', function (e) {
        const b = e.target && typeof e.target.closest === 'function' ? e.target.closest('button[data-theme]') : null;
        if (b) setTheme(b.dataset.theme);
      });
    }
    tickClock();
    clockTimer = setInterval(tickClock, 1000);
    try { earthOn = root.localStorage.getItem(EARTH_KEY) !== '0'; } catch (err) { /* ignore */ }
    if (dom.btnEarth) {
      dom.btnEarth.setAttribute('aria-pressed', String(earthOn));
      dom.btnEarth.addEventListener('click', function () { setEarth(!earthOn); });
    }
    buildSvgScaffold();
    renderLegend();

    // Initial view from the hash; breadcrumb chain from history.state when a reload preserved it.
    const parsed = parseHash(root.location.hash);
    view = parsed || rootView();
    const saved = root.history && root.history.state && root.history.state.ht
      ? restoreStack(root.history.state.stack, view) : null;
    stack = saved || deriveStack(view);
    shown = view;
    stampState();
    applyTheme();                                        // parseHash may have picked a theme from the URL

    bindEvents();
    settleNext = true;
    render();
    renderCrumbs();
  }

  HT.app = {
    init: init,
    setView: setView,
    zoomIn: zoomIn,
    zoomOut: zoomOut,
    home: home,
    zoomToEvent: zoomToEvent,
    getView: getView,
    setTheme: setTheme,
    getTheme: getTheme,
    setEarth: setEarth,
    THEMES: THEMES.slice()
  };
})(typeof window !== 'undefined' ? window : globalThis);

/* ======== bootstrap ======== */
HT.app.init();
</script>
</body>
</html>
